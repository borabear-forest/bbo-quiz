<!doctype html>
<html lang="ko">
<head>

<title>청소년활동론</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--bg:#f7f4ef;--paper:#fffefb;--ink:#1c1a17;--muted:#7a7268;--line:#e3ddd4;--accent:#1a3258;--soft:#eaeff6;--radius:14px;--shadow:0 2px 16px rgba(28,26,23,.07);--correct:#2d6a4f;--correct-bg:#e8f5ee;--correct-line:#95d5b2;--wrong:#9b2335;--wrong-bg:#fdf0f0;--wrong-line:#e8a0a8;--exp-bg:#f0f4fa;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;min-height:100vh;}
header{background:var(--ink);color:#fff;padding:22px 24px 18px;text-align:center;}
.header-back{display:inline-block;margin-bottom:8px;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-decoration:none;letter-spacing:.06em;transition:color .15s;}
.header-back:hover{color:rgba(255,255,255,.8);}
header h1{font-family:'Noto Serif KR',serif;font-size:clamp(18px,3.5vw,26px);letter-spacing:-.03em;}
.toc-wrap{max-width:720px;margin:0 auto;padding:36px 16px 80px;}
.toc-section-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--ink);}
.toc-list{display:flex;flex-direction:column;gap:8px;}
.toc-item{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);}
.toc-num{font-size:13px;font-weight:900;color:var(--muted);min-width:24px;}
.toc-label{flex:1;font-size:14px;font-weight:700;word-break:keep-all;}
.toc-meta{font-size:11px;color:var(--muted);white-space:nowrap;}
.toc-btn{flex-shrink:0;background:none;border:1.5px solid var(--accent);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;font-family:inherit;color:var(--accent);cursor:pointer;transition:all .15s;white-space:nowrap;}
.toc-btn:hover{background:var(--accent);color:#fff;}
.toc-btn.wip{border-color:var(--line);color:var(--muted);pointer-events:none;}
.quiz-wrap{max-width:720px;margin:0 auto;padding:28px 16px 80px;display:none;}
.quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--ink);}
.quiz-back{background:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .15s;}
.quiz-back:hover{border-color:var(--accent);color:var(--accent);}
.quiz-ch-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;letter-spacing:-.03em;word-break:keep-all;}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
.q-num{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;}
.q-text{font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;margin-bottom:14px;}
.options{display:flex;flex-direction:column;gap:7px;}
.opt-btn{width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;font-family:'Noto Sans KR',sans-serif;line-height:1.6;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:border-color .15s,background .15s;word-break:keep-all;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:var(--soft);}
.opt-btn:disabled{cursor:default;}
.opt-mark{font-weight:900;color:var(--muted);min-width:20px;font-size:14px;flex-shrink:0;margin-top:1px;}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}
.opt-btn.correct .opt-mark{color:var(--correct);}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong);}
.opt-btn.wrong .opt-mark{color:var(--wrong);}
.opt-btn.reveal{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}
.opt-btn.reveal .opt-mark{color:var(--correct);}
.exp-box{display:none;margin-top:12px;padding:12px 14px;background:var(--exp-bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.75;color:var(--ink);word-break:keep-all;}
.exp-box.visible{display:block;}
.exp-label{font-size:11px;font-weight:900;color:var(--accent);letter-spacing:.06em;margin-bottom:4px;}
.reset-btn{margin-top:10px;display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;}
.reset-btn:hover{border-color:var(--accent);color:var(--accent);}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);}
@media(max-width:480px){.toc-item{padding:13px 14px;gap:10px;}.toc-label{font-size:13px;}.opt-btn{font-size:13px;padding:9px 12px;}}</style>
</head>

<script>
const MARKS=['①','②','③','④','⑤'];
const chapters=[{"id": "ch1", "label": "제1장 청소년활동의 개념적 이해"}, {"id": "ch2", "label": "제2장 청소년개발 실천전략으로서의 청소년활동"}, {"id": "ch3", "label": "제3장 청소년활동의 영역 및 유형"}, {"id": "ch4", "label": "제4장 청소년활동의 이론적 토대"}, {"id": "ch5", "label": "제5장 청소년활동의 교육적 가치"}, {"id": "ch6", "label": "제6장 청소년활동의 발전과정"}, {"id": "ch7", "label": "제7장 청소년활동 프로그램"}, {"id": "ch8", "label": "제8장 청소년활동의 장"}, {"id": "ch9", "label": "제9장 청소년활동지도자"}, {"id": "ch10", "label": "제10장 청소년활동의 법적·제도적 기반"}, {"id": "ch11", "label": "제11장 청소년활동의 실제"}, {"id": "ch12", "label": "제12장 청소년활동과 지역사회"}];
const quizData=[{"ch": "ch1", "text": "다음 <보기>에서 디지털 정보통신기술의 혁명으로 인해 청소년에게 발생한 변화를 바르게 짝지은 것은?\n\n<보기>\n디지털 정보통신기술의 혁명은 청소년의 (가)의 양적확대를 가져왔지만, 청소년이 일상생활이나 자연에서 (나)을 통해 얻을 수 있는 지식습득의 기회를 급격하게 축소시키고 있다.", "options": ["가: 간접경험 / 나: 간접적인 체험", "가: 간접경험 / 나: 직접적인 체험", "가: 직접경험 / 나: 간접적인 체험", "가: 직접경험 / 나: 직접적인 체험"], "ans": 1, "exp": "디지털 혁명은 청소년의 간접경험(미디어·정보)의 양적 확대를 가져왔으나, 자연이나 일상에서의 직접적인 체험 기회를 축소시켰다."}, {"ch": "ch1", "text": "청소년활동과 교육 및 학습에 대한 설명이다. 틀린 것은?", "options": ["학습이란 몸과 정신, 영혼을 변화시키는 과정이다.", "청소년활동은 청소년기의 발달과업과 밀접한 관련이 있다.", "교육이란 학습이 체계적으로 발생하도록 돕는 일이다.", "청소년활동은 청소년의 균형성장과 무관하게 진행된다."], "ans": 3, "exp": "청소년활동은 청소년의 균형성장(지·덕·체)을 위해 필요한 활동으로, 균형성장과 밀접하게 관련된다."}, {"ch": "ch1", "text": "다음 중 청소년활동의 등장배경과 가장 거리가 먼 것은?", "options": ["다양하고 풍요로운 양질의 경험학습 기회제공의 필요성", "지, 덕, 체의 균형있는 성장과 발달을 지원할 필요성", "청소년문제에 대한 고비용 저효율의 사회적 대책마련 필요", "체험학습 기회 부족에 대한 사회적 대안마련 필요"], "ans": 2, "exp": "청소년활동의 등장배경은 직접체험 기회 축소, 균형성장 필요, 체험학습 기회 부족 등이다. 고비용 저효율 대책은 청소년문제 접근이지 청소년활동 등장배경의 핵심이 아니다."}, {"ch": "ch1", "text": "청소년활동의 특성으로 부적절한 것은?", "options": ["청소년중심 활동", "목적지향적 활동", "타율적 활동", "모험적·도전적 활동"], "ans": 2, "exp": "청소년활동은 자율적 활동이 핵심 특성이다. 타율적 활동은 청소년활동의 특성에 해당하지 않는다."}, {"ch": "ch1", "text": "한국사회에서 학교밖 청소년 체험활동에 대한 지원 확대의 필요성을 등장시킨 사회적 배경으로 보기 어려운 것은?", "options": ["지역사회의 교육적 기능이 강화되어 가는 한국사회의 흐름", "직접경험을 통한 인격형성과 사회성 신장의 기회 축소", "디지털 혁명으로 인한 자연과의 직접적인 접촉기회 축소", "입시위주의 교육으로 청소년의 체험학습 기회 축소"], "ans": 0, "exp": "지역사회의 교육적 기능이 강화된 것이 아니라 오히려 약화되어 가는 흐름이 청소년활동 필요성을 부각시켰다."}, {"ch": "ch1", "text": "다음 중 청소년활동을 집단역동의 과정으로 이해할 때, 집단의 특성으로 보기 어려운 것은?", "options": ["집단구성원들이 소외감을 느낀다.", "직접적인 대면적 관계를 갖는다.", "언어적·비언어적 커뮤니케이션을 갖는다.", "상호 영향을 주고받는 상호작용의 관계를 갖는다."], "ans": 0, "exp": "집단역동에서 집단의 특성은 대면관계, 커뮤니케이션, 상호작용 등이다. 구성원들이 소외감을 느끼는 것은 집단의 특성이 아니라 집단 기능이 약할 때 나타나는 부작용이다."}, {"ch": "ch5", "text": "청소년활동에서 추구하는 품위(transtalent)가 기본적으로 가정하고 있는 것을 모두 고른 것은?\n\n가. 횡적 상대성\n나. 종적 상대성\n다. 체험구조를 통한 부단한 발전", "options": ["가, 나", "가, 다", "나, 다", "가, 나, 다"], "ans": 3, "exp": "품위(transtalent)는 횡적 상대성(개인간 점에서 발달은 상승적·진보적 변화에 초점을 맞춘다. 광의적 관점에서는 전 생애의 상승·하강적 변화를 모두 포함한다."}, {"ch": "ch2", "text": "Hurlock(1950)이 제시한 인간발달의 특성에 해당하는 것을 모두 고른 것은?\n\n가. 크기의 변화  나. 새로운 특징의 획득  다. 비율의 변화  라. 낡고 오래된 특징의 소멸", "options": ["가, 나, 다", "가, 나, 라", "나, 다, 라", "가, 나, 다, 라"], "ans": 3, "exp": "Hurlock은 인간발달의 특성으로 크기의 변화, 새로운 특징의 획득, 비율의 변화, 낡은 특징의 소멸을 모두 제시하였다."}, {"ch": "ch2", "text": "1990년대 이후에 등장한 긍정적 청소년개발(positive youth development)의 개념이 지향하는 방향이 아닌 것은?", "options": ["다양한 역량개발", "위험행동 증대", "긍정적 행동의 증가", "보호요인 강화"], "ans": 1, "exp": "PYD는 위험행동을 감소시키고 긍정적 행동을 증가시키며 역량 개발과 보호요인 강화를 추구한다. 위험행동 증대는 정반대이다."}, {"ch": "ch2", "text": "긍정적 청소년개발 모델(PYD model)에서 청소년의 긍정적 발달을 촉진하는 4가지 핵심요인에 해당하지 않는 것은?", "options": ["근면성과 유대감", "안정적인 자아정체감", "타인과의 유대감", "타인의 운명에 대한 통제감"], "ans": 3, "exp": "PYD 모델의 4가지 핵심요인은 근면성과 유능감, 안정적 자아정체감, 타인/사회와의 유대감, 자신의 운명에 대한 통제감이다. 타인의 운명에 대한 통제감은 해당하지 않는다."}, {"ch": "ch2", "text": "청소년개발(youth development)의 개념이 청소년정책에 미친 영향이다. 틀린 것은?", "options": ["정책관심: 단기적 문제행동 치료 → 장기적 발달", "개발무대: 학교중심 → 지역사회내 모든 시설·공간", "정책투입: 여건조성 및 기회확대 → 기초서비스 제공", "청소년: 단순한 서비스 수혜자 → 적극적 능동적 참여자"], "ans": 2, "exp": "청소년개발 개념은 기초서비스 제공에서 여건조성 및 기회확대로 전환한 것이다. ③은 방향이 반대로 제시되었다."}, {"ch": "ch2", "text": "청소년개발의 목표 중, \"친구 및 다른 사람들과 우호적인 관계를 유지할 수 있는 능력\"과 가장 밀접하게 관련되어 있는 것은?", "options": ["신체적 건강", "지적 역량", "사회적 역량", "정서적 역량"], "ans": 2, "exp": "타인과 우호적 관계를 유지하는 능력은 사회적 역량에 해당한다."}, {"ch": "ch2", "text": "DeSeCo에서 제시한 생애핵심역량 중 \"이질적 집단과 상호작용하기\"에 포함되어 있지 않는 것은?", "options": ["타인과 관계를 잘 맺을 수 있는 능력", "생애계획을 수립하고 실행에 옮길 수 있는 능력", "갈등을 관리하고 해결할 수 있는 능력", "협력할 수 있는 능력"], "ans": 1, "exp": "\"이질적 집단과 상호작용하기\"는 타인과 관계 맺기, 협력, 갈등 관리 능력을 포함한다. 생애계획 수립·실행은 \"자율적으로 행동하기\"에 해당한다."}, {"ch": "ch2", "text": "Search Institute가 제시한 발달자산(developmental assets)의 영역 중에서 \"외적자산(external assets)\"에 해당하는 것을 모두 고른 것은?\n\n가. 경계와 기대  나. 지지  다. 사회적 역량  라. 임파워먼트", "options": ["나, 라", "가, 나, 라", "가, 다, 라", "가, 나, 다"], "ans": 1, "exp": "외적자산은 지지, 임파워먼트, 경계와 기대, 생산적인 시간 사용이다. 사회적 역량은 내적자산에 해당한다."}, {"ch": "ch2", "text": "Search Institute가 제시한 발달자산(developmental assets)의 영역 중에서 \"내적자산(internal assets)\"에 해당하는 것을 모두 고른 것은?\n\n가. 경계와 기대  나. 긍정적 가치관  다. 사회적 역량  라. 긍정적 자아정체감", "options": ["가, 나", "가, 다, 라", "나, 다, 라", "가, 나, 다, 라"], "ans": 2, "exp": "내적자산은 배움에 대한 헌신, 긍정적 가치관, 사회적 역량, 긍정적 자아정체감이다. 경계와 기대는 외적자산이다."}, {"ch": "ch2", "text": "DeSeCo에서 제시한 생애핵심역량 중 \"자율적으로 행동하기\"에 포함되어 있는 것은?", "options": ["지식과 정보를 상호적으로 사용하는 능력", "갈등을 관리하고 해결할 수 있는 능력", "타인과 관계를 잘 맺을 수 있는 능력", "권리, 이익, 한계와 요구를 주장할 수 있는 능력"], "ans": 3, "exp": "\"자율적으로 행동하기\"는 큰 맥락에서 행동, 생애계획 수립·실행, 권리와 이익 주장 능력을 포함한다. 갈등 관리·타인과의 관계는 이질적 집단과 상호작용하기에 해당한다."}, {"ch": "ch10", "text": "학교밖 청소년활동을 제도적으로 지원하기 위해 한국사회에서 청소년육성법이 처음으로 제정된 해는?", "options": ["1981년", "1987년", "1991년", "1993년"], "ans": 1, "exp": "청소년육성법은 1987년에 처음으로 제정되었다."}, {"ch": "ch10", "text": "청소년수련활동의 특성화·전문화가 처음으로 시도된 것은?", "options": ["제1차 청소년육성 5개년계획", "제2차 청소년 육성 5개년계획", "제3차 청소년육성 5개년계획", "제4차 청소년육성 5개년계획"], "ans": 1, "exp": "청소년수련활동의 특성화·전문화는 제2차 청소년육성 5개년계획에서 처음으로 시도되었다."}, {"ch": "ch10", "text": "청소년기본법에서 규정하고 있는 청소년활동의 용어정의에서 괄호 안에 들어갈 용어를 바르게 나열한 것은?\n\n청소년의 균형있는 성장을 위하여 필요한 활동과 이러한 활동을 소재로 하는 (가), 교류활동, (나) 등 다양한 형태의 활동을 말한다.", "options": ["가: 수련활동 / 나: 문화활동", "가: 단체활동 / 나: 문화활동", "가: 수련활동 / 나: 체험활동", "가: 단체활동 / 나: 체험활동"], "ans": 0, "exp": "청소년기본법에서 청소년활동은 수련활동, 교류활동, 문화활동 등 다양한 형태의 활동을 말한다."}, {"ch": "ch10", "text": "다음 중 시기적으로 가장 먼저 일어난 것은?", "options": ["청소년기본법 제정", "청소년육성법 제정", "청소년활동진흥법 제정", "제1차 청소년육성 5개년계획 수립"], "ans": 1, "exp": "청소년육성법(1987) → 제1차 청소년육성 5개년계획(1988) → 청소년기본법(1991) → 청소년활동진흥법(2004) 순이다."}, {"ch": "ch10", "text": "한국청소년기본계획(1991)에서 제시한 수련활동의 지표 중에서 '개인성 개발'에 포함된 것을 바르게 나열한 것은?", "options": ["정서, 예절, 용기", "정서, 예절, 협동", "건강, 용기, 협동", "예절, 협동, 긍지"], "ans": 0, "exp": "개인성 개발 지표: 건강, 정서, 용기. 사회성 개발 지표: 예절, 협동, 긍지."}, {"ch": "ch10", "text": "한국청소년기본계획(1991)에서 분류한 청소년활동의 영역 중 생활권 및 자연권에서 심신단련, 자질배양, 취미개발, 정서함양, 사회봉사 등 배움을 실천하는 체험활동이 해당하는 것은?", "options": ["임의활동 영역", "고유활동 영역", "수련활동 영역", "학습활동 영역"], "ans": 2, "exp": "수련활동 영역은 생활권 및 자연권에서 심신단련, 하는가?", "options": ["최소 2년 이상", "최소 3년 이상", "최소 4년 이상", "최소 5년 이상"], "ans": 0, "exp": "1급 청소년지도사 응시 요건: 2급 자격 취득 후 청소년육성업무 종사경력 2년 이상."}, {"ch": "ch12", "text": "Maslow의 욕구위계이론과 Lewin의 힘-장이론을 연계하여 비제도권 교육에 대한 참여현상을 설명한 것은?", "options": ["Boshier의 일치모델", "Miller의 힘-장 모델", "Cross의 연쇄반응 모델", "Rubenson의 기대-유의가 모델"], "ans": 1, "exp": "Miller의 힘-장 모델은 Maslow의 욕구위계이론과 Lewin의 힘-장이론을 연계하여 비제도권 교육 참여를 설명한다."}, {"ch": "ch12", "text": "지역사회 수준의 청소년프로그램 위원회(2002)가 제시한 \"청소년발달을 촉진하는 청소년활동프로그램의 특성\"에 해당하지 않는 것은?", "options": ["명확한 규칙", "소속감을 느낄 수 있는 기회", "신체적 위험", "가정, 학교, 지역사회의 통합"], "ans": 2, "exp": "청소년발달을 촉진하는 프로그램 특성으로는 명확한 규칙, 소속감, 반응적 관계, 심리적 안전 등이 있다. 신체적 위험은 촉진 특성이 아니다."}, {"ch": "ch12", "text": "지역사회 수준의 청소년프로그램 위원회(2002)가 제시한 \"청소년발달을 촉진하는 청소년활동프로그램의 특성\"에 해당되지 않는 것은?", "options": ["반응적 관계", "애매모호한 지원", "의미있는 도전", "지속성과 예측가능성"], "ans": 1, "exp": "청소년발달을 촉진하는 프로그램은 명확하고 일관된 지원을 제공해야 한다. 애매모호한 지원은 발달 촉진 특성이 아니다."}, {"ch": "ch12", "text": "밀러(Miller)가 제시한 힘장 모델의 이론적 기반이 된 것을 모두 고른 것은?\n\n가. Maslow의 욕구위계이론\n나. Lewin의 힘-장 이론\n다. Rubenson의 기대-가치이론", "options": ["가", "나", "가, 나", "나, 다"], "ans": 2, "exp": "Miller의 힘-장 모델은 Maslow의 욕구위계이론과 Lewin의 힘-장 이론을 이론적 기반으로 한다."}, {"ch": "ch12", "text": "1990년대 이후에 새롭게 등장한 청소년개발(youth development)의 개념과 유사한 관점을 취하지 않는 것은?", "options": ["prevention model", "positive youth development", "healthy youth development", "asset-building approach"], "ans": 0, "exp": "prevention model(문제 예방 모델)은 문제 치료·예방 중심으로 청소년개발 개념과 다르다. PYD, 건강한 청소년개발, 자산형성 접근은 모두 유사한 관점이다."}, {"ch": "ch1", "text": "다음 중 청소년활동의 개념적 특징을 가장 바르게 설명한 것은?", "options": ["학교 교육과정과 동일한 개념으로 취급된다.", "청소년의 자발적 참여와 능동적 체험을 핵심으로 한다.", "국가나 성인이 강제하는 정형화된 지식 주입 활동이다.", "인지적 영역의 학업 성취도 향상을 최우선 목표로 삼는다."], "ans": 1, "exp": "청소년활동은 학교 교육과정과 다르며, 청소년의 자발적 참여와 능동적 체험을 핵심으로 한다."}, {"ch": "ch1", "text": "청소년활동의 성격을 규정할 때 전통적 학습과 비교되는 체험활동의 고유한 속성은?", "options": ["추상적 개념을 암기하는 데 효과적이다.", "지식과 행동의 결합을 촉진하고 실제 상황 대응력을 기른다.", "교수자 중심의 일방향적 정보 전달 체계이다.", "단기간에 대량의 구조화된 정보를 습득하기 유리하다."], "ans": 1, "exp": "체험활동은 지식과 행동의 결합을 촉진하며 실제 상황 대응력을 기른다는 점이 전통적 학습과 구별되는 고유한 속성이다."}, {"ch": "ch1", "text": "청소년활동이 청소년에게 '교육적 경험'이 되도록 하기 위한 구성 원리로 가장 부적합한 것은?", "options": ["학습자와 환경 간의 역동적인 상호작용", "주입식 전달을 통한 객관적 지식의 무비판적 수용", "경험 내용에 대한 반성적 성찰과 사고 과정의 개입", "청소년의 내적 동기와 흥미의 반영"], "ans": 1, "exp": "교육적 경험의 원리에는 환경과의 상호작용, 반성적 성찰, 내적 동기 반영이 포함된다. 무비판적 수용은 이와 반대되는 원리이다."}, {"ch": "ch1", "text": "청소년활동론에서 강조하는 '체험 구조를 통한 발전'의 의미와 가장 거리가 먼 것은?", "options": ["고정된 행동 양식을 반복하여 습관화하는 과정이다.", "경험을 통해 자신의 내면을 성찰하고 새로운 의미를 구성한다.", "횡적·종적 상대성을 인정하며 부단히 변화해 나간다.", "환경과의 능동적인 구조접속을 전제로 한다."], "ans": 0, "exp": "체험 구조를 통한 발전은 고정된 반복이 아니라 성찰과 의미 구성, 능동적 변화를 통해 이루어지는 과정이다."}, {"ch": "ch1", "text": "청소년활동의 본질적 품위를 유지하기 위해 기본적으로 가정해야 할 속성을 모두 고른 것은?\n\n가. 자발적 참여\n나. 목적지향성\n다. 타율적 규제", "options": ["가, 나", "가, 다", "나, 다", "가, 나, 다"], "ans": 0, "exp": "청소년활동의 품위는 자발적 참여와 목적지향성을 기본 속성으로 가정한다. 타율적 규제는 청소년활동의 본질적 속성에 해당하지 않는다."}, {"ch": "ch1", "text": "전통적인 학습과 체험활동을 비교할 때, 체험활동보다는 전통적인 학습의 특성에 보다 더 가까운 것은?", "options": ["새로운 것을 학습하는데 많은 시간이 소요된다.", "지식과 행동의 괴리현상이 발생할 가능성이 증가한다.", "이론과 실제 사이의 간극을 최소화할 수 있다.", "직접적인 경험과 체험을 중심으로 이루어진다."], "ans": 1, "exp": "전통적 학습은 언어 중심의 추상적 정보 전달이 주가 되므로 지식과 행동의 괴리가 발생하기 쉽다."}, {"ch": "ch1", "text": "청소년활동의 개념적 기초에 대한 설명 중 가장 거리가 먼 것은?", "options": ["청소년활동은 학교 교과과정 밖에서 이루어지는 활동만을 의미하는 좁은 개념이다.", "청소년의 균형 있는 성장을 돕기 위한 다양한 체험 위주의 활동을 포괄한다.", "수련활동, 교류활동, 문화활동 등 다양한 형태가 법적으로 규정되어 있다.", "청소년의 자발성과 능동적인 참여를 핵심적인 요소로 간주한다."], "ans": 0, "exp": "청소년활동은 학교 밖에만 국한되지 않고 학교 안팎을 포함한 넓은 개념이다."}, {"ch": "ch1", "text": "다음 중 청소년활동을 정의할 때 '체험 구조를 통한 주관적 의미 구성'을 강조하는 학문적 관점은?", "options": ["행동주의적 관점", "구성주의적 관점", "기능주의적 관점", "실증주의적 관점"], "ans": 1, "exp": "구성주의적 관점은 학습자가 체험을 통해 스스로 주관적 의미를 구성한다는 점을 강조한다."}, {"ch": "ch2", "text": "청소년발달 과정에서 성숙(Maturation)과 학습(Learning)의 관계를 가장 올바르게 설명한 것은?", "options": ["발달은 오직 유전적 성숙에 의해서만 결정된다.", "발달은 환경적 자극에 따른 학습의 독점적 결과이다.", "발달은 타고난 생득적 성숙과 환경적 학습의 상호작용 과정이다.", "성숙과 학습은 발달 과정에서 서로 전혀 영향을 주지 않는다."], "ans": 2, "exp": "발달은 유전·생물학적 성숙과 환경·경험에 의한 학습의 상호작용으로 이루어진다."}, {"ch": "ch2", "text": "다음 중 결손 모델(Deficit Model)에 기반한 전통적인 청소년 정책의 한계점으로 옳은 것은?", "options": ["청소년의 무한한 잠재력과 역량 개발에 집중한다.", "문제를 가진 소수 청소년의 단기적 치료와 예방에만 자원을 집중시킨다.", "모든 청소년의 장기적 발달을 도모하는 보편적 접근을 취한다.", "청소년을 적극적인 파트너이자 주체로 인정한다."], "ans": 1, "exp": "결손 모델은 문제가 있는 소수 청소년의 치료·예방에만 집중하여 보편적 역량 개발을 소홀히 한다는 한계가 있다."}, {"ch": "ch2", "text": "긍정적 청소년 개발(Positive Youth Development) 패러다임이 강조하는 핵심 관점은?", "options": ["청소년은 통제하고 치료해야 할 자원의 낭비 대상이다.", "청소년은 그 자체로 무한한 잠재력을 지닌 개발되어야 할 자원(Resource)이다.", "청소년기 발달의 개인차는 존재하지 않으므로 획일적 기준을 적용해야 한다.", "사후 약방문식의 범죄 예방 대책 수립이 최우선과제이다."], "ans": 1, "exp": "PYD 패러다임은 청소년을 치료 대상이 아니라 무한한 잠재력을 지닌 개발 자원으로 본다."}, {"ch": "ch2", "text": "긍정적 청소년 발달 모델에서 제시하는 역량(Competence)의 세부 영역에 포함되지 않는 것은?", "options": ["인지적 역량", "사회적 역량", "신체적 역량", "불안정한 정서적 고립"], "ans": 3, "exp": "역량의 세부 영역은 인지적·사회적·신체적·정서적 역량 등 긍정적 역량들이며, 불안정한 정서적 고립은 역량이 아니다."}, {"ch": "ch2", "text": "청소년 개발 전략이 성공하기 위해 지역사회가 제공해야 할 인프라 조건으로 부적절한 것은?", "options": ["안전하고 지속적인 시설 및 공간의 제공", "청소년을 존중하는 성인 지도자와의 유대관계 형성", "능동적으로 참여할 수 있는 실질적인 기회 확대", "청소년들의 전적인 학교 내부로의 고립과 격리"], "ans": 3, "exp": "청소년개발을 위해서는 지역사회 내 다양한 기회와 공간이 필요하며, 학교 내 고립은 이와 반대되는 조건이다."}, {"ch": "ch2", "text": "긍정적 청소년 개발의 '5C' 혹은 '6C' 모델의 구성 요소가 아닌 것은?", "options": ["유능감(Competence)", "자신감(Confidence)", "냉소주의(Cynicism)", "돌봄 및 공감(Caring/Compassion)"], "ans": 2, "exp": "5C/6C 모델은 유능감, 자신감, 연계성, 성품, 돌봄/공감, (기여)로 구성된다. 냉소주의는 포함되지 않는다."}, {"ch": "ch2", "text": "피트만(Pittman)이 제시한 '문제가 없다고 해서 개발된 것은 아니다'라는 명제와 가장 밀접한 관련이 있는 개념은?", "options": ["청소년 치료 중심 정책", "위험 요인 제거 중심 접근", "긍정적 청소년 개발(Positive Youth Development)", "전통적 결손 모델"], "ans": 2, "exp": "피트만의 명제는 문제 예방을 넘어 청소년의 잠재력 개발이 필요하다는 PYD의 핵심 철학과 직결된다."}, {"ch": "ch3", "text": "우리나라 청소년 수련활동의 고유한 구성 영역으로 볼 수 없는 것은?", "options": ["문화예술활동 및 정서 함양 활동", "정규 학교 교과의 지필고사 대비 문제풀이 활동", "모험활동 및 호연지기 배양 활동", "과학정보활동 및 국제교류활동"], "ans": 1, "exp": "수련활동은 문화예술, 모험, 과학정보, 국제교류 등을 포함하지만, 지필고사 대비 학습활동은 수련활동의 고유 영역이 아니다."}, {"ch": "ch3", "text": "청소년수련활동의 세부 유형 중, 자연과 친화하고 심신을 단련하기 위해 야외 환경에서 주로 이루어지는 활동유형은?", "options": ["청소년 교류활동", "야외 야영 및 모험활동", "정보통신 문화활동", "자원봉사활동"], "ans": 1, "exp": "자연 속에서 야영과 모험을 통해 심신을 단련하는 것은 야외 야영 및 모험활동에 해당한다."}, {"ch": "ch3", "text": "학교 교육과정의 한 축인 '창의적 체험활동'의 4가지 하위 영역에 포함되지 않는 것은?", "options": ["자율활동", "동아리활동", "봉사활동 및 진로활동", "정규 교과목 암기활동"], "ans": 3, "exp": "창의적 체험활동의 4가지 영역은 자율활동, 동아리활동, 봉사활동, 진로활동이다. 정규 교과목 암기활동은 포함되지 않는다."}, {"ch": "ch3", "text": "청소년 단체활동(청소년연맹, 스카우트 등)이 지니는 고유한 교육적 장점은?", "options": ["전적으로 지도자가 혼자서 의사결정을 내린다.", "제복과 규율을 통해 공동체 의식과 협동심을 기른다.", "가상 실내 공간에서 개별 학습만을 강조한다.", "일체의 경쟁 구조를 차단하여 정적으로 고립시킨다."], "ans": 1, "exp": "청소년단체활동은 단체 제복과 규율을 통해 공동체 의식과 협동심을 기르는 것이 고유한 교육적 장점이다."}, {"ch": "ch3", "text": "청소년수련활동의 영역 분류에서 '체험'을 중심으로 한 자발적 역량 강화를 목적으로 삼는 활동의 성격과 가장 거리가 먼 것은?", "options": ["현장 중심성", "과정 중심성", "인지 지향성", "자발성"], "ans": 2, "exp": "체험 중심의 수련활동은 현장, 과정, 자발성을 핵심 성격으로 하며, 인지 지향성은 이와 거리가 멀다."}, {"ch": "ch3", "text": "청소년문화활동의 고유한 특성으로 가장 적절한 것은?", "options": ["기성세대의 문화를 그대로 모방하고 전수하는 데 주력한다.", "청소년들이 주체적으로 참여하여 자신들만의 양식을 창조하는 동태적 활동이다.", "오프라인 공간에서만 제한적으로 일어나는 정적인 체계이다.", "국가의 강력한 통제와 지침에 의해서만 움직인다."], "ans": 1, "exp": "청소년문화활동은 청소년이 주체가 되어 자신들만의 문화 양식을 창조하는 동태적 활동이다."}, {"ch": "ch3", "text": "만 14세에서 24세 사이의 모든 청소년들이 참여할 수 있으며, 봉사활동, 자기개발, 신체단련, 탐험활동의 4가지 활동 영역을 통해 청소년 스스로의 잠재력을 개발하도록 돕는 국제적인 프로그램은?", "options": ["세계청소년캠퍼리", "국제청소년성취포상제 (The Duke of Edinburgh's International Award)", "유네스코 청소년 포럼", "국제 청소년 문화교류단"], "ans": 1, "exp": "국제청소년성취포상제는 만 14~24세 청소년이 봉사, 자기개발, 신체단련, 탐험의 4개 영역에서 스스로 잠재력을 개발하는 국제 프로그램이다."}, {"ch": "ch3", "text": "국제청소년성취포상제의 운영 원칙에 대한 설명 중 가장 적절하지 않은 것은?", "options": ["타인과의 무한한 경쟁을 통해 우열을 가리는 선발 방식이다.", "청소년 스스로 목표를 세우고 실천하는 '자기 주도성'을 핵심으로 한다.", "성취 정도에 따라 동장, 은장, 금장의 포상 단계가 부여된다.", "일관성과 지속성을 가지고 참여하는 과정 중심의 활동이다."], "ans": 0, "exp": "국제청소년성취포상제는 비경쟁성(non-competitive)을 원칙으로 하며, 타인과의 경쟁이 아닌 자기 자신과의 성장에 초점을 맞춘다."}, {"ch": "ch3", "text": "국제청소년성취포상제의 4가지 필수 활동 영역에 포함되지 않는 것은?", "options": ["봉사활동 (Service)", "신체단련 (Physical Recreation)", "수능 지필고사 대비 학업활동 (Academic Study const tocList=document.getElementById('tocList');

function showToc(){document.getElementById('tocWrap').style.display='block';document.getElementById('quizWrap').style.display='none';window.scrollTo(0,0);}

    const opts=document.createElement('div');opts.className='options';
    const expBox=document.createElement('div');expBox.className='exp-box';expBox.innerHTML=`<div class="exp-label">해설</div>${q.exp}`;
    const resetBtn=document.createElement('button');resetBtn.className='reset-btn';resetBtn.textContent='↺ 다시 풀기';resetBtn.style.display='none';
    let answered=false;
    q.options.forEach((opt,oi)=>{
      const btn=document.createElement('button');btn.className='opt-btn';
      btn.innerHTML=`<span class="opt-mark">${MARKS[oi]}</span><span>${opt}</span>`;
      btn.addEventListener('click',()=>{
        if(answered)return;answered=true;
        opts.querySelectorAll('.opt-btn').forEach((b,bi)=>{
          b.disabled=true;
          if(bi===q.ans){b.classList.add(bi===oi?'correct':'reveal');}
          else if(bi===oi){b.classList.add('wrong');}
        });
        expBox.classList.add('visible');resetBtn.style.display='inline-flex';
      });
      opts.appendChild(btn);
    });
    resetBtn.addEventListener('click',()=>{
      answered=false;
      opts.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','reveal');});
      expBox.classList.remove('visible');resetBtn.style.display='none';
    });
    card.appendChild(opts);card.appendChild(expBox);card.appendChild(resetBtn);wrap.appendChild(card);
  });
}</script>
</body>
</html>
