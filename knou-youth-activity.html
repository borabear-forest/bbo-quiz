<!doctype html>
<html lang="ko">
<head>

<title>청소년활동론</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--bg:#f7f4ef;--paper:#fffefb;--ink:#1c1a17;--muted:#7a7268;--line:#e3ddd4;--accent:#1a3258;--soft:#eaeff6;--radius:14px;--shadow:0 2px 16px rgba(28,26,23,.07);--correct:#2d6a4f;--correct-bg:#e8f5ee;--correct-line:#95d5b2;--wrong:#9b2335;--wrong-bg:#fdf0f0;--wrong-line:#e8a0a8;--exp-bg:#f0f4fa;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;min-height:100vh;}
header{background:var(--ink);color:#fff;padding:22px 24px 18px;text-align:center;}
.header-back{display:inline-block;margin-bottom:8px;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-decoration:none;letter-spacing:.06em;transition:color .15s;}
.header-back:hover{color:rgba(255,255,255,.8);}
header h1{font-family:'Noto Serif KR',serif;font-size:clamp(18px,3.5vw,26px);letter-spacing:-.03em;}
.toc-wrap{max-width:720px;margin:0 auto;padding:36px 16px 80px;}
.toc-section-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--ink);}
.toc-list{display:flex;flex-direction:column;gap:8px;}
.toc-item{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);}
.toc-num{font-size:13px;font-weight:900;color:var(--muted);min-width:24px;}
.toc-label{flex:1;font-size:14px;font-weight:700;word-break:keep-all;}
.toc-meta{font-size:11px;color:var(--muted);white-space:nowrap;}
.toc-btn{flex-shrink:0;background:none;border:1.5px solid var(--accent);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;font-family:inherit;color:var(--accent);cursor:pointer;transition:all .15s;white-space:nowrap;}
.toc-btn:hover{background:var(--accent);color:#fff;}
.toc-btn.wip{border-color:var(--line);color:var(--muted);pointer-events:none;}
.quiz-wrap{max-width:720px;margin:0 auto;padding:28px 16px 80px;display:none;}
.quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--ink);}
.quiz-back{background:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .15s;}
.quiz-back:hover{border-color:var(--accent);color:var(--accent);}
.quiz-ch-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;letter-spacing:-.03em;word-break:keep-all;}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
.q-num{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;}
.q-text{font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;margin-bottom:14px;}
.options{display:flex;flex-direction:column;gap:7px;}
.opt-btn{width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;font-family:'Noto Sans KR',sans-serif;line-height:1.6;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:border-color .15s,background .15s;word-break:keep-all;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:var(--soft);}
.opt-btn:disabled{cursor:default;}
.opt-mark{font-weight:900;color:var(--muted);min-width:20px;font-size:14px;flex-shrink:0;margin-top:1px;}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}
.opt-btn.correct .opt-mark{color:var(--correct);}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong);}
.opt-btn.wrong .opt-mark{color:var(--wrong);}
.opt-btn.reveal{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}
.opt-btn.reveal .opt-mark{color:var(--correct);}
.exp-box{display:none;margin-top:12px;padding:12px 14px;background:var(--exp-bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.75;color:var(--ink);word-break:keep-all;}
.exp-box.visible{display:block;}
.exp-label{font-size:11px;font-weight:900;color:var(--accent);letter-spacing:.06em;margin-bottom:4px;}
.reset-btn{margin-top:10px;display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;}
.reset-btn:hover{border-color:var(--accent);color:var(--accent);}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);}
@media(max-width:480px){.toc-item{padding:13px 14px;gap:10px;}.toc-label{font-size:13px;}.opt-btn{font-size:13px;padding:9px 12px;}}</style>
</head>

<script>
const MARKS=['①','②','③','④','⑤'];
const chapters=[{"id": "ch1", "label": "제1장 청소년활동의 개념적 이해"}, {"id": "ch2", "label": "제2장 청소년개발 실천전략으로서의 청소년활동"}, {"id": "ch3", "label": "제3장 청소년활동의 영역 및 유형"}, {"id": "ch4", "label": "제4장 청소년활동의 이론적 토대"}, {"id": "ch5", "label": "제5장 청소년활동의 교육적 가치"}, {"id": "ch6", "label": "제6장 청소년활동의 발전과정"}, {"id": "ch7", "label": "제7장 청소년활동 프로그램"}, {"id": "ch8", "label": "제8장 청소년활동의 장"}, {"id": "ch9", "label": "제9장 청소년활동지도자"}, {"id": "ch10", "label": "제10장 청소년활동의 법적·제도적 기반"}, {"id": "ch11", "label": "제11장 청소년활동의 실제"}, {"id": "ch12", "label": "제12장 청소년활동과 지역사회"}];
const quizData=[{"ch": "ch1", "text": "다음 <보기>에서 디지털 정보통신기술의 혁명으로 인해 청소년에게 발생한 변화를 바르게 짝지은 것은?\n\n<보기>\n디지털 정보통신기술의 혁명은 청소년의 (가)의 양적확대를 가져왔지만, 청소년이 일상생활이나 자연에서 (나)을 통해 얻을 수 있는 지식습득의 기회를 급격하게 축소시키고 있다.", "options": ["가: 간접경험 / 나: 간접적인 체험", "가: 간접경험 / 나: 직접적인 체험", "가: 직접경험 / 나: 간접적인 체험", "가: 직접경험 / 나: 직접적인 체험"], "ans": 1, "exp": "디지털 혁명은 청소년의 간접경험(미디어·정보)의 양적 확대를 가져왔으나, 자연이나 일상에서의 직접적인 체험 기회를 축소시켰다."}, {"ch": "ch1", "text": "청소년활동과 교육 및 학습에 대한 설명이다. 틀린 것은?", "options": ["학습이란 몸과 정신, 영혼을 변화시키는 과정이다.", "청소년활동은 청소년기의 발달과업과 밀접한 관련이 있다.", "교육이란 학습이 체계적으로 발생하도록 돕는 일이다.", "청소년활동은 청소년의 균형성장과 무관하게 진행된다."], "ans": 3, "exp": "청소년활동은 청소년의 균형성장(지·덕·체)을 위해 필요한 활동으로, 균형성장과 밀접하게 관련된다."}, {"ch": "ch1", "text": "다음 중 청소년활동의 등장배경과 가장 거리가 먼 것은?", "options": ["다양하고 풍요로운 양질의 경험학습 기회제공의 필요성", "지, 덕, 체의 균형있는 성장과 발달을 지원할 필요성", "청소년문제에 대한 고비용 저효율의 사회적 대책마련 필요", "체험학습 기회 부족에 대한 사회적 대안마련 필요"], "ans": 2, "exp": "청소년활동의 등장배경은 직접체험 기회 축소, 균형성장 필요, 체험학습 기회 부족 등이다. 고비용 저효율 대책은 청소년문제 접근이지 청소년활동 등장배경의 핵심이 아니다."}, {"ch": "ch1", "text": "청소년활동의 특성으로 부적절한 것은?", "options": ["청소년중심 활동", "목적지향적 활동", "타율적 활동", "모험적·도전적 활동"], "ans": 2, "exp": "청소년활동은 자율적 활동이 핵심 특성이다. 타율적 활동은 청소년활동의 특성에 해당하지 않는다."}, {"ch": "ch1", "text": "한국사회에서 학교밖 청소년 체험활동에 대한 지원 확대의 필요성을 등장시킨 사회적 배경으로 보기 어려운 것은?", "options": ["지역사회의 교육적 기능이 강화되어 가는 한국사회의 흐름", "직접경험을 통한 인격형성과 사회성 신장의 기회 축소", "디지털 혁명으로 인한 자연과의 직접적인 접촉기회 축소", "입시위주의 교육으로 청소년의 체험학습 기회 축소"], "ans": 0, "exp": "지역사회의 교육적 기능이 강화된 것이 아니라 오히려 약화되어 가는 흐름이 청소년활동 필요성을 부각시켰다."}, {"ch": "ch1", "text": "다음 중 청소년활동을 집단역동의 과정으로 이해할 때, 집단의 특성으로 보기 어려운 것은?", "options": ["집단구성원들이 소외감을 느낀다.", "직접적인 대면적 관계를 갖는다.", "언어적·비언어적 커뮤니케이션을 갖는다.", "상호 영향을 주고받는 상호작용의 관계를 갖는다."], "ans": 0, "exp": "집단역동에서 집단의 특성은 대면관계, 커뮤니케이션, 상호작용 등이다. 구성원들이 소외감을 느끼는 것은 집단의 특성이 아니라 집단 기능이 약할 때 나타나는 부작용이다."}, {"ch": "ch5", "text": "청소년활동에서 추구하는 품위(transtalent)가 기본적으로 가정하고 있는 것을 모두 고른 것은?\n\n가. 횡적 상대성\n나. 종적 상대성\n다. 체험구조를 통한 부단한 발전", "options": ["가, 나", "가, 다", "나, 다", "가, 나, 다"], "ans": 3, "exp": "품위(transtalent)는 횡적 상대성(개인간 점에서 발달은 상승적·진보적 변화에 초점을 맞춘다. 광의적 관점에서는 전 생애의 상승·하강적 변화를 모두 포함한다."}, {"ch": "ch2", "text": "Hurlock(1950)이 제시한 인간발달의 특성에 해당하는 것을 모두 고른 것은?\n\n가. 크기의 변화  나. 새로운 특징의 획득  다. 비율의 변화  라. 낡고 오래된 특징의 소멸", "options": ["가, 나, 다", "가, 나, 라", "나, 다, 라", "가, 나, 다, 라"], "ans": 3, "exp": "Hurlock은 인간발달의 특성으로 크기의 변화, 새로운 특징의 획득, 비율의 변화, 낡은 특징의 소멸을 모두 제시하였다."}, {"ch": "ch2", "text": "1990년대 이후에 등장한 긍정적 청소년개발(positive youth development)의 개념이 지향하는 방향이 아닌 것은?", "options": ["다양한 역량개발", "위험행동 증대", "긍정적 행동의 증가", "보호요인 강화"], "ans": 1, "exp": "PYD는 위험행동을 감소시키고 긍정적 행동을 증가시키며 역량 개발과 보호요인 강화를 추구한다. 위험행동 증대는 정반대이다."}, {"ch": "ch2", "text": "긍정적 청소년개발 모델(PYD model)에서 청소년의 긍정적 발달을 촉진하는 4가지 핵심요인에 해당하지 않는 것은?", "options": ["근면성과 유대감", "안정적인 자아정체감", "타인과의 유대감", "타인의 운명에 대한 통제감"], "ans": 3, "exp": "PYD 모델의 4가지 핵심요인은 근면성과 유능감, 안정적 자아정체감, 타인/사회와의 유대감, 자신의 운명에 대한 통제감이다. 타인의 운명에 대한 통제감은 해당하지 않는다."}, {"ch": "ch2", "text": "청소년개발(youth development)의 개념이 청소년정책에 미친 영향이다. 틀린 것은?", "options": ["정책관심: 단기적 문제행동 치료 → 장기적 발달", "개발무대: 학교중심 → 지역사회내 모든 시설·공간", "정책투입: 여건조성 및 기회확대 → 기초서비스 제공", "청소년: 단순한 서비스 수혜자 → 적극적 능동적 참여자"], "ans": 2, "exp": "청소년개발 개념은 기초서비스 제공에서 여건조성 및 기회확대로 전환한 것이다. ③은 방향이 반대로 제시되었다."}, {"ch": "ch2", "text": "청소년개발의 목표 중, \"친구 및 다른 사람들과 우호적인 관계를 유지할 수 있는 능력\"과 가장 밀접하게 관련되어 있는 것은?", "options": ["신체적 건강", "지적 역량", "사회적 역량", "정서적 역량"], "ans": 2, "exp": "타인과 우호적 관계를 유지하는 능력은 사회적 역량에 해당한다."}, {"ch": "ch2", "text": "DeSeCo에서 제시한 생애핵심역량 중 \"이질적 집단과 상호작용하기\"에 포함되어 있지 않는 것은?", "options": ["타인과 관계를 잘 맺을 수 있는 능력", "생애계획을 수립하고 실행에 옮길 수 있는 능력", "갈등을 관리하고 해결할 수 있는 능력", "협력할 수 있는 능력"], "ans": 1, "exp": "\"이질적 집단과 상호작용하기\"는 타인과 관계 맺기, 협력, 갈등 관리 능력을 포함한다. 생애계획 수립·실행은 \"자율적으로 행동하기\"에 해당한다."}, {"ch": "ch2", "text": "Search Institute가 제시한 발달자산(developmental assets)의 영역 중에서 \"외적자산(external assets)\"에 해당하는 것을 모두 고른 것은?\n\n가. 경계와 기대  나. 지지  다. 사회적 역량  라. 임파워먼트", "options": ["나, 라", "가, 나, 라", "가, 다, 라", "가, 나, 다"], "ans": 1, "exp": "외적자산은 지지, 임파워먼트, 경계와 기대, 생산적인 시간 사용이다. 사회적 역량은 내적자산에 해당한다."}, {"ch": "ch2", "text": "Search Institute가 제시한 발달자산(developmental assets)의 영역 중에서 \"내적자산(internal assets)\"에 해당하는 것을 모두 고른 것은?\n\n가. 경계와 기대  나. 긍정적 가치관  다. 사회적 역량  라. 긍정적 자아정체감", "options": ["가, 나", "가, 다, 라", "나, 다, 라", "가, 나, 다, 라"], "ans": 2, "exp": "내적자산은 배움에 대한 헌신, 긍정적 가치관, 사회적 역량, 긍정적 자아정체감이다. 경계와 기대는 외적자산이다."}, {"ch": "ch2", "text": "DeSeCo에서 제시한 생애핵심역량 중 \"자율적으로 행동하기\"에 포함되어 있는 것은?", "options": ["지식과 정보를 상호적으로 사용하는 능력", "갈등을 관리하고 해결할 수 있는 능력", "타인과 관계를 잘 맺을 수 있는 능력", "권리, 이익, 한계와 요구를 주장할 수 있는 능력"], "ans": 3, "exp": "\"자율적으로 행동하기\"는 큰 맥락에서 행동, 생애계획 수립·실행, 권리와 이익 주장 능력을 포함한다. 갈등 관리·타인과의 관계는 이질적 집단과 상호작용하기에 해당한다."}, {"ch": "ch10", "text": "학교밖 청소년활동을 제도적으로 지원하기 위해 한국사회에서 청소년육성법이 처음으로 제정된 해는?", "options": ["1981년", "1987년", "1991년", "1993년"], "ans": 1, "exp": "청소년육성법은 1987년에 처음으로 제정되었다."}, {"ch": "ch10", "text": "청소년수련활동의 특성화·전문화가 처음으로 시도된 것은?", "options": ["제1차 청소년육성 5개년계획", "제2차 청소년 육성 5개년계획", "제3차 청소년육성 5개년계획", "제4차 청소년육성 5개년계획"], "ans": 1, "exp": "청소년수련활동의 특성화·전문화는 제2차 청소년육성 5개년계획에서 처음으로 시도되었다."}, {"ch": "ch10", "text": "청소년기본법에서 규정하고 있는 청소년활동의 용어정의에서 괄호 안에 들어갈 용어를 바르게 나열한 것은?\n\n청소년의 균형있는 성장을 위하여 필요한 활동과 이러한 활동을 소재로 하는 (가), 교류활동, (나) 등 다양한 형태의 활동을 말한다.", "options": ["가: 수련활동 / 나: 문화활동", "가: 단체활동 / 나: 문화활동", "가: 수련활동 / 나: 체험활동", "가: 단체활동 / 나: 체험활동"], "ans": 0, "exp": "청소년기본법에서 청소년활동은 수련활동, 교류활동, 문화활동 등 다양한 형태의 활동을 말한다."}, {"ch": "ch10", "text": "다음 중 시기적으로 가장 먼저 일어난 것은?", "options": ["청소년기본법 제정", "청소년육성법 제정", "청소년활동진흥법 제정", "제1차 청소년육성 5개년계획 수립"], "ans": 1, "exp": "청소년육성법(1987) → 제1차 청소년육성 5개년계획(1988) → 청소년기본법(1991) → 청소년활동진흥법(2004) 순이다."}, {"ch": "ch10", "text": "한국청소년기본계획(1991)에서 제시한 수련활동의 지표 중에서 '개인성 개발'에 포함된 것을 바르게 나열한 것은?", "options": ["정서, 예절, 용기", "정서, 예절, 협동", "건강, 용기, 협동", "예절, 협동, 긍지"], "ans": 0, "exp": "개인성 개발 지표: 건강, 정서, 용기. 사회성 개발 지표: 예절, 협동, 긍지."}, {"ch": "ch10", "text": "한국청소년기본계획(1991)에서 분류한 청소년활동의 영역 중 생활권 및 자연권에서 심신단련, 자질배양, 취미개발, 정서함양, 사회봉사 등 배움을 실천하는 체험활동이 해당하는 것은?", "options": ["임의활동 영역", "고유활동 영역", "수련활동 영역", "학습활동 영역"], "ans": 2, "exp": "수련활동 영역은 생활권 및 자연권에서 심신단련, 하는가?", "options": ["최소 2년 이상", "최소 3년 이상", "최소 4년 이상", "최소 5년 이상"], "ans": 0, "exp": "1급 청소년지도사 응시 요건: 2급 자격 취득 후 청소년육성업무 종사경력 2년 이상."}, {"ch": "ch12", "text": "Maslow의 욕구위계이론과 Lewin의 힘-장이론을 연계하여 비제도권 교육에 대한 참여현상을 설명한 것은?", "options": ["Boshier의 일치모델", "Miller의 힘-장 모델", "Cross의 연쇄반응 모델", "Rubenson의 기대-유의가 모델"], "ans": 1, "exp": "Miller의 힘-장 모델은 Maslow의 욕구위계이론과 Lewin의 힘-장이론을 연계하여 비제도권 교육 참여를 설명한다."}, {"ch": "ch12", "text": "지역사회 수준의 청소년프로그램 위원회(2002)가 제시한 \"청소년발달을 촉진하는 청소년활동프로그램의 특성\"에 해당하지 않는 것은?", "options": ["명확한 규칙", "소속감을 느낄 수 있는 기회", "신체적 위험", "가정, 학교, 지역사회의 통합"], "ans": 2, "exp": "청소년발달을 촉진하는 프로그램 특성으로는 명확한 규칙, 소속감, 반응적 관계, 심리적 안전 등이 있다. 신체적 위험은 촉진 특성이 아니다."}, {"ch": "ch12", "text": "지역사회 수준의 청소년프로그램 위원회(2002)가 제시한 \"청소년발달을 촉진하는 청소년활동프로그램의 특성\"에 해당되지 않는 것은?", "options": ["반응적 관계", "애매모호한 지원", "의미있는 도전", "지속성과 예측가능성"], "ans": 1, "exp": "청소년발달을 촉진하는 프로그램은 명확하고 일관된 지원을 제공해야 한다. 애매모호한 지원은 발달 촉진 특성이 아니다."}, {"ch": "ch12", "text": "밀러(Miller)가 제시한 힘장 모델의 이론적 기반이 된 것을 모두 고른 것은?\n\n가. Maslow의 욕구위계이론\n나. Lewin의 힘-장 이론\n다. Rubenson의 기대-가치이론", "options": ["가", "나", "가, 나", "나, 다"], "ans": 2, "exp": "Miller의 힘-장 모델은 Maslow의 욕구위계이론과 Lewin의 힘-장 이론을 이론적 기반으로 한다."}, {"ch": "ch12", "text": "1990년대 이후에 새롭게 등장한 청소년개발(youth development)의 개념과 유사한 관점을 취하지 않는 것은?", "options": ["prevention model", "positive youth development", "healthy youth development", "asset-building approach"], "ans": 0, "exp": "prevention model(문제 예방 모델)은 문제 치료·예방 중심으로 청소년개발 개념과 다르다. PYD, 건강한 청소년개발, 자산형성 접근은 모두 유사한 관점이다."}];
const tocList=document.getElementById('tocList');
chapters.forEach((ch,i)=>{
  const items=quizData.filter(q=>q.ch===ch.id);
  const count=items.length;
  const div=document.createElement('div');div.className='toc-item';
  div.innerHTML=`<span class="toc-num">${String(i+1).padStart(2,'0')}</span><span class="toc-label">${ch.label}</span><span class="toc-meta">${count>0?count+'문항':''}</span>`;
  const btn=document.createElement('button');
  if(count>0){btn.className='toc-btn';btn.textContent='문제풀기 →';btn.addEventListener('click',()=>showQuiz(ch));}
  else{btn.className='toc-btn wip';btn.textContent='준비중';}
  div.appendChild(btn);tocList.appendChild(div);
});
function showToc(){document.getElementById('tocWrap').style.display='block';document.getElementById('quizWrap').style.display='none';window.scrollTo(0,0);}
function showQuiz(ch){document.getElementById('tocWrap').style.display='none';document.getElementById('quizWrap').style.display='block';document.getElementById('quizChTitle').textContent=ch.label;renderQuiz(ch.id);window.scrollTo(0,0);}
function renderQuiz(chId){
  const wrap=document.getElementById('quizContent');wrap.innerHTML='';
  const items=quizData.filter(q=>q.ch===chId);
  if(!items.length){wrap.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px 0;font-style:italic;">준비 중입니다.</p>';return;}
  items.forEach((q,qi)=>{
    const card=document.createElement('div');card.className='qcard';
    const num=document.createElement('div');num.className='q-num';num.textContent=`문제 ${qi+1}`;card.appendChild(num);
    const text=document.createElement('div');text.className='q-text';text.textContent=q.text;card.appendChild(text);
    const opts=document.createElement('div');opts.className='options';
    const expBox=document.createElement('div');expBox.className='exp-box';expBox.innerHTML=`<div class="exp-label">해설</div>${q.exp}`;
    const resetBtn=document.createElement('button');resetBtn.className='reset-btn';resetBtn.textContent='↺ 다시 풀기';resetBtn.style.display='none';
    let answered=false;
    q.options.forEach((opt,oi)=>{
      const btn=document.createElement('button');btn.className='opt-btn';
      btn.innerHTML=`<span class="opt-mark">${MARKS[oi]}</span><span>${opt}</span>`;
      btn.addEventListener('click',()=>{
        if(answered)return;answered=true;
        opts.querySelectorAll('.opt-btn').forEach((b,bi)=>{
          b.disabled=true;
          if(bi===q.ans){b.classList.add(bi===oi?'correct':'reveal');}
          else if(bi===oi){b.classList.add('wrong');}
        });
        expBox.classList.add('visible');resetBtn.style.display='inline-flex';
      });
      opts.appendChild(btn);
    });
    resetBtn.addEventListener('click',()=>{
      answered=false;
      opts.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','reveal');});
      expBox.classList.remove('visible');resetBtn.style.display='none';
    });
    card.appendChild(opts);card.appendChild(expBox);card.appendChild(resetBtn);wrap.appendChild(card);
  });
}</script>
