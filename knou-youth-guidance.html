<style>

:root {
  --bg: #f7f4ef;
  --paper: #fffefb;
  --ink: #1c1a17;
  --muted: #7a7268;
  --line: #e3ddd4;
  --accent: #1a3258;
  --soft: #eaeff6;
  --green: #1a6640;
  --green-bg: #eaf5ee;
  --green-border: #a3d4b0;

  --red-bg: #fdeaea;

  --radius: 14px;

}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  min-height: 100vh;
}

header {
  background: var(--ink);
  color: #fff;
  padding: 22px 24px 18px;
  text-align: center;
}
.header-back {
  display: inline-block;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,.4);
  text-decoration: none;
  letter-spacing: .06em;
  transition: color .15s;
}
.header-back:hover { color: rgba(255,255,255,.8); }
header h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(18px, 3.5vw, 26px);
  letter-spacing: -.03em;
  color: #fff;
}

/* ── 목차 ── */
.toc-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 36px 16px 80px;
}
.toc-section-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--ink);
}
.toc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toc-item {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow);
}
.toc-num {
  font-size: 13px;
  font-weight: 900;
  color: var(--muted);
  letter-spacing: .04em;
  min-width: 24px;
}
.toc-label {
  flex: 1;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  word-break: keep-all;
}
.toc-count {
  font-size: 12px;
  color: var(--muted);
  margin-right: 8px;
}
.toc-btn {
  flex-shrink: 0;
  background: none;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  color: var(--accent);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  touch-action: manipulation;
}
.toc-btn:hover { background: var(--accent); color: #fff; }

/* ── 문제 페이지 ── */
.quiz-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 16px 80px;
  display: none;
}
.quiz-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}
.quiz-back {
  background: none;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.quiz-back:hover { border-color: var(--accent); color: var(--accent); }
.quiz-ch-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.03em;
  word-break: keep-all;
}

/* ── 문제 카드 ── */
.qcard {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.q-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.q-num {
  font-size: 11px;
  font-weight: 900;
  color: var(--muted);
  letter-spacing: .08em;
}
.q-year {
  font-size: 11px;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 8px;
}
.q-body {
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: keep-all;
  overflow-wrap: break-word;
  margin-bottom: 14px;
}

/* ── 선택지 ── */
.opts {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.opt-btn {
  width: 100%;
  text-align: left;
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  transition: all .15s;
  line-height: 1.5;
  word-break: keep-all;
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--soft);
}
.opt-btn.correct {
  background: var(--green-bg);
  border-color: var(--green-border);
  color: var(--green);
  font-weight: 700;
}
.opt-btn.wrong {
  background: var(--red-bg);
  border-color: var(--red-border);
  color: var(--red);
}
.opt-btn.reveal-correct {
  background: var(--green-bg);
  border-color: var(--green-border);
  color: var(--green);
  font-weight: 700;
}
.opt-btn:disabled { cursor: default; }

/* ── 해설 박스 ── */
.exp-box {
  display: none;
  margin-top: 12px;
  padding: 14px 16px;
  background: var(--soft);
  border-radius: 12px;
  border: 1px solid #a8bed8;
  font-size: 13.5px;
  line-height: 1.75;
  word-break: keep-all;
}
.exp-box.visible { display: block; }
.exp-label {
  font-weight: 900;
  color: var(--accent);
  font-size: 13px;
  margin-bottom: 6px;
}

footer {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

@media (max-width: 480px) {
  .toc-label { font-size: 14px; }
  .toc-item { padding: 13px 14px; gap: 10px; }

// ── 목차 렌더링
const tocList = document.getElementById('tocList');
chapters.forEach((ch, i) => {
  const count = quizData.filter(q => q.ch === ch.id).length;
  const item = document.createElement('div');
  item.className = 'toc-item';

  const num = document.createElement('span');
  num.className = 'toc-num';
  num.textContent = String(i + 1).padStart(2, '0');

  const label = document.createElement('span');
  label.className = 'toc-label';
  label.textContent = ch.label;

  const countEl = document.createElement('span');
  countEl.className = 'toc-count';
  countEl.textContent = count > 0 ? `${count}문제` : '';

  const btn = document.createElement('button');
  btn.className = 'toc-btn';
  btn.textContent = count > 0 ? '문제풀기 →' : '준비중';
  if (count === 0) {
    btn.style.borderColor = 'var(--line)';
    btn.style.color = 'var(--muted)';
    btn.style.pointerEvents = 'none';
  } else {
    btn.addEventListener('click', () => showQuiz(ch));
  }

  item.appendChild(num);
  item.appendChild(label);
  item.appendChild(countEl);
  item.appendChild(btn);
  tocList.appendChild(item);
});

function showToc() {
  document.getElementById('tocWrap').style.display = 'block';
  document.getElementById('quizWrap').style.display = 'none';
  window.scrollTo(0, 0);
}

function showQuiz(ch) {
  document.getElementById('tocWrap').style.display = 'none';
  document.getElementById('quizWrap').style.display = 'block';
  document.getElementById('quizChTitle').textContent = ch.label;
  renderQuiz(ch.id);
  window.scrollTo(0, 0);
}

function renderQuiz(chId) {
  const wrap = document.getElementById('quizContent');
  wrap.innerHTML = '';
  const items = quizData.filter(q => q.ch === chId);

  if (items.length === 0) {
    wrap.innerHTML = '<p style="color:var(--muted);font-size:14px;padding:40px 0;text-align:center;">기출문제를 추가해주세요.</p>';
    return;
  }

  items.forEach((q, i) => {
    const card = document.createElement('article');
    card.className = 'qcard';

    // 문제 번호 + 연도
    const meta = document.createElement('div');
    meta.className = 'q-meta';
    const numEl = document.createElement('span');
    numEl.className = 'q-num';
    numEl.textContent = `문제 ${i + 1}`;
    meta.appendChild(numEl);
    if (q.year) {
      const yr = document.createElement('span');
      yr.className = 'q-year';
      yr.textContent = q.year;
      meta.appendChild(yr);
    }
    card.appendChild(meta);

    // 문제 본문
    const body = document.createElement('pre');
    body.className = 'q-body';
    body.textContent = q.text;
    card.appendChild(body);

    // 선택지
    const opts = document.createElement('div');
    opts.className = 'opts';
    let answered = false;

    q.opts.forEach((opt, j) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = `${['①','②','③','④'][j]} ${opt}`;
      btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;

        // 정오답 처리
        q.opts.forEach((_, k) => {
          const b = opts.children[k];
          b.disabled = true;
          if (k === q.ans) b.classList.add(j === q.ans ? 'correct' : 'reveal-correct');
          else if (k === j) b.classList.add('wrong');
        });

        // 해설 표시
        expBox.classList.add('visible');
      });
      opts.appendChild(btn);
    });
    card.appendChild(opts);

    // 해설
    const expBox = document.createElement('div');
    expBox.className = 'exp-box';
    expBox.innerHTML = `<div class="exp-label">해설</div><div>${q.exp}</div>`;
    card.appendChild(expBox);

    wrap.appendChild(card);
  });
}
