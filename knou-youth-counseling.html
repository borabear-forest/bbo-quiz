<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>청소년상담</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');

:root {
  --bg: #f7f4ef;
  --paper: #fffefb;
  --ink: #1c1a17;
  --muted: #7a7268;
  --line: #e3ddd4;
  --accent: #1a3258;
  --soft: #eaeff6;
  --radius: 14px;
  --shadow: 0 2px 16px rgba(28,26,23,.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  min-height: 100vh;
}

header {
  background: var(--ink);
  color: #fff;
  padding: 22px 24px 18px;
  text-align: center;
}
.header-back {
  display: inline-block;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,.4);
  text-decoration: none;
  letter-spacing: .06em;
  transition: color .15s;
}
.header-back:hover { color: rgba(255,255,255,.8); }
header h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(18px, 3.5vw, 26px);
  letter-spacing: -.03em;
}

/* ── 목차 ── */
.toc-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 36px 16px 80px;
}
.toc-section-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--ink);
}
.toc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toc-item {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow);
  cursor: default;
}
.toc-num {
  font-size: 13px;
  font-weight: 900;
  color: var(--muted);
  letter-spacing: .04em;
  min-width: 24px;
}
.toc-label {
  flex: 1;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  word-break: keep-all;
}
.toc-count {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.toc-btn {
  flex-shrink: 0;
  background: none;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  color: var(--accent);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  touch-action: manipulation;
}
.toc-btn:hover { background: var(--accent); color: #fff; }
.toc-btn.wip {
  border-color: var(--line);
  color: var(--muted);
  cursor: default;
  pointer-events: none;
}

/* ── 문제 페이지 ── */
.quiz-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 16px 80px;
  display: none;
}
.quiz-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}
.quiz-back {
  background: none;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.quiz-back:hover { border-color: var(--accent); color: var(--accent); }
.quiz-ch-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.03em;
  word-break: keep-all;
}

/* 기출/연습 구분 태그 */
.q-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 6px;
}
.q-tag.kichul {
  background: #1a3258;
  color: #fff;
}
.q-tag.yeonseup {
  background: #e8eedc;
  color: #3a5a1a;
}

.qcard {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.q-num {
  font-size: 11px;
  font-weight: 900;
  color: var(--muted);
  letter-spacing: .08em;
  margin-bottom: 6px;
}
.q-body {
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  font-family: 'Noto Sans KR', sans-serif;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.answer-btn {
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 15px;
  border-radius: 999px;
  border: 1.5px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
  touch-action: manipulation;
}
.answer-btn:hover { background: var(--soft); }
.answer-btn.open { background: var(--accent); color: #fff; }
.answer-box {
  display: none;
  margin-top: 12px;
  padding: 14px 16px;
  background: var(--soft);
  border-radius: 12px;
  border: 1px solid #a8bed8;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.answer-box.visible { display: block; }
.ans-label {
  font-weight: 900;
  color: var(--accent);
  font-size: 14px;
  margin-bottom: 6px;
}
.ans-exp {
  color: #3a4a60;
  font-size: 13.5px;
  line-height: 1.75;
}

/* 빈칸 괄호 강조 */
.blank {
  display: inline-block;
  min-width: 80px;
  border-bottom: 2px solid var(--ink);
  margin: 0 2px;
  vertical-align: bottom;
  text-align: center;
  font-weight: 700;
  color: var(--accent);
}

/* 지문(보기) 박스 */
.q-passage {
  background: #f4f1eb;
  border-left: 3px solid #b0a898;
  border-radius: 8px;
  padding: 12px 14px;
  margin: 8px 0 10px;
  font-size: 14px;
  line-height: 1.85;
  white-space: pre-wrap;
  word-break: keep-all;
  overflow-wrap: break-word;
  color: #3a3630;
}

/* 섹션 구분선 */
.section-divider {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--muted);
  padding: 18px 0 8px;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}
.section-divider:first-child { border-top: none; padding-top: 0; }

footer {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

@media (max-width: 480px) {
  .toc-label { font-size: 14px; }
  .toc-item { padding: 13px 14px; gap: 10px; }
  .toc-count { display: none; }
}
</style>
</head>
<body>

<header>
  <a class="header-back" href="index.html">← Study Hub</a>
  <h1>청소년상담</h1>

  <div class="toc-section-title">목차</div>

  <div class="quiz-header">
    <button class="quiz-back" onclick="showToc()">← 목차로</button>
    <div class="quiz-ch-title" id="quizChTitle"></div>
  </div>
  <div id="quizContent"></div>
</div>

<footer>청소년교육복지상담학과</footer>

 text:`상담의 핵심 구성 요소 3가지에 해당되지 않는 것은?

① 내담자
② 상담자
③ 심리검사
④ 상담자와 내담자의 상호작용`,
 ans:"③ 심리검사",
 exp:"상담의 핵심 구성 요소는 내담자, 상담자, 상담자와 내담자의 상호작용(상담관계)이다. 심리검사는 상담의 보조 도구이지 핵심 요소가 아니다."},

{ch:"ch1", type:"기출", src:"2016 동계 37번",
 text:`다음 설명에 해당하는 심리치료 통합운동의 노선은?

내담자와 그의 문제에 가장 효과적이라고 알려진 최선의 치료기법을 선택할 수 있는 치료체계를 제공하려는 시도이다. 일관성 있는 이론적 통합을 추구하기보다 다양한 치료 전략과 기법을 이론적 입장에 구애받지 않고 내담자의 문제에 따라 유연하게 사용하도록 권장한다.

 ans:"② 기술적 절충주의",

{ch:"ch1", type:"기출", src:"2016 동계 40번",

① 상담의 주요한 요소에는 내담자, 상담자, 상담관계가 있다.
② 성공적인 상담은 내담자에 대한 정확한 이해에서 출발한다.

{ch:"ch1", type:"기출", src:"2018 대체 46번",

② 상담자의 성격

④ 상담 기간`,
 ans:"④ 상담 기간",
 exp:"로젠웨이그가 제안한 공통요인은 치료적 상호 관계, 상담자의 성격, 체계적 논리(해석 체계), 희망 고취 등이다. '상담 기간'은 공통요인에 해당하지 않는다."},

{ch:"ch1", type:"기출", src:"2018 대체 47번",

② 개인 무의식은 자아에 의해서 인정받지 못한 경험, 사고, 감정, 지각, 기억을 의미한다.
③ 개인은 타인과 구별되는 자신만의 고유한 존재로 성장하는데, Jung은 이것을 집단무의식이라는 개념으로 설명한다.
④ 의식은 개인이 유일하게 직접적으로 알 수 있는 부분이며 태어날 때부터 죽을 때까지 지속적으로 성장해간다.`,
 ans:"③",
 exp:"개인이 고유한 존재로 성장하는 것은 '개성화(individuation)'이다. 집단무의식은 인류가 공유하는 보편적 무의식의 층이다."},

{ch:"ch4", type:"기출", src:"2017 대체 21번",
 text:`Jung은 분석적 심리치료의 과정을 네 단계로 구분하여 제시하였다. 다음 설명의 단계는?

이 단계에서 상담자와 내담자는 깊은 인격적 교류를 경험하고 내담자는 자신의 의식과 무의식의 부분을 통합하면서 개성화를 실현해 나간다.

① 고백(confession)의 단계
② 해석(interpretation)의 단계
③ 교육(education)의 단계
④ 변환(transformation)의 단계`,
 ans:"④ 변환(transformation)의 단계",
 exp:"융의 분석적 심리치료 4단계: 고백(catharsis) → 해석(interpretation) → 교육(education) → 변환(transformation). 변환 단계에서 상담자-내담자의 인격적 교류와 개성화가 실현된다."},

{ch:"ch4", type:"기출", src:"2018 1학기 43번",
 text:`상담이론과 기법의 연결이 옳지 않은 것은?

④ 인지행동치료 - 훈습`,
 ans:"④",
 exp:"훈습(working through)은 정신분석의 기법이다. 인지행동치료의 대표적 기법은 소크라테스식 대화, 행동실험, 역기능적 사고 기록지 등이다."},

{ch:"ch4", type:"기출", src:"2018 1학기 45번",
 text:`분석적 심리치료에 관한 설명으로 옳지 않은 것은?

① 칼 구스타프 융에 의해 창시된 정신 역동적 심리치료이다.
② 성적 추동인 리비도에 대하여 정신분석이론과 입장이 같다.
③ 인간은 인간 정신의 통합적 발현, 즉 개성화를 향해 나아가는 존재라고 본다.

 ans:"②",

{ch:"ch4", type:"기출", src:"2019 1학기 40번",

{ch:"ch4", type:"기출", src:"2016 동계 8번",
 text:`분석적 심리치료에서 원형의 유형에 대한 설명이 바르게 짝지어진 것은?

( A )는 라틴어로 '가면'이라는 뜻으로 개인이 다른 사람에게 자신을 드러내는 방식을 뜻한다.
( B )는 개인이 자신의 성격이라고 의식적으로 인식하는 것과 반대되는 특성을 뜻한다.

① A : 페르소나, B : 자기
② A : 아니무스, B : 자기
③ A : 아니무스, B : 그림자
④ A : 페르소나, B : 그림자`,
 ans:"④ A : 페르소나, B : 그림자",
 exp:"페르소나(persona): 사회적 가면, 타인에게 보이는 자신의 모습. 그림자(shadow): 의식적으로 인식하는 자신과 반대되는 무의식적 특성."},

{ch:"ch4", type:"기출", src:"2018 1학기 44번",
 text:`분석적 심리치료의 개념에 대한 설명으로 옳은 것은?

① 집단 무의식 : 자아에 의해 인정받지 못한 경험, 사고, 감정, 지각, 기억
② 페르소나 : 라틴어로 '가면'이라는 뜻이며 개인이 다른 사람에게 자신을 드러내는 방식
③ 아니무스 : 여성에게 있어서 논리나 합리성과 같은 특징을 지니는 남성적인 부분
④ 그림자 : 의식과 무의식을 포함한 성격 전체의 중심`,
 ans:"② 페르소나",
 exp:"①은 개인무의식에 대한 설명. ③ 아니무스는 맞지만 '여성에게 있는 남성적 측면'이 정확함(논리·합리성은 일부). ④는 자기(Self)에 대한 설명. ②가 가장 정확하다."},

{ch:"ch4", type:"기출", src:"2018 대체 54번",
 text:`분석적 심리치료에서 원형에 해당하지 않는 것은?

① 페르소나
② 아니무스
③ 그림자

{ch:"ch4", type:"기출", src:"2019 대체 55번",
 text:`분석적 심리치료에서 원형에 해당하지 않는 개념은?

① 페르소나
② 아니마
③ 그림자
④ 스트로크`,
 ans:"④ 스트로크",
 exp:"스트로크(stroke)는 교류분석(TA)의 개념이다. 융의 원형에는 페르소나, 아니마(남성 속 여성성), 아니무스(여성 속 남성성), 그림자, 자기 등이 있다."},

( B )는 개인이 자신의 성격이라고 의식적으로 인식하는 것과 반대되는 특성을 뜻한다.

{ch:"ch4", type:"연습",

② 집단무의식은 본능과 원형으로 구성되어 있는데, 본능은 행동을 일으키는 충동을, 원형은 경험을 지각하고 구성하는 방식을 뜻한다.
③ 개인은 타인과 구별되는 자신만의 고유한 존재로 성장하는데, 융은 이것을 집단무의식이라는 개념으로 설명한다.

 ans:"③",
 exp:"개인이 타인과 구별되는 자신만의 존재로 성장하는 것은 '개성화(individuation)' 개념으로 설명된다. 집단무의식은 전 인류가 공유하는 보편적 무의식이다."},

{ch:"ch4", type:"연습",
 text:`다음 분석적 심리치료의 치료기법 중 '전이와 역전이 분석'에 대한 옳은 설명을 모두 고르면?

㉠ 전이는 내담자의 내면적 상황 등을 보여 주며 과거와 현재를 이어 주는 다리 역할을 한다.

 ans:"㉠ ㉡ ㉢ ㉣ 모두 정답",
 exp:"융의 분석심리치료에서 전이와 역전이는 모두 치료적으로 중요하게 다루어지며, 원형적 주제가 포함될 수 있다."},

{ch:"ch4", type:"연습",
 text:`다음 설명은 어느 성격 발달 시기에 해당하는가?

융은 이 시기의 변화에 깊은 관심을 보였다. 젊은 시절의 외향적이고 물질주의적 관심에서 내향적이고 정신적인 관심으로 변화되거나 확대된다. 인생의 무의미함과 상실감을 경험할 수 있다. 이 시기는 행동을 통한 외부적 활동보다 내면적 사색과 명상을 통해서 자기를 실현하는 일에 관심을 가져야 할 시기이다.

① 아동기
② 청년기
③ 중년기
④ 노년기`,

인간은 자신의 경험에 대해 가치를 부여하는데 특정 경험이 자기, 자기실현 경향성을 충족하는 경험이면 긍정적 가치로, 그렇지 않으면 부정적 가치로 평가한다. 한 개인이 ( )을 따르는 경우 자기와 경험이 일치하는 것으로 편안함과 안정감을 느끼지만 타인의 가치를 내면화하게 되면 자기 소외가 발생한다.

① 현상학적 장
② 자기와 자아개념
③ 유기체 가치화 과정
④ 충분히 기능하는 인간`,
 ans:"③ 유기체 가치화 과정",
 exp:"유기체 가치화 과정(organismic valuing process): 자기실현 경향성에 부합하는 경험에 긍정적 가치를, 그렇지 않은 경험에 부정적 가치를 부여하는 자연스러운 내적 과정."},

{ch:"ch6", type:"기출", src:"2018 대체 57번",
 text:`인간중심상담의 기본 가정에 대한 설명으로 옳지 않은 것은?

① 로저스에 따르면 인간의 실현경향성이 차단되거나 봉쇄되었을 때 부적응적 문제를 나타낸다.
② 상담자의 지식보다 상담자의 태도와 인간적 특성이 중요함을 강조하였다.
③ 성공적인 심리치료를 위해서는 내담자보다 상담자가 더 주도적이어야 한다.
④ 상담목표는 내담자에 대한 신뢰와 존중을 바탕으로 내적 자원을 발휘하여 어려움을 극복하고 자기를 실현해 나갈 수 있도록 돕는 것이다.`,
 ans:"③",
 exp:"인간중심상담은 비지시적 접근으로 내담자가 주도권을 갖는다. 상담자는 촉진적 조건(공감, 무조건적 긍정적 존중, 진실성)을 제공하는 역할이다."},

{ch:"ch6", type:"기출", src:"2018 대체 58번",
 text:`인간중심상담의 무조건적 긍정적 존중에 대한 설명으로 옳은 것은?

① 일치성 또는 진실성이라고도 한다.
② 상담자가 겉으로 표현하는 것과 내면에서 경험한 것이 일치하는 것을 말한다.
③ 내담자를 무조건 칭찬하거나 편을 들어주거나 친절하게 대하는 것을 의미한다.
④ 내담자의 생각, 감정, 행동에 대하여 어떤 판단이나 평가도 내리지 않는 상담자의 순수한 보살핌을 의미한다.`,
 ans:"④",
 exp:"무조건적 긍정적 존중은 단순히 칭찬하는 것이 아니라 내담자의 모든 경험과 감정을 있는 그대로 수용하고 판단하지 않는 태도이다. ①②는 일치성(진실성)의 설명이다."},

{ch:"ch6", type:"기출", src:"2019 1학기 41번",
 text:`자기와 자기실현 경향성을 충족하는 경험이면 긍정적 가치, 그렇지 않으면 부정적 가치로 평가하는 과정으로서 인간이 자신의 경험에 대해 가치를 부여하는 과정을 의미하는 인간중심 이론의 용어는?

① 일치성
② 유기체가치화과정
③ 실현경향성추구
④ 현상적 장`,
 ans:"② 유기체가치화과정",
 exp:"유기체 가치화 과정(organismic valuing process): 자기실현 경향성 충족 여부를 기준으로 경험에 가치를 부여하는 내적 과정. 외부의 가치 조건에 의해 왜곡될 수 있다."},

{ch:"ch6", type:"기출", src:"2019 1학기 49번",
 text:`인간중심치료에서 상담자가 내담자와의 상담관계에서 순간순간 경험하는 감정을 있는 그대로 솔직히 인정하고 표현하는 태도를 의미하는 용어는?

① 일치성
② 무조건적 긍정적 존중
③ 공감적 이해
④ 직면`,
 ans:"① 일치성",
 exp:"일치성(congruence)/진실성(genuineness): 상담자가 내담자와의 관계에서 경험하는 감정을 있는 그대로 인식하고 표현하는 태도. 상담자가 진정한 자기 자신으로 존재하는 것이다."},

{ch:"ch6", type:"기출", src:"2019 대체 56번",
 text:`다음은 어떤 상담의 상담 목표인가?

내담자가 충분히 기능하는 인간이 되도록 돕는 것
자신의 개성과 능력을 최대한으로 발휘하면서 자기실현의 삶을 살게 됨

① 게슈탈트 상담
② 아들러 심리치료
③ 인간중심상담
④ 행동주의 상담`,
 ans:"③ 인간중심상담",
 exp:"인간중심상담의 목표는 내담자가 '충분히 기능하는 인간'이 되어 자기실현 경향성을 실현하며 자율적으로 살아가도록 돕는 것이다."},

{ch:"ch6", type:"기출", src:"2016 동계 22번",
 text:`인간중심상담의 상담과정이나 기법에 대한 설명으로 옳지 않은 것은?

① 상담자는 내담자를 신뢰하여 상담에 대하여 결정하지 않는다.
② 상담자는 공감적인 자세를 유지하고 자신의 내면세계는 노출하지 않는다.
③ 상담자는 내담자가 스스로 자신을 이해하고 수용하도록 분위기를 만든다.
④ 상담자는 내담자의 감정, 사고, 행동에 대하여 어떠한 평가도 하지 않는다.`,
 ans:"②",
 exp:"인간중심상담에서 상담자의 진실성(일치성)은 핵심 조건 중 하나다. 상담자는 적절한 자기노출을 통해 내면세계를 드러낼 수 있으며, 이것이 치료적으로 작용한다."},

{ch:"ch6", type:"기출", src:"2016 동계 23번",
 text:`다음 상황을 설명하는 인간중심상담의 개념은?

완벽주의 성향이 강한 민지의 어머니는 민지가 어려서부터 방을 깨끗하게 정리정돈할 때마다 칭찬하셨다. 성격이 털털한 민지는 정리정돈의 필요성을 느끼지 못하지만 어머니의 인정을 받기 위해 자기 방뿐만 아니라 온 집안 청소를 한다.

① 동일시
② 일치성
③ 가치의 조건
④ 자기실현 경향성`,
 ans:"③ 가치의 조건",
 exp:"가치의 조건(conditions of worth): 타인(특히 부모)의 인정을 받기 위해 자신의 진정한 경험보다 외적 기준에 맞추어 행동하게 되는 것. 민지는 자신의 실제 성향을 억누르고 어머니의 기대에 맞추고 있다."},

{ch:"ch6", type:"기출", src:"2016 동계 24번",
 text:`다음 대화에 나타나 있는 인간중심 상담자의 개입 반응은?

내담자: 제가 나쁘게 살지 않았는데 왜 이렇게 나쁜 일들이 제게 일어나는지 모르겠어요. 내가 더 잘했으면 떠나지 않았을 텐데라는 생각이 들면 너무 힘들어요.

상담자: "내가 더 잘했다면 막을 수 있었을 거란 죄책감이 들면서도 그 친구가 원망스럽고 '왜 이런 일이 나에게 일어났을까?'라는 생각이 들어 의아하고 억울하겠어요."

① 직면
② 공감 반영
③ 개방형 질문
④ 정보제공`,
 ans:"② 공감 반영",
 exp:"공감 반영은 내담자의 감정과 내면세계를 상담자가 정확히 이해하여 전달하는 것이다. 상담자는 내담자의 죄책감, 원망, 억울함 등을 정확하게 반영하고 있다."},

{ch:"ch6", type:"기출", src:"2018 1학기 48번",
 text:`인간중심상담에 대한 설명으로 옳지 않은 것은?

① 칼 로저스에 의해서 발전된 인본주의적 심리치료이다.
② 현상적 장은 주변 사람들이 인식할 수 있는 외적 참조체계이다.
③ 충분히 기능하는 인간은 지금-여기에서 충실히 살 수 있다.
④ 로저스는 인간에게 있는 단 하나의 기본적 동기가 실현경향성이라고 믿었다.`,
 ans:"②",
 exp:"현상적 장(phenomenal field)은 개인이 주관적으로 경험하는 내적 참조체계이다. 외적으로 관찰 가능한 것이 아니라 개인의 주관적 경험 세계를 의미한다."},

{ch:"ch6", type:"기출", src:"2018 1학기 49번",
 text:`인간중심치료의 상담기법 중 내담자의 생각, 감정, 행동에 대하여 어떤 판단이나 평가도 내리지 않는 상담자의 순수한 보살핌을 의미하는 것은?

① 공감적 이해
② 진실성
③ 일치성
④ 무조건적 긍정적 존중`,
 ans:"④ 무조건적 긍정적 존중",
 exp:"무조건적 긍정적 존중(unconditional positive regard): 내담자를 조건 없이 있는 그대로 수용하고 존중하는 것. 판단이나 평가 없이 보살피는 순수한 보살핌이다."},

// CH6 연습문제
{ch:"ch6", type:"연습",
 text:`인간중심 상담의 주요 핵심 조건에 대한 설명을 읽고 알맞게 짝 지은 것은?

( ⓐ ) : 내담자의 생각, 감정, 행동에 대하여 어떤 판단이나 평가도 내리지 않는 치료자의 순수한 보살핌
( ⓑ ) : 전문가의 역할 뒤로 자신을 숨기지 않고 꾸밈 없이 자신의 모습을 있는 그대로 나타내는 것
( ⓒ ) : 치료자가 마치 내담자가 된 것처럼 그의 심정을 느끼는 것

① ⓐ: 공감적 이해, ⓑ: 진실성, ⓒ: 무조건적 긍정적 존중
② ⓐ: 무조건적 긍정적 존중, ⓑ: 진실성, ⓒ: 공감적 이해
③ ⓐ: 무조건적 긍정적 존중, ⓑ: 공감적 이해, ⓒ: 진실성
④ ⓐ: 공감적 이해, ⓑ: 무조건적 긍정적 존중, ⓒ: 진실성`,
 ans:"② ⓐ: 무조건적 긍정적 존중, ⓑ: 진실성, ⓒ: 공감적 이해"},

{ch:"ch6", type:"연습",
 text:`개인의 모든 경험이 무조건적 긍정적 존중을 받으면 자신의 경험을 충분히 수용하여 자기구조로 통합할 뿐만 아니라 내면적 자원을 발휘하는 ( )으로 성장한다.`,
 ans:"충분히 기능하는 인간",
 exp:"로저스의 이상적 인간상: 충분히 기능하는 인간(fully functioning person). 경험에 개방적이고, 실존적으로 살며, 자신의 유기체적 과정을 신뢰하는 특성을 지닌다."},

{ch:"ch6", type:"연습",
 text:`다음 설명에 해당하는 인간중심 상담 이론의 치료기법은?

상담자가 내담자의 내면세계에 대해서 이해한 바를 전달하는 것이다. 달리 말하면, 상담자의 마음에 비친 내담자의 모습을 보여 주는 것이다. 상담자는 내담자를 더 잘 알게 될수록 내담자의 언어적 표현 이면을 이해할 수 있게 된다.

① 진실하려고 노력하기
② 자기 노출하기
③ 반영하기
④ 적극적 경청하기`,
 ans:"③ 반영하기",
 exp:"반영(reflecting): 상담자가 내담자의 감정과 내면세계를 이해하고 그것을 내담자에게 다시 전달하는 기법. 내담자가 자신을 더 명확히 이해하도록 돕는다."},

{ch:"ch6", type:"연습",
 text:`인간중심 상담에서 '자기와 경험의 불일치'에 관한 설명으로 옳지 않은 것은?

① 부모가 제시한 가치조건과 자신의 현실적 경험의 불일치는 불안을 유발한다.
② 아동은 부모의 기대와 가치를 내면화하여 현실적인 자기를 형성한다.
③ 부모의 조건적 사랑을 받은 아동은 자신의 특성을 선택적으로 수용한다.
④ 심리적 부적응은 의미 있는 타인의 조건적인 수용과 존중에 기인한다.`,
 ans:"②",
 exp:"아동은 부모의 기대와 가치를 내면화하여 '이상적 자기'를 형성한다. 현실적 자기가 아닌 이상적 자기(ideal self)를 형성하게 되며, 이것이 실제 경험과 불일치하면 불안이 생긴다."},

{ch:"ch6", type:"연습",
 text:`다음 대화에 나타나 있는 인간중심 상담자의 개입 반응은?

상담자: "내가 더 잘했었다면 막을 수 있었을 거란 죄책감이 들면서도 그 친구가 원망스럽고 '왜 이런 일이 나에게 일어났을까?'라는 생각이 들어 의아하고 억울하겠어요."

① 자기개방
② 일치성 또는 진실성
③ 감정자각
④ 공감적 반영`,
 ans:"④ 공감적 반영"},

{ch:"ch7", type:"기출", src:"2016 동계 28번",
 text:`게슈탈트 치료기법에 해당하지 않는 것은?

① 저항분석
② 빈 의자 기법
③ 역할 연기하기
④ 지금-여기의 체험에 초점 맞추기`,
 ans:"① 저항분석",
 exp:"저항분석(resistance analysis)은 정신분석의 기법이다. 게슈탈트 기법에는 빈 의자 기법, 역할연기, 신체감각 알아차리기, 창조적 투사, 지금-여기 초점 등이 있다."},

{ch:"ch7", type:"기출", src:"2017 동계 20번",
 text:`개체가 게슈탈트를 분명하게 형성하지 못했거나, 전경으로 올라온 게슈탈트를 원만하게 해소하지 못하고 차단 혹은 방해를 하면 게슈탈트의 완결이 어려워진다. 이렇게 완결되지 않은 게슈탈트를 무엇이라고 하는가?

① 접촉경계혼란
② 미해결과제
③ 알아차림
④ 전경`,
 ans:"② 미해결과제",
 exp:"미해결과제(unfinished business): 완결되지 않거나 해소되지 않은 게슈탈트. 배경에 머물며 에너지를 차단하고 심리적·신체적 문제를 일으킨다. 해결 방법은 지금-여기 알아차림이다."},

{ch:"ch7", type:"기출", src:"2017 동계 21번",
 text:`타인을 비롯한 환경의 요구를 무비판적으로 수용하는 것을 의미하는 접촉경계혼란은?

① 투사
② 반전
③ 편향
④ 내사`,
 ans:"④ 내사",
 exp:"내사(introjection): 타인이나 환경의 가치·기준·규범 등을 비판 없이 그대로 삼켜버리는 것. '~해야 한다'는 부모의 목소리가 내면화되는 것이 전형적 예이다."},

{ch:"ch7", type:"기출", src:"2017 동계 22번",
 text:`밀접한 관계에 있는 두 사람이 서로의 경계를 인정하지 않고 마치 동일한 가치와 태도를 지닌 것처럼 의존적인 관계를 형성하는 것을 의미하는 접촉경계혼란은?

① 내사
② 융합
③ 투사
④ 반전`,
 ans:"② 융합",
 exp:"융합(confluence): 두 사람이 경계 없이 하나가 된 듯 의존적 관계를 형성하는 것. 자신과 타인의 경계가 없어져 차이를 인식하지 못한다. 공생관계나 지나친 밀착관계가 예이다."},

{ch:"ch7", type:"기출", src:"2017 대체 23번",
 text:`다음 중 접촉경계혼란에 대한 설명으로 옳지 않은 것은?

① 자의식이란 개체가 자신을 대상화하여 지나치게 의식하고 관찰하는 것을 말한다.
② 융합이란 밀접한 관계에 있는 두 사람이 서로의 경계를 인정하지 않고 마치 동일한 가치와 태도를 지닌 것처럼 의존적인 관계를 형성하는 것이다.
③ 편향이란 개체가 타인이나 환경에게 하고 싶은 행동을 자신을 대상으로 하는 것을 말한다.
④ 내사란 타인을 비롯한 환경의 요구를 무비판적으로 수용하는 것을 말한다.`,
 ans:"③",
 exp:"③은 반전(retroflection)에 대한 설명이다. 편향(deflection)은 환경과의 직접적인 접촉을 피하거나 감각을 둔화시켜 접촉의 강도를 약화하는 것이다."},

{ch:"ch7", type:"기출", src:"2017 대체 25번",
 text:`알아차림-접촉주기 중에 들어가야 할 것은?

물러남(배경) → ( ) → 알아차림 → 에너지 동원 → 행동 → 접촉

① 감각
② 행동
③ 알아차림
④ 에너지 동원`,
 ans:"① 감각",
 exp:"알아차림-접촉 주기: 물러남(배경) → 감각 → 알아차림 → 에너지 동원 → 행동 → 접촉 → 물러남(배경). 감각이 알아차림 이전 단계이다."},

{ch:"ch7", type:"기출", src:"2017 대체 26번",
 text:`게슈탈트 상담의 과정으로 옳지 않은 것은?

① 주제의 발견단계는 미해결 과제를 찾아내는 단계이다.
② 배경의 탐색단계는 특정행동을 하는 목적을 깨닫는 과정을 통해 지금까지와는 다른 관점에서 보게 된다.
③ '지금-여기'의 활용단계는 상담시간 외에 발생하는 사건을 주목하고 이를 활용하는 것이다.
④ 대화적 관계의 적용을 통해 내담자를 목적으로 대하며 만나는 것이다.`,
 ans:"③",
 exp:"'지금-여기'는 상담시간 외가 아니라 상담 장면의 현재 순간에 초점을 두는 것이다. 또한 ④는 내담자를 목적(object)이 아닌 주체(subject)로 만나는 I-You 관계가 원칙이다."},

{ch:"ch7", type:"기출", src:"2017 대체 30번",
 text:`다음 설명에 해당하는 게슈탈트 치료기법은?

자신이 투사물을 만들어 냈고 투사가 사실과 일치할 수도 있으나 그렇지 않을 수도 있다는 것을 아는 것
자신의 억압되고 소외된 부분들을 자신의 것으로 알아차리는 것

① 빈의자 기법
② 창조적 투사
③ 신체감각 알아차리기
④ 환경 알아차리기`,
 ans:"② 창조적 투사",
 exp:"창조적으로 투사하기(creative projection): 내담자가 투사한 내용이 자신의 소외된 부분임을 알아차리게 하는 기법. 투사한 것을 소유하게 되면 접촉이 자유로워진다."},

{ch:"ch7", type:"기출", src:"2018 대체 59번",
 text:`게슈탈트 이론의 주요 개념에 대한 설명으로 옳지 않은 것은?

① 알아차림은 개체가 자신의 유기체적 욕구와 감정을 배경에 떠올리는 것을 의미함
② 미해결 과제를 해결하기 위한 방법으로 지금-여기 알아차림을 강조함
③ 내사란 타인을 비롯한 환경의 요구를 무비판적으로 수용하는 것을 의미함
④ 반전이란 타인이나 환경에게 하고 싶은 행동을 자신을 대상으로 하는 것을 의미함`,
 ans:"①",
 exp:"알아차림(awareness)은 유기체적 욕구와 감정을 배경이 아니라 전경(foreground)에 떠올리는 것이다. 전경은 의식의 초점이 되는 것이다."},

{ch:"ch7", type:"기출", src:"2018 대체 60번",
 text:`게슈탈트 상담의 기법이 아닌 것은?

① 신체감각 알아차리기
② 역할연기(시연)
③ 창조적 투사
④ 생활양식 분석하기`,
 ans:"④ 생활양식 분석하기",
 exp:"생활양식 분석(lifestyle analysis)은 아들러 심리치료의 기법이다. 게슈탈트 기법에는 빈 의자 기법, 역할연기, 창조적 투사, 신체감각 알아차리기, 환경 알아차리기 등이 있다."},

{ch:"ch7", type:"기출", src:"2019 1학기 42번",
 text:`게슈탈트 상담의 기법이 아닌 것은?

① 창조적 투사
② 역할연기(시연)
③ 신체감각 알아차리기
④ 자유연상`,
 ans:"④ 자유연상",
 exp:"자유연상(free association)은 정신분석의 기법이다. 게슈탈트 기법에는 빈 의자 기법, 역할연기, 창조적 투사, 신체감각 알아차리기 등이 있다."},

{ch:"ch7", type:"기출", src:"2019 1학기 44번",
 text:`게슈탈트 이론의 '알아차림 - 접촉 주기'이다. 빈칸에 알맞은 말은?

물러남(배경) - 감각 - ( A ) - 에너지 동원 - 행동 - ( B )

① A: 알아차림, B: 접촉
② A: 접촉, B: 분리
③ A: 인식, B: 분리
④ A: 알아차림, B: 인식`,
 ans:"① A: 알아차림, B: 접촉",
 exp:"알아차림-접촉 주기: 물러남(배경) → 감각 → 알아차림 → 에너지 동원 → 행동 → 접촉 → 물러남."},

{ch:"ch7", type:"기출", src:"2019 대체 57번",
 text:`게슈탈트 상담에서 접촉경계혼란에 대한 설명이 옳지 않은 것은?

① 자의식 - 자신을 대상화 하여 지나치게 의식하고 관찰하는 것
② 편향 - 환경과의 접촉으로 인한 결과가 두려워 피하거나 감각을 둔화하는 것
③ 반전 - 사고, 욕구, 감정을 타인의 것으로 왜곡하여 지각함
④ 융합 - 밀접한 두 사람이 서로의 경계를 인정하지 않고 의존적 관계를 형성`,
 ans:"③",
 exp:"③은 투사(projection)에 대한 설명이다. 반전(retroflection)은 타인이나 환경에게 하고 싶은 행동을 자신을 대상으로 하는 것이다."},

{ch:"ch7", type:"기출", src:"2019 대체 58번",
 text:`게슈탈트의 상담기법이 아닌 것은?

① 체계적 둔감법
② 신체감각 알아차리기
③ 역할연기
④ 빈의자 기법`,
 ans:"① 체계적 둔감법",
 exp:"체계적 둔감법(systematic desensitization)은 행동주의 상담의 기법이다. 게슈탈트 기법은 빈 의자, 역할연기, 신체감각 알아차리기, 창조적 투사 등이다."},

{ch:"ch7", type:"기출", src:"2016 동계 29번",
 text:`게슈탈트 상담에서 알아차림-접촉 주기의 순서가 바르게 연결된 것은?

① 배경-감각-알아차림-에너지동원-행동-접촉
② 배경-알아차림-감각-행동-에너지동원-접촉
③ 접촉-배경-알아차림-에너지동원-감각-행동
④ 접촉-알아차림-배경-에너지동원-행동-감각`,
 ans:"① 배경-감각-알아차림-에너지동원-행동-접촉",
 exp:"알아차림-접촉 주기: 물러남(배경) → 감각 → 알아차림 → 에너지 동원 → 행동 → 접촉 → 물러남(배경)으로 순환한다."},

{ch:"ch7", type:"기출", src:"2016 동계 30번",
 text:`게슈탈트 상담에서 미해결 과제에 대한 설명으로 옳지 않은 것은?

① 심리적, 신체적 장애를 일으킬 수 있다.
② 완결되지 않거나 해소되지 않은 게슈탈트를 의미한다.
③ 미해결 과제는 전경과 배경의 교체를 촉진하는 역할을 한다.
④ 미해결 과제를 해결할 수 있는 방법은 '지금-여기'를 알아차리는 것이다.`,
 ans:"③",
 exp:"미해결 과제는 전경과 배경의 자연스러운 교체를 방해한다. 해결되지 않은 감정이 계속 전경에 머물러 있어 새로운 경험이 전경으로 오지 못하게 막는다."},

{ch:"ch7", type:"기출", src:"2016 동계 31번",
 text:`게슈탈트 상담에서 '어느 한 순간에 의식의 초점이 되는 것'을 무엇이라고 하는가?

① 접촉
② 전경
③ 배경
④ 게슈탈트`,
 ans:"② 전경",
 exp:"전경(figure): 어느 순간 의식의 초점이 되는 것. 배경(ground): 초점 밖에 있는 나머지. 게슈탈트 지각 이론의 핵심 개념이다."},

{ch:"ch7", type:"기출", src:"2018 1학기 50번",
 text:`게슈탈트 상담의 '접촉경계 혼란'에 대한 설명으로 옳지 않은 것은?

① 내사 : 사고, 욕구, 감정을 타인의 것으로 왜곡하여 지각하는 것
② 융합 : 밀접한 두 사람이 서로의 경계를 인정하지 않고 의존적 관계를 형성하는 것
③ 반전 : 타인이나 환경에게 하고 싶은 행동을 자신을 대상으로 하는 것
④ 편향 : 환경과의 접촉으로 인한 결과가 두려워 피하거나 감각을 둔화하는 것`,
 ans:"①",
 exp:"①은 투사(projection)에 대한 설명이다. 내사(introjection)는 타인의 가치관, 믿음, 태도 등을 비판 없이 그대로 받아들이는 것이다."},

{ch:"ch7", type:"기출", src:"2018 1학기 51번",
 text:`게슈탈트 이론에 대한 설명이다. 빈 칸에 알맞은 말은?

( A )은/는 '형태' 또는 '전체적 모양'이라는 뜻의 독일어로 개체가 자신의 욕구나 감정을 하나의 의미 있는 행동 동기로 조직화하여 지각한 것을 의미한다. 이러한 해결되지 않은 ( A )을/를 ( B )(이)라고 부른다.

① (A)게슈탈트, (B)접촉경계혼란
② (A)미해결과제, (B)접촉경계혼란
③ (A)게슈탈트, (B)미해결과제
④ (A)접촉경계혼란, (B)미해결과제`,
 ans:"③ (A)게슈탈트, (B)미해결과제"},

{ch:"ch7", type:"기출", src:"2018 1학기 52번",
 text:`게슈탈트 이론의 '알아차림-접촉 주기'이다. 빈 칸에 알맞은 말은?

물러남(배경) - ( A ) - 알아차림 - 에너지 동원 - ( B ) - ( C )

① A: 감각, B: 행동, C: 접촉
② A: 행동, B: 감각, C: 접촉
③ A: 행동, B: 접촉, C: 감각
④ A: 감각, B: 접촉, C: 행동`,

{ch:"ch7", type:"연습",
 text:`게슈탈트 상담의 주요 개념에 대한 설명과 그에 해당하는 내용이 알맞게 짝지어진 것은?

( ㉠ )은(는) '형태' 또는 '전체적 모양'이라는 의미를 지닌 독일어로 개체가 자신의 욕구나 감정을 하나의 의미 있는 행동 동기로 조직화하여 지각한 것을 말한다.
어느 한순간에 우리 의식의 초점이 되는 것을 ( ㉡ )이라고 하고, 초점 밖에 놓여 있는 인식의 대상을 ( ㉢ )이라고 한다.

① ㉠: 미해결과제, ㉡: 전경, ㉢: 전경
② ㉠: 게슈탈트, ㉡: 전경, ㉢: 배경
③ ㉠: 게슈탈트, ㉡: 배경, ㉢: 진실성
④ ㉠: 미해결과제, ㉡: 배경, ㉢: 진실성`,
 ans:"② ㉠: 게슈탈트, ㉡: 전경, ㉢: 배경"},

{ch:"ch7", type:"연습",
 text:`다음 설명의 빈칸에 공통으로 들어갈 접촉 경계장애 유형은?

( )는 자신의 생각이나 욕구, 감정을 타인의 것으로 지각하는 것을 말한다. 예컨대, 자신이 타인에 대해 애정이나 적대감을 갖고 있으면서 오히려 타인이 자신에게 그러한 감정을 갖고 있는 것으로 지각하는 것이다.

① 투사
② 내사
③ 융합
④ 편향`,
 ans:"① 투사",
 exp:"투사(projection): 자신의 감정·욕구를 타인의 것으로 돌려 지각하는 접촉경계 혼란 유형."},

{ch:"ch7", type:"연습",
 text:`다음 설명의 빈칸에 들어갈 게슈탈트 심리치료이론의 치료기법은?

( )은(는) 내담자로 하여금 어떤 상황을 가정하여 그 역할이나 행동을 실제로 해 보도록 하는 기법을 말한다. 내담자가 자신에게 중요했던 과거의 장면이나 미래에 있을 장면을 실제 상황처럼 상상하면서 어떤 행동을 실제로 해보도록 하는 것이다.

① 창조적으로 투사하기
② 역할 연기하기
③ 직면시키기
④ 빈 의자 기법`,
 ans:"② 역할 연기하기",
 exp:"역할 연기하기(enactment): 실제처럼 장면을 연기해 봄으로써 알아차림을 높이는 기법. 빈 의자 기법은 실제로 없는 상대방이나 자신의 다른 부분과 대화하는 기법이다."},

{ch:"ch7", type:"연습",

{ch:"ch8", type:"기출", src:"2016 동계 12번",

{ch:"ch8", type:"기출", src:"2016 동계 13번",

{ch:"ch8", type:"기출", src:"2016 동계 14번",

ㄴ. 공포증과 같은 불안장애의 치료에 효과적이다.

{ch:"ch8", type:"기출", src:"2018 1학기 53번",

② 스키너는 고전적 조건형성을 체계화하여 학습과정을 설명하였다.

{ch:"ch8", type:"기출", src:"2018 1학기 54번",

{ch:"ch8", type:"기출", src:"2017 동계 23번",
 text:`실험상자 안에 배고픈 쥐가 있다. 이 쥐는 우연히 지렛대를 누르면 먹이가 나오는 것을 경험한다. 이것이 몇 차례 반복되면 쥐는 먹이를 얻기 위해 계속해서 지렛대를 누르게 되는데, 이러한 학습의 원리는 무엇인가?

④ 부적 처벌`,

{ch:"ch8", type:"기출", src:"2017 대체 24번",

① A-조건 자극, B-조건 반응, C-무조건 자극, D-무조건 반응
② A-중성 자극, B-무조건 반응, C-무조건 자극, D-무조건 반응

{ch:"ch8", type:"기출", src:"2019 1학기 51번",

{ch:"ch8", type:"기출", src:"2019 대체 59번",

{ch:"ch8", type:"기출", src:"2019 대체 60번",

{ch:"ch9", type:"기출", src:"2016 동계 17번",
 text:`합리적 정서행동치료(REBT)의 기법에 대한 설명으로 옳지 않은 것은?

① 기술 훈련: 내담자에게 부족한 행동기술을 향상시킬 수 있도록 교육하고 훈련하는 것
② 유머: 내담자의 비합리적 신념을 극단적으로 과장하여 우스꽝스러운 결론에 도달함으로써 어리석음을 익살스럽게 깨닫도록 하는 것
③ 수치심 깨트리기 연습: 내담자가 심리적 고통을 겪었거나 그러할 것으로 예상되는 상황을 치료자와 함께 역할 연기를 통해 체험해 보는 것
④ 합리적 정서 심상법: 내담자가 문제 상황에서 느낄 수 있는 적절하고 건강한 정서를 찾을 수 있도록 돕고 그러한 방법들을 연습하고 숙달하게 하는 것`,
 ans:"③",
 exp:"수치심 깨트리기 연습(shame-attacking exercise): 사회적으로 수치스럽다고 느끼는 행동을 실제로 해봄으로써 수치심에 대한 비합리적 두려움을 극복하는 기법이다. ③의 설명은 합리적 역할극(rational role reversal)에 해당한다."},

{ch:"ch9", type:"기출", src:"2017 동계 25번",
 text:`합리적 정서행동치료의 A-B-C 모델은 (A)에 대한 (B)이(가) (C)를 유발한다는 것을 의미한다. A, B, C에 알맞은 말은?

{ch:"ch9", type:"기출", src:"2017 동계 26번",

{ch:"ch9", type:"기출", src:"2018 1학기 56번",

{ch:"ch9", type:"연습",
 text:`REBT에 근거한 '비합리적 신념'에 대한 설명으로 옳지 않은 것은?

① 비합리적 신념은 자신, 타인, 세상에 대한 비현실적인 기대와 요구를 의미한다.
② 비합리적 신념은 '반드시~해야 한다'라는 절대적이고 완벽주의적인 당위적 요구의 형태를 띤다.
③ 세상에 대한 당위적 요구란 사회정치적 체제뿐만 아니라 자연세계에 대한 비현실적인 과도한 기대를 말한다.
④ 타인에 대한 당위적 요구란 자기 자신에게 현실적으로 충족되기 어려운 과도한 기대와 요구를 스스로 부과하는 것을 말한다.`,

{ch:"ch9", type:"연습",
 text:`다음의 REBT 상담 사례에서 '논박'에 해당하는 부분은?

내담자: ② '나는 얼마나 바보인가! 남들이 내 성적을 알면 ③ 나를 무시하겠지'라는 생각이 들어요.

{ch:"ch10", type:"기출", src:"2016 동계 20번",
 text:`다음 설명에 해당되는 벡(A. Beck) 인지치료의 치료기법은?

이것은 내담자가 지니고 있는 사고의 타당성을 직접적으로 검증하는 기법이다. 내담자는 자신의 행동에 대한 다른 사람의 생각이나 반응을 왜곡할 수 있다. 이 경우에 이것을 통해 내담자로 하여금 실제로 그러한 행동을 해보고 어떤 결과가 나타나는지를 확인하는 일종의 실험을 해보는 것이다.

① 행동실험
② 소크라테스식 대화
③ 역기능 사고 기록지
④ 이성적 감성적 역할연기`,
 ans:"① 행동실험",
 exp:"행동실험(behavioral experiment): 내담자의 자동적 사고·신념의 타당성을 실제 행동을 통해 직접 검증하는 기법. '다른 사람들이 나를 이상하게 볼 것이다'라는 사고를 실제 행동으로 검증하게 한다."},

{ch:"ch10", type:"기출", src:"2016 동계 21번",

② 어린 시절의 기억이 정신장애를 유발한다고 본다.
③ 우울증 환자들은 현실을 부정적 방향으로 왜곡한다고 본다.

{ch:"ch10", type:"기출", src:"2017 동계 28번",

{ch:"ch10", type:"기출", src:"2017 동계 29번",
 text:`자신과 무관한 사건을 자신과 관련된 것으로 잘못 해석하는 것을 의미하는 인지적 오류는?

{ch:"ch10", type:"기출", src:"2017 동계 30번",

{ch:"ch10", type:"기출", src:"2016 동계 18번",
 text:`벡(A. Beck) 인지치료의 인지삼제(cognitive triad)에 해당하지 않는 것은?

{ch:"ch13", type:"연습",
 text:`문제가 해결된 상태를 상상해 보고, 변화를 명료화하고 구체화하기 위해 활용하는 기법은?

① 예외질문
② 기적질문
③ 척도질문
④ 대처질문`,
 ans:"② 기적질문",
 exp:"기적질문(miracle question): '오늘 밤 자는 동안 기적이 일어나 문제가 해결된다면, 내일 아침 무엇이 달라져 있을까요?'와 같이 문제가 해결된 미래 상황을 구체적으로 상상하게 하는 질문."},

{ch:"ch13", type:"연습",
 text:`가족과 친구의 관점에서 내담자에게 질문하는 방식으로 이루어지는 칭찬 유형은?

 ans:"② 간접칭찬",
 exp:"간접칭찬: '당신의 가족(친구)은 당신의 이런 점을 어떻게 볼까요?'처럼 제3자의 시각을 빌려 칭찬하는 방법. 직접칭찬보다 방어를 줄이고 자연스럽게 강점을 인식하게 한다."}

];

// ── 목차 렌더링 ──
const tocList = document.getElementById('tocList');
chapters.forEach((ch, i) => {
  const count = quizData.filter(q => q.ch === ch.id).length;
  const item = document.createElement('div');
  item.className = 'toc-item';

  const num = document.createElement('span');
  num.className = 'toc-num';
  num.textContent = String(i + 1).padStart(2, '0');

  const label = document.createElement('span');
  label.className = 'toc-label';
  label.textContent = ch.label;

  const countSpan = document.createElement('span');
  countSpan.className = 'toc-count';
  countSpan.textContent = count > 0 ? `${count}문제` : '';

  const btn = document.createElement('button');
  if (count > 0) {
    btn.className = 'toc-btn';
    btn.textContent = '문제풀기 →';
    btn.addEventListener('click', () => showQuiz(ch));
  } else {
    btn.className = 'toc-btn wip';
    btn.textContent = '준비중';
  }

  item.appendChild(num);
  item.appendChild(label);
  item.appendChild(countSpan);
  item.appendChild(btn);
  tocList.appendChild(item);
});

function showToc() {
  document.getElementById('tocWrap').style.display = 'block';
  document.getElementById('quizWrap').style.display = 'none';
  window.scrollTo(0, 0);
}

function showQuiz(ch) {
  document.getElementById('tocWrap').style.display = 'none';
  document.getElementById('quizWrap').style.display = 'block';
  document.getElementById('quizChTitle').textContent = ch.label;
  renderQuiz(ch.id);
  window.scrollTo(0, 0);
}

function renderQuiz(chId) {
  const wrap = document.getElementById('quizContent');
  wrap.innerHTML = '';
  const items = quizData.filter(q => q.ch === chId);

  if (items.length === 0) {
    wrap.innerHTML = '<p class="placeholder-note">기출문제를 추가해주세요.</p>';
    return;
  }

  const kichul = items.filter(q => q.type === '기출');
  const yeonseup = items.filter(q => q.type === '연습');

  function renderSection(list, label) {
    if (list.length === 0) return;
    const div = document.createElement('div');
    div.className = 'section-divider';
    div.textContent = label;
    wrap.appendChild(div);

    list.forEach((q, i) => {
      const card = document.createElement('article');
      card.className = 'qcard';

      const tag = document.createElement('div');
      tag.className = 'q-tag ' + (q.type === '기출' ? 'kichul' : 'yeonseup');
      tag.textContent = q.type === '기출' ? '기출' : '연습';
      card.appendChild(tag);

      const num = document.createElement('div');
      num.className = 'q-num';
      num.textContent = q.src ? q.src : `연습문제 ${i + 1}`;
      card.appendChild(num);

      // ( ) 빈칸을 넓은 blank span으로 치환
      function renderWithBlanks(el, text) {
        // ( ) 또는 (  ) 패턴을 span.blank로 치환
        const html = text.replace(/\(\s{0,4}\)/g, '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
        el.innerHTML = html;
      }

      // 텍스트 파싱: 지문(보기) 박스 분리
      (function() {
        const lines = q.text.split('\n');
        const choicePattern = /^[①②③④⑤]|^[ㄱㄴㄷㄹㅁ]\.|^\([A-EABCDEㄱ-ㅎ가-힣]\)|^[ⓐⓑⓒⓓⓔ]|^[㉠㉡㉢㉣㉤]/;

        let firstChoiceIdx = -1;
        for (let li = 0; li < lines.length; li++) {
          if (choicePattern.test(lines[li].trim())) { firstChoiceIdx = li; break; }
        }

        if (firstChoiceIdx > 1) {
          const questionLine = lines[0];
          const midLines = lines.slice(1, firstChoiceIdx).filter(l => l.trim() !== '');
          const choiceLines = lines.slice(firstChoiceIdx);

          const qEl = document.createElement('div');
          qEl.className = 'q-body';
          qEl.style.marginBottom = '8px';
          renderWithBlanks(qEl, questionLine);
          card.appendChild(qEl);

          if (midLines.length > 0) {
            const pEl = document.createElement('div');
            pEl.className = 'q-passage';
            renderWithBlanks(pEl, midLines.join('\n'));
            card.appendChild(pEl);
          }

          const choiceEl = document.createElement('div');
          choiceEl.className = 'q-body';
          choiceEl.style.whiteSpace = 'pre-wrap';
          renderWithBlanks(choiceEl, choiceLines.join('\n'));
          card.appendChild(choiceEl);
        } else {
          const body = document.createElement('pre');
          body.className = 'q-body';
          renderWithBlanks(body, q.text);
          card.appendChild(body);
        }
      })();

      if (q.ans) {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML = '▶ 정답 및 해설 보기';
        card.appendChild(btn);

        const box = document.createElement('div');
        box.className = 'answer-box';
        box.innerHTML = `<div class="ans-label">정답: ${q.ans}</div><div class="ans-exp">${q.exp || ''}</div>`;
        card.appendChild(box);

        btn.addEventListener('click', () => {
          const open = box.classList.contains('visible');
          box.classList.toggle('visible', !open);
          btn.classList.toggle('open', !open);
          btn.innerHTML = open ? '▶ 정답 및 해설 보기' : '▼ 정답 및 해설 닫기';
        });
      }

      wrap.appendChild(card);
    });
  }

  renderSection(kichul, '📋 기출문제');
  renderSection(yeonseup, '✏️ 연습문제');
}
</script>
