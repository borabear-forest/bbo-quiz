<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>인터넷생활윤리</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--bg:#f7f4ef;--paper:#fffefb;--ink:#1c1a17;--muted:#7a7268;--line:#e3ddd4;--accent:#1a3258;--soft:#eaeff6;--radius:14px;--shadow:0 2px 16px rgba(28,26,23,.07);--correct:#2d6a4f;--correct-bg:#e8f5ee;--correct-line:#95d5b2;--wrong:#9b2335;--wrong-bg:#fdf0f0;--wrong-line:#e8a0a8;--exp-bg:#f0f4fa;}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;min-height:100vh;}
header{background:var(--ink);color:#fff;padding:22px 24px 18px;text-align:center;}
.header-back{display:inline-block;margin-bottom:8px;font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-decoration:none;letter-spacing:.06em;transition:color .15s;}
.header-back:hover{color:rgba(255,255,255,.8);}
header h1{font-family:'Noto Serif KR',serif;font-size:clamp(18px,3.5vw,26px);letter-spacing:-.03em;}
.toc-wrap{max-width:720px;margin:0 auto;padding:36px 16px 80px;}
.toc-section-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--ink);}
.toc-list{display:flex;flex-direction:column;gap:8px;}
.toc-item{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);}
.toc-num{font-size:13px;font-weight:900;color:var(--muted);min-width:24px;}
.toc-label{flex:1;font-size:15px;font-weight:700;word-break:keep-all;}
.toc-meta{font-size:11px;color:var(--muted);white-space:nowrap;}
.toc-btn{flex-shrink:0;background:none;border:1.5px solid var(--accent);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;font-family:inherit;color:var(--accent);cursor:pointer;transition:all .15s;white-space:nowrap;}
.toc-btn:hover{background:var(--accent);color:#fff;}
.toc-btn.wip{border-color:var(--line);color:var(--muted);pointer-events:none;}
.quiz-wrap{max-width:720px;margin:0 auto;padding:28px 16px 80px;display:none;}
.quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--ink);}
.quiz-back{background:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .15s;}
.quiz-back:hover{border-color:var(--accent);color:var(--accent);}
.quiz-ch-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;letter-spacing:-.03em;word-break:keep-all;}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
.q-num{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;}
.q-text{font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;margin-bottom:14px;}
.options{display:flex;flex-direction:column;gap:7px;}
.opt-btn{width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;font-family:'Noto Sans KR',sans-serif;line-height:1.6;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:border-color .15s,background .15s;word-break:keep-all;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:var(--soft);}
.opt-btn:disabled{cursor:default;}
.opt-mark{font-weight:900;color:var(--muted);min-width:20px;font-size:14px;flex-shrink:0;margin-top:1px;}
.opt-btn.correct{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}
.opt-btn.correct .opt-mark{color:var(--correct);}
.opt-btn.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong);}
.opt-btn.wrong .opt-mark{color:var(--wrong);}
.opt-btn.reveal{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}
.opt-btn.reveal .opt-mark{color:var(--correct);}
.exp-box{display:none;margin-top:12px;padding:12px 14px;background:var(--exp-bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.75;color:var(--ink);word-break:keep-all;}
.exp-box.visible{display:block;}
.exp-label{font-size:11px;font-weight:900;color:var(--accent);letter-spacing:.06em;margin-bottom:4px;}
.reset-btn{margin-top:10px;display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;}
.reset-btn:hover{border-color:var(--accent);color:var(--accent);}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);}
@media(max-width:480px){.toc-item{padding:13px 14px;gap:10px;}.toc-label{font-size:14px;}.opt-btn{font-size:13px;padding:9px 12px;}}</style>
</head>

</div>

  <div class="quiz-header">
    <button class="quiz-back" onclick="showToc()">← 목차로</button>
    <div class="quiz-ch-title" id="quizChTitle"></div>

</div>

<script>
const MARKS=['①','②','③','④','⑤'];
const chapters=[{"id": "ch1", "label": "제1장 정보사회, 인터넷, 가상 공간"}, {"id": "ch2", "label": "제2장 사이버 공간과 인간의 심리"}, {"id": "ch3", "label": "제3장 사이버 문화"}, {"id": "ch4", "label": "제4장 디지털 원주민"}, {"id": "ch5", "label": "제5장 표현의 자유"}, {"id": "ch6", "label": "제6장 프라이버시"}, {"id": "ch7", "label": "제7장 지식 재산권"}, {"id": "ch8", "label": "제8장 정보보호"}, {"id": "ch9", "label": "제9장 사이버 범죄"}, {"id": "ch10", "label": "제10장 인터넷 중독"}, {"id": "ch11", "label": "제11장 디지털 시대의 시민"}, {"id": "ch12", "label": "제12장 사이버 윤리 교육"}];
const quizData=[{"ch": "ch1", "text": "정보사회에 대한 설명으로 적절하지 않은 것은?", "options": ["아날로그 사회에서 디지털 세계로의 변화를 의미한다.", "다양한 영역에서 정보통신기술이 활용되는 사회를 말한다.", "지역과 영역 간 경계가 더욱 뚜렷해진다.", "이전 사회와 단절된 새로운 사회로 보기도 하지만 연속된 사회로 보기도 한다."], "ans": 2, "exp": "정보사회는 오히려 지역과 영역 간 경계가 약화되는 특성을 보인다. 디지털 기술의 발전으로 공간적 제약이 줄어들고 경계가 흐릿해진다."}, {"ch": "ch1", "text": "정보사회에 대한 사회구조론적 입장에 관한 설명으로 가장 적절한 것은?", "options": ["기술을 사회 변화의 유일한 요인으로 간주한다.", "새로운 기술은 사회구조와 무관하게 나타난다.", "기술의 사용은 중립적일 수 없고 자본의 논리에 따른다.", "정보기술에 대한 사회 구성원의 자율적 선택을 강조한다."], "ans": 2, "exp": "사회구조주의(사회구조론)는 기술이 사회구조와 자본의 논리에 따라 사용된다고 본다. 기술결정주의와 달리 기술 자체보다 사회적 맥락을 강조한다."}, {"ch": "ch1", "text": "메시지 측면에서 정해진 시작과 끝이 없이 마치 미로처럼 얽혀 있어 독자의 입장에서 보면 어떤 길을 선택하느냐에 따라 다양한 텍스트의 가능성이 열려 있음을 의미하는 인터넷의 특성은?", "options": ["상호작용성", "멀티미디어성", "하이퍼미디어성", "동시성과 비동시성"], "ans": 2, "exp": "하이퍼미디어성은 비순차적·비선형적으로 정보를 조직하고 탐색할 수 있는 특성이다. 미로처럼 얽혀 다양한 경로를 선택할 수 있다는 것이 핵심이다."}, {"ch": "ch1", "text": "제시된 정보사회에 대한 관점으로 가장 적절한 것은?\n\n\"정보사회는 사회의 불확실성을 극복하고 정보의 문제를 해결하기 위해 정보통신기기와 기술이 빠르게 확산된 것이다.\"", "options": ["기술공학적 관점", "사회학적 관점", "경제학적 관점", "법학적 관점"], "ans": 0, "exp": "기술공학적 관점(기술결정주의)은 기술 자체의 발전과 확산을 정보사회 변화의 주된 원인으로 본다."}, {"ch": "ch1", "text": "정보사회의 사회적 영향에 대한 낙관론으로 보기 어려운 것은?", "options": ["개성화와 다양화가 이루어질 것으로 본다.", "표준화를 중심으로 사회가 재편될 것으로 본다.", "정보통신 기술의 발전이 문화를 풍부하게 만들 것으로 본다.", "디지털 기술의 확산으로 생산성이 증대될 것으로 본다."], "ans": 1, "exp": "낙관론은 개성화, 다양화, 문화 풍부화, 생산성 증대 등을 강조한다. 표준화 중심의 사회 재편은 오히려 산업사회적 특성이며 낙관론과 거리가 멀다."}, {"ch": "ch1", "text": "정보사회의 특성에 대한 설명으로 가장 적절한 것은?", "options": ["노동의 가치는 노동의 질보다 양이 결정하는 양상이 강화된다.", "시간과 공간의 극복이 어려워져 경계가 강한 사회로 변화한다.", "시스템이 간결하게 되어 불확실성이 줄어든다.", "수평적 협력으로 인해 열린 사회로 변화한다."], "ans": 3, "exp": "정보사회는 수평적 네트워크와 협력이 강조되며 열린 사회로 변화한다. 시간·공간의 제약이 줄어들고, 노동의 질(지식·정보)이 중요해진다."}, {"ch": "ch1", "text": "다음 설명을 통해 볼 수 있는 정보사회에 대한 시각으로 적절한 것은?\n\n\"선진자본주의 국가의 입장에서는 고부가가치를 가진 정보 상품과 효율적인 생산기술을 토대로 체제 위기를 극복하고자 하였다.\"", "options": ["기술결정주의", "기술현실주의", "사회구조주의", "비관주의"], "ans": 2, "exp": "사회구조주의는 정보기술이 자본의 논리와 사회구조 속에서 활용된다고 본다. 고부가가치 정보 상품을 통한 자본주의 체제 위기 극복은 사회구조주의적 시각이다."}, {"ch": "ch1", "text": "메시지 측면에서 미로처럼 얽혀 있어 비순차적이고 비선형적으로 정보를 조직할 수 있는 것과 관련한 인터넷 매체의 특성은?", "options": ["비동시성", "상호작용성", "멀티미디어", "하이퍼미디어"], "ans": 3, "exp": "하이퍼미디어는 텍스트, 이미지, 영상 등이 비선형적으로 연결되어 미로처럼 다양한 경로로 탐색할 수 있는 특성이다."}, {"ch": "ch1", "text": "기술을 사회 변화의 주된 요인으로 간주하는 정보사회에 대한 관점은?", "options": ["기술결정주의", "사회구조주의", "기술현실주의", "기술적용주의"], "ans": 0, "exp": "기술결정주의는 기술 자체가 사회 변화를 이끄는 핵심 요인이라고 본다."}, {"ch": "ch1", "text": "산업 사회에 비해 지식정보사회에서 더욱 강조되는 특성만으로 조합된 것은?", "options": ["대량생산 문화 중심", "물질 상품 - 육체 노동", "시간 불가역성 - 소프트웨어", "상징 상품 - 지식 노동"], "ans": 3, "exp": "지식정보사회는 물질 상품보다 상징 상품(정보·문화·콘텐츠), 육체 노동보다 지식 노동이 강조되는 사회이다."}, {"ch": "ch1", "text": "다음 설명을 통해 볼 수 있는 정보사회에 대한 시각을 순서대로 적절하게 나열한 것은?\n\n\"산업사회의 환경 속에서 정보화라는 개념을 통해 정보통신 산업이 발달하였다.\"\n\"새로운 기술의 영향력을 인간이 어떻게 조정할 것인가가 중요하다.\"", "options": ["연속론 - 사회구조주의", "연속론 - 기술현실주의", "단절론 - 사회구조주의", "단절론 - 기술현실주의"], "ans": 1, "exp": "산업사회의 연장선에서 정보화가 발달했다는 것은 연속론이다. 기술의 영향력을 인간이 조정해야 한다는 것은 기술결정주의도 사회구조주의도 아닌 기술현실주의의 입장이다."}, {"ch": "ch1", "text": "'인터넷'을 네트워크 이용자들이 유사한 관심에 따라 집단을 구성하는 것에서 강조되는 측면은?", "options": ["기술적 측면", "사회적 측면", "정보적 측면", "커뮤니케이션 측면"], "ans": 1, "exp": "유사한 관심을 가진 사람들이 집단을 구성하는 것은 인터넷의 사회적 측면이다."}, {"ch": "ch2", "text": "현실과 비교하여 나타나는 CMC와 사이버 공간의 매체적 특징이 아닌 것은?", "options": ["면대면 커뮤니케이션이 주로 이루어진다.", "교류 당사자의 신체가 드러나지 않는다.", "시간과 공간의 제약이 적다.", "동시적·비동시적 상호작용이 모두 가능하다."], "ans": 0, "exp": "CMC(컴퓨터 매개 커뮤니케이션)는 면대면이 아닌 디지털 매체를 통한 커뮤니케이션이 이루어진다. 면대면이 주로 이루어진다는 설명은 CMC의 특징이 아니다."}, {"ch": "ch2", "text": "다음 설명에 해당하는 인간의 가상공간 활용욕구로 적절한 것은?\n\n사이버 공간에서도 사람들은 친화욕구를 가지고 있어 집단에 가입하고 다른 구성원들과 교류하며 인정과 관심을 받고 우호적이며 따뜻한 사회관계를 유지하고 회복하려고 노력한다.", "options": ["정보 지향적 접근", "활동 지향적 접근", "인간관계 지향적 접근", "경제적 접근"], "ans": 2, "exp": "친화욕구를 바탕으로 집단에 가입하고 사회적 유대를 유지하려는 것은 인간관계 지향적 접근이다."}, {"ch": "ch2", "text": "사이버 교류과정에서의 탈억제 효과에 대한 설명으로 적절한 것은?", "options": ["현실세계보다 더 폐쇄적으로 자신을 감추는 현상이다.", "내적 감정과 욕구 방출을 엄격히 조절하고 통제하는 것이다.", "직접적 피해가 보이지 않아 피해를 주는 행동을 선택할 가능성이 높다.", "비동시성으로 인하여 정보를 즉각 을 얻는 것이다."}, {"ch": "ch2", "text": "사이버 공간 속 커뮤니케이션의 주요한 특징이 아닌 것은?", "options": ["수평적", "폐쇄적", "쌍방향", "개인화"], "ans": 1, "exp": "사이버 공간의 커뮤니케이션은 수평적, 쌍방향, 개인화 등의 특성을 갖는다. 폐쇄적이 아니라 오히려 개방적인 것이 특징이다."}, {"ch": "ch2", "text": "현실과 비슷한 양상을 나타내지만 현실 세계와는 크게 관련이 없는 사이버 공간 속 인간의 의사소통은?", "options": ["대면적", "가상적 현실", "현실적 가상", "허구적"], "ans": 2, "exp": "현실적 가상(realistic virtual)은 현실과 유사한 양상이지만 현실과 직접 연결되지 않는 가상의 상호작용이다."}, {"ch": "ch2", "text": "'잊혀질 권리'와 가장 밀접하게 관련된 사이버 공간의 매체적 특징은?", "options": ["탈신체성", "비가시성", "기록의 보존성", "멀티미디어성"], "ans": 2, "exp": "'잊혀질 권리'는 인터넷에 남아있는 개인 정보나 기록을 삭제할 권리로, 기록의 보존성(영구적 기록)과 가장 밀접하게 관련된다."}, {"ch": "ch2", "text": "자유로운 의사 표현과 평등한 분위기를 조성하는 데 기여하는 동시에 자신의 정체를 드러내지 않아도 되어 탈규제적 행동의 가능성이 높아지는 CMC의 독특한 특성은?", "options": ["사회적 실재감", "사회적 맥락 단서", "타인지향적 교류", "익명성"], "ans": 3, "exp": "익명성은 정체를 드러내지 않아 자유로운 표현을 가능하게 하는 동시에 탈규제적·탈억제적 행동의 가능성을 높인다."}, {"ch": "ch2", "text": "자유감, 통제감, 유능감, 재미, 신기함, 짜릿함을 모두 설명할 수 있는 컴퓨터 사용 행동은?", "options": ["정보 지향적 행동", "활동 지향적 행동", "인간 관계 지향적 행동", "사회 기여 추구적 행동"], "ans": 1, "exp": "게임, 탐색 등 활동 자체에서 자유감·통제감·유능감·재미 등을 경험하는 것은 활동 지향적 행동이다."}, {"ch": "ch3", "text": "사이버 문화에 대한 설명으로 적절하지 않은 것은?", "options": ["일반적으로 현실공간과 비교되는 가상공간의 문화를 말한다.", "사이버 공간의 콘텐츠들이 정확하거나 건전한 것은 아니다.", "가상공간을 전제하기 때문에 현실세계의 문화와 완전히 구분된다.", "가상공간과 현실공간에서의 상호작용 방식은 서로 다를 수 있다."], "ans": 2, "exp": "사이버 문화는 현실 문화와 완전히 구분되지 않고 상호 영향을 주고받는다. 가상과 현실은 분리된 것이 아니라 연결되어 있다."}, {"ch": "ch3", "text": "사이버 문화의 모습과 거리가 먼 것은?", "options": ["개인성과 쾌락의 문화", "선명성과 극단성의 문화", "초월성과 가상성의 문화", "보편성과 전체성의 문화"], "ans": 3, "exp": "사이버 문화는 개인성·쾌락, 선명성·극단성, 초월성·가상성 등이 특징이다. 보편성과 전체성은 대중문화·산업사회의 특성에 가깝고 사이버 문화의 특성과 거리가 멀다."}, {"ch": "ch3", "text": "온라인 커뮤니티에 대한 설명으로 적절한 것은?", "options": ["연령이나 사회경제적 지위 등이 중요한 영향을 미친다.", "가입과 탈퇴가 자유롭기 때문에 규범이나 규칙은 존재하지 않는다.", "공통된 관심에 기반하기 때문에 구성원 간의 관심사가 일정하다.", "다른 커뮤니티와의 접촉이 부족하여 배타적인 양상이 나타나기도 한다."], "ans": 3, "exp": "온라인 커뮤니티는 유사한 관심사를 중심으로 모이므로 외부와의 접촉이 적고 배타적 양상이 나타날 수 있다."}, {"ch": "ch3", "text": "인터넷 공간의 콘텐츠와 관련한 3P 콘텐츠 전략이 아닌 것은?", "opt  "options": ["사적 정보의 가치에 대한 관심은 나타나지 않는다.", "정부와 언론기관의 활동을 통제하는 데 초점이 있다.", "유명인 외에 일반인의 문제로 확대된다.", "홀로 있을 권리라는 소극적이고 방어적인 접근이 이루어진다."], "ans": 2, "exp": "정보사회에서 프라이버시 권리는 유명인에 국한되지 않고 일반인의 개인정보 보호 문제로 확대되었다."}, {"ch": "ch6", "text": "프라이버시와 개인정보에 대한 설명으로 올바른 것은?", "options": ["개인정보는 개인의 식별 가능한 일체의 정보를 대상으로 한다.", "정보사회의 프라이버시 정책은 개인정보 보호와 무관하게 이루어진다.", "다양한 정보를 결합하여 특정인을 확인할 수 있는 경우는 개인정보에 해당하지 않는다.", "프라이버시에 비해 개인정보의 보호는 소극적인 접근으로 볼 수 있다."], "ans": 0, "exp": "개인정보는 개인을 식별할 수 있는 일체의 정보를 대상으로 한다. 여러 정보를 결합해 특정인을 식별할 수 있어도 개인정보에 해당한다."}, {"ch": "ch6", "text": "사람들이 인터넷 프라이버시 침해를 우려하면서도 인터넷 사용의 편의나 다른 금전적 이익을 위해 프라이버시를 포기하는 현상은?", "options": ["프라이버시의 종말", "네트워크 프라이버시", "프라이버시 패러독스", "소셜 네트워크 서비스"], "ans": 2, "exp": "프라이버시 패러독스는 프라이버시를 중요하게 생각하면서도 실제로는 편의나 이익을 위해 개인정보를 제공하는 모순적 행동이다."}, {"ch": "ch6", "text": "언제 어디를 가나 CCTV가 찍고, 카드로 출입정보가 기록되고, 광고 메일이 가득하는 등 디지털 활동 기록이 모두 기록되는 상황에 해당하는 적절한 개념은?", "options": ["프라이버시 패러독스", "네트워크 프라이버시", "프라이버시의 종말", "소셜 네트워크 서비스"], "ans": 2, "exp": "프라이버시의 종말은 디지털 기술의 발전으로 개인의 활동이 전방위적으로 기록·감시되어 사실상 프라이버시가 사라지는 현상이다."}, {"ch": "ch6", "text": "프라이버시와 개인정보의 비교 중 옳지 않은 것은?", "options": ["프라이버시: 사적 영역 / 개인정보: 프라이버시의 정보 형태", "프라이버시: 보호 대상으로서 객체적 존재 의미 강조 / 개인정보: 정보 주체가 보호를 위해 지켜야 할 권리를 강조", "프라이버시 보호 대상: 개인을 난처하게 할 우려가 있는 사적 정보 / 개인정보 보호 대상: 개인 식별 가능한 일체의 정보", "프라이버시: 외부에 대한 사적 정보의 소극적 보존에 초점 / 개인정보: 정보 주체의 적극적 통제권 인정"], "ans": 1, "exp": "프라이버시는 보호 대상으로서 객체적 의미가 강조되지만, 개인정보는 정보 주체가 자신의 정보에 대한 적극적 통제권을 행사하는 권리를 강조한다는 설명이 더 정확하다."}, {"ch": "ch6", "text": "네트워크 프라이버시와 관련하여 나타난 현상으로 보기 어려운 것은?", "options": ["소셜미디어를 통한 지속적인 개인정보 제공", "개인의 자발적인 자기 노출", "네트워크 서비스 제공자와 이용자의 권력 균형", "프라이버시 패러독스 현상"], "ans": 2, "exp": "네트워크 프라이버시 상황에서는 서비스 제공자가 막대한 데이터를 보유하므로 이용자와의 권력 불균형이 심화된다. 권력 균형이 이루어진다는 설명은 적절하지 않다."}, {"ch": "ch7", "text": "창작과 동시에 보호를 받으며, 보호받기 위한 별도의 절차나 방식이 필요하지 않은 권리는?", "options": ["특허권", "저작권", "상표권", "디자인권"], "ans": 1, "exp": "저작권은 창작물이 만들어지는 순간 자동으로 발생하며 별도의 등록 절차가 필요 없다(무방식주의). 특허권·상표권·디자인권은 등록이 필요한 산업재산권이다."}, {"ch": "ch7", "text": "저작권에 대한 특성으로 적절한 것은?", "options": ["동물이 그린 그림도 저작권의 인정을 받는다.", "초등학생의 작품은 저작권의 보호를 받지 못한다.", "머릿속에 있는 아이디어도 저작물로 보호받을 수 있다.", "법률에 의한 보호기간이 존재한다."], "ans": 3, "exp": "저작권에는 법률로 정한 보호기간이 있다(일반적으로 저작자 사망 후 70년). 동물의 저작물은 인정되지 않고, 아이디어는 표현되어야 보호받는다."}, {"ch": "ch7", "text": "한 대학교 학생회장이 연설 일부의 출처를 밝히지 않았고, 심리학자가 박사논문의 상당 부분이 다른 논문과 동일하다는 것이 밝혀진 경우에 해당하는 저작권 침해 현상은?", "options": ["표절", "소프트웨어 불법 유통", "재포장된 데이터 사용", "전송과정에서의 복제"], "ans": 0, "exp": "출처를 밝히지 않고 타인의 저작물을 자신의 것처럼 사용하는 것은 표절이다."}, {"ch": "ch7", "text": "플로킨이 제시한 저작물의 정당한 사용 여부의 기준이 아닌 것은?", "options": ["저작물의 사용 목적과 성격", "복제물의 특징", "복제량과 본질", "시장 가격"], "ans": 3, "exp": "플로킨의 정당한 사용 기준: 사용 목적과 성격, 저작물의 성격, 복제량과 본질(실질적 유사성), 시장 가치에 미치는 영향이다. 시장 가격 자체는 기준이 아니다."}, {"ch": "ch7", "text": "플로킨이 제시한 저작물의 사용 기준에 따라 정당한 사용에 해당하는 것은?", "options": ["상업적 목적에 따라 저작물 무단 사용", "역사적 사실 기록물을 복제하여 사용", "저작물의 전체 복제", "복제 이후 저작물의 가치 하락"], "ans": 1, "exp": "역사적 사실 기록물의 복제는 교육·연구 목적 등 공공 이익을 위한 사용으로 정당한 사용에 해당할 수 있다."}, {"ch": "ch8", "text": "스파이웨어에 대한 설명으로 옳은 것은?", "options": ["사생활 침해 가능성에서 자유롭다.", "정상 프로그램의 운영을 보조하는 기능이 있다.", "백신 프로그램과 함께 사용하면 효과적이다.", "사용자의 동의 없이 또는 사용자를 속여 설치된다."], "ans": 3, "exp": "스파이웨어는 사용자의 동의 없이 또는 속여서 설치되어 개인정보를 수집하는 악성 프로그램이다."}, {"ch": "ch8", "text": "웹사이트에서 개인을 확인하기 위해 수집한 개인정보의 해킹 및 불법적 거래 노출 우려로 만들어진, 인터넷에서 주민등록번호를 대신하는 본인 확인 수단은?", "options": ["디지털 워터마크", "DRM", "생체 인식 시스템", "i-Pin"], "ans": 3, "exp": "i-PIN(인터넷 개인식별번호)은 주민등록번호 대신 온라인에서 본인을 확인하기 위해 만들어진 제도이다."}, {"ch": "ch8", "text": "저작권 보호 기술 중 창작 콘텐츠에 디지털 표시를 통해 불법 복제가 불가능하도록 하는 것은?", "options": ["DRM(digital rights management)", "디지털 워터마킹", "디지털 핑거프린팅", "GPL(general public license)"], "ans": 0, "exp": "DRM(디지털 저작권 관리)은 디지털 콘텐츠의 무단 복제와 사용을 방지하는 기술적 보호 장치이다."}, {"ch": "ch8", "text": "송신자의 메시지를 중간에서 가로채 변경하여 수신자에게 전달하는 사이버 공격은?", "options": ["전송 방해", "도청", "변조", "위조"], "ans": 2, "exp": "변조는 메시지를 중간에서 가로채어 내용을 바꾸어 전달하는 공격이다. 도청은 가로채기만 하고, 위조는 새로운 메시지를 만드는 것이다."}, {"ch": "ch8", "text": "컴퓨터 시스템에 몰래 침투하여 데이터나 응용 프로그램 등에 문제를 일으키는 사이버 공격 혹은 해킹 기술은?", "options": ["서비스거부공격", "악성코드", "피싱", "방화벽"], "ans": 1, "exp": "악성코드(malware)는 컴퓨터 시스템에 침투하여 데이터를 손상시키거나 문제를 일으키는 소프트웨어이다. 바이러스, 웜, 트로이목마 등이 포함된다."}, {"ch": "ch8", "text": "전자우편이나 메신저를 통해 신뢰할 수 있는 사람이 보낸 것처럼 가장하여 정보를 부정하게 얻으려는 사이버 공격은?", "options": ["서비스거부공격", "피싱", "방화벽", "악성코드"], "ans": 1, "exp": "피싱(phishing)은 신뢰할 수 있는 기관이나 사람인 척 가장하여 개인정보나 금융정보를 탈취하는 사기 공격이다."}, {"ch": "ch8", "text": "저작권 보호를 위한 규제 방식 중 성격이 다른 하나는?", "options": ["DRM(digital rights management)", "디지털 워터마킹", "디지털 핑거프린팅", "저작권 삼진아웃"], "ans": 3, "exp": "DRM, 디지털 워터마킹, 디지털 핑거프린팅은 기술적 보호 조치이다. 저작권 삼진아웃은 법적·제도적 규제 방식으로 성격이 다르다."}, {"ch": "ch8", "text": "웜, 트로이목마, 바이러스, 스파이웨어를 포괄할 수 있는 사이버 공격 유형은?", "options": ["서비스거부공격", "악성코드", "피싱", "스니핑"], "ans": 1, "exp": "악성코드(malware)는 웜, 트로이목마, 바이러스, 스파이웨어 등을 모두 포괄하는 개념이다."}, {"ch": "ch9", "text": "사이버 범죄의 특성이 아닌 것은?", "options": ["현실 범죄보다 복잡한 양상을 띤다.", "사이버 공간과 함께 일상생활에 미치는 파급력이 크다.", "현실 범죄에 비하여 재발 가능성이 높다.", "사이버 공간에서 발생하므로 접근 가능성이 낮다."], "ans": 3, "exp": "사이버 범죄는 네트워크를 통해 접근이 용이하므로 접근 가능성이 오히려 높다. 낮다는 설명은 틀렸다."}, {"ch": "ch9", "text": "헤어진 여자의 새 남자친구 홈페이지에 인신 공격성 글을 남기고, 허위 사실을 퍼뜨린 경우에 나타난 사이버 범죄의 유형은?", "options": ["인터넷 사기", "사이버 스토킹", "사이버 명예훼손", "사이버 성폭력"], "ans": 2, "exp": "허위 사실이나 인신 공격성 내용을 온라인에 게시하여 타인의 명예를 훼손하는 것은 사이버 명예훼손이다."}, {"ch": "ch9", "text": "인터넷 사기의 유형에 해당하지 않는 것은?", "options": ["인터넷 쇼핑몰에서 대금을 지급하였음에도 물품을 배송하지 않은 경우", "인터넷상에서 게임 아이템의 대가로 받기로 한 대금을 지급하지 않는 경우", "개인의 금융정보를 가로채는 경우", "정보통신망을 이용하여 유해정보를 배포하는 경우"], "ans": 3, "exp": "유해정보 배포는 불법콘텐츠 관련 범죄이며 인터넷 사기와는 다른 유형이다. 인터넷 사기는 재산상 이득을 목적으로 하는 기망 행위이다."}, {"ch": "ch9", "text": "사이버 공간에서 타인을 비방할 목적으로 정보통신망을 통하여 공연히 타인에 대한 사실이나 허위 사실을 적시하는 사이버 폭력은?", "options": ["사이버 모욕", "사이버 명예훼손", "사이버 성폭력", "불법·유해정보"], "ans": 1, "exp": "사이버 명예훼손은 공연히 사실 또는 허위 사실을 적시하여 타인의 명예를 훼손하는 행위이다. 사이버 모욕은 구체적 사실 없이 모욕적 표현을 하는 것이다."}, {"ch": "ch9", "text": "월(D. Wall)이 제시한 사이버 범죄 중 컴퓨터 무결성 범죄에 해당하는 것은?", "options": ["인터넷 폭력 및 음란물", "인터넷 사기", "저작권 침해", "해킹"], "ans": 3, "exp": "월(Wall)의 분류에서 컴퓨터 무결성 범죄는 해킹, 바이러스 유포 등 컴퓨터 시스템 자체를 침해하는 범죄이다."}, {"ch": "ch9", "text": "사이버 범죄를 구분할 때 해킹이 해당하는 것은?", "options": ["경찰청: 정보통신망 침해 / 월(D. Wall): 컴퓨터 무결성", "경찰청: 정보통신망 이용 / 월(D. Wall): 컴퓨터 무결성", "경찰청: 정보통신망 이용 / 월(D. Wall): 컴퓨터 활용", "경찰청: 불법콘텐츠 / 월(D. Wall): 컴퓨터 콘텐츠"], "ans": 0, "exp": "해킹은 경찰청 분류에서 정보통신망 침해, 월(Wall)의 분류에서 컴퓨터 무결성 범죄에 해당한다."}, {"ch": "ch10", "text": "인터넷을 하지 않으면 불안하고 초조해지는 등의 인터넷 중독 증상은?", "options": ["은둔", "금단", "회피", "현실 구분 장애"], "ans": 1, "exp": "금단은 인터넷을 사용하지 못할 때 불안, 초조, 짜증 등의 불쾌한 심리·신체 증상이 나타나는 것이다."}, {"ch": "ch10", "text": "인터넷 중독을 야기하는 인터넷 매체의 내재적 특성이 아닌 것은?", "options": ["속도", "내용 자극", "여가 기능", "정보의 집중성"], "ans": 3, "exp": "인터넷 중독을 야기하는 내재적 특성은 속도, 내용 자극(강렬한 콘텐츠), 여가 기능 등이다. 정보의 집중성은 중독을 유발하는 내재적 특성과 거리가 멀다."}, {"ch": "ch10", "text": "특정한 이유 없이 사이트를 돌아다니며 무차별적인 웹서핑을 하고, 정보를 검색하느라 시간 통제가 불가능하며, 일상의 지루함을 견디지 못하는 증상에 해당하는 인터넷 중독의 유형은?", "options": ["인터넷 게임 중독", "인터넷 채팅 중독", "사이버 거래 중독", "정보검색 중독"], "ans": 3, "exp": "정보검색 중독은 목적 없이 정보를 검색하고 웹서핑하느라 시간 통제가 되지 않는 유형이다."}, {"ch": "ch10", "text": "동일한 만족을 느끼기 위해 인터넷 접속 시간이 길어지거나 자극의 강도를 높여가야 하는 인터넷 중독 증상은?", "options": ["내성", "금단", "현실 구분 장애", "가상 세계 지향"], "ans": 0, "exp": "내성은 같은 효과를 얻기 위해 점점 더 많은 양이나 강도가 필요해지는 현상이다. 약물 중독의 내성과 동일한 개념이다."}, {"ch": "ch10", "text": "인터넷 중독의 요인에 대한 설명으로 바른 것은?", "options": ["영은 인터넷 자체의 속성이 인터넷에 대한 중독을 가져온다고 보았다.", "인터넷 중독과 대인 관계를 형성하는 것은 관계가 없다.", "나이와 성별에 따른 중독 경향의 연구 결과는 일정한 편이다.", "자기 통제력이 낮거나 충동성이 강할수록 중독 경향이 높다."], "ans": 3, "exp": "자기 통제력이 낮고 충동성이 강한 개인은 인터넷 중독에 취약하다. 영(Young)은 인터넷 자체보다 개인·심리적 요인을 강조했다."}, {"ch": "ch10", "text": "온라인 게임, 경매, 상거래 등의 과도한 사용에 해당하는 영(Young)이 제시한 인터넷 중독 유형은?", "options": ["사이버 관계 중독", "인터넷 강박", "정보 과다", "컴퓨터 중독"], "ans": 1, "exp": "인터넷 강박(net compulsions)은 온라인 게임, 경매, 상거래, 도박 등에 강박적으로 몰두하는 유형이다."}, {"ch": "ch11", "text": "디지털 시대의 변화 양상에 대한 설명으로 옳지 않은 것은?", "options": ["인터넷을 통해 시간과 장소를 초월하여 전 지구적으로 상호 연결이 가능해졌다.", "사이버 공간의 확산으로 시민 참여가 확장되었다.", "문화 영역에서 문화의 생산자와 소비자의 경계가 분명해져 생산자의 권력이 증대되었다.", "신문이나 문예지 같은 매체 외에 온라인을 통해 등단하는 사람이 점차 많아지고 있다."], "ans": 2, "exp": "디지털 시대에는 오히려 생산자와 소비자의 경계가 흐릿해지고(프로슈머), 일반인도 콘텐츠를 생산할 수 있게 되었다."}, {"ch": "ch11", "text": "촘촘한 연결망을 이용하여 현실의 강력한 사회 운동으로 연결될 수 있으며, 2008년 촛불 시위 사례가 해당하는 디지털 시대 시민의 특성은?", "options": ["디지털 미디어", "네트워크 개인주의", "미디어 보드", "네티켓"], "ans": 1, "exp": "네트워크 개인주의는 개인 중심으로 온라인 공동체를 형성하고 이것이 현실의 강력한 사회 운동으로 연결되는 특성이다."}, {"ch": "ch11", "text": "디지털 시민성의 기능에 해당하지 않는 것은?", "options": ["정보 자주성", "사회적 기본 가치 존중", "커뮤니케이션 능력", "정치 참여 능력"], "ans": 1, "exp": "사회적 기본 가치 존중은 디지털 시민성의 기능이 아니라 가치나 태도에 해당한다. 기능에는 정보 자주성, 커뮤니케이션 능력, 정치 참여 능력 등이 포함된다."}, {"ch": "ch11", "text": "디지털 시대의 사회 변화로 볼 수 있는 것은?", "options": ["사이버 공간을 통한 사회 참여가 축소되었다.", "편리한 정보 접근을 통한 집단 지성이 약화되었다.", "정보교류를 통한 심화된 민주주의가 약화되었다.", "현실 공간의 문화 권력 해체가 가능해졌다."], "ans": 3, "exp": "디지털 시대에는 일반인도 콘텐츠를 생산하고 문화에 참여할 수 있어 기존 문화 권력의 해체가 가능해졌다."}, {"ch": "ch11", "text": "디지털 시민성의 내용 중 \"기능\"에 해당하는 것은?", "options": ["커뮤니케이션 능력", "자기 이해와 관용", "사회적 기본 가치 존중", "위해 원리 준수와 신뢰"], "ans": 0, "exp": "디지털 시민성의 기능에는 커뮤니케이션 능력, 정보 자주성 등이 포함된다. 자기 이해와 관용, 사회적 기본 가치 존중 등은 가치·태도 영역이다."}, {"ch": "ch12", "text": "루빈(Rubin)이 도덕성을 약화시키는 사이버 공간의 기술적 특성으로 제시한 내용이 아닌 것은?", "options": ["속도", "프라이버시와 익명성", "커뮤니케이션", "최소 투자에 의한 최대 효과"], "ans": 2, "exp": "루빈이 제시한 도덕성 약화 기술적 특성은 속도, 프라이버시와 익명성, 최소 투자에 의한 최대 효과, 매체의 본질, 심미적 매료 등이다. 커뮤니케이션은 해당하지 않는다."}, {"ch": "ch12", "text": "추병완이 제시한 사이버 윤리의 내용 중 남에게 피해를 주지 않고 타인의 복지를 배려하는 것은?", "options": ["존중", "책임", "정의", "해악 금지"], "ans": 3, "exp": "해악 금지(비악성)는 타인에게 피해를 주지 않고 복지를 배려하는 원칙이다. 존중은 타인의 권리 존중, 책임은 자신의 행동에 대한 책임이다."}, {"ch": "ch12", "text": "길스터의 \"단순히 컴퓨터를 조작하는 기술이 아니라 생각을 관리하는 것\"이라는 설명에 해당하는 사이버 윤리교육은?", "options": ["처방적 교육", "예방적 교육", "인터넷 리터러시 교육", "네티켓 교육"], "ans": 2, "exp": "인터넷 리터러시 교육은 정보를 비판적으로 읽고 이해하며 창의적으로 생산할 수 있는 능력을 기르는 교육이다. 단순 기술 습득이 아니라 사고력을 강조한다."}, {"ch": "ch12", "text": "합리적 사람은 합리적 계획을 세우고 수정할 능력이 있다는 점에 근거하여 스피넬로가 제시한 정보 윤리의 원리는?", "options": ["선행", "악행 금지", "자율성 존중", "정의"], "ans": 2, "exp": "자율성 존중은 합리적 인간이 자신의 계획을 세우고 수정할 수 있는 능력을 인정하고 그 자율성을 존중하는 원리이다."}, {"ch": "ch12", "text": "인터넷을 비판적으로 이해하고, 창의적이고 건강하게 활용할 수 있는 능력을 함양시키는 것을 주요 목표로 하는 인터넷 윤리 교육은?", "options": ["인터넷 중독 치료 교육", "사이버 범죄 교화 교육", "인터넷 리터러시 교육", "네티켓 교육"], "ans": 2, "exp": "인터넷 리터러시 교육은 인터넷을 비판적으로 이해하고 창의적·건강하게 활용하는 능력 함양을 목표로 한다."}, {"ch": "ch12", "text": "사이버 윤리교육 중 인터넷 공간에서 지켜야 할 상식적인 예절 등을 주로 다루는 것은?", "options": ["네티켓 교육", "정보통신 윤리교육", "사이버 윤리교육", "인터넷 미디어 교육"], "ans": 0, "exp": "네티켓 교육은 인터넷 공간에서 지켜야 할 기본적인 예절과 에티켓을 다루는 교육이다."}, {"ch": "ch12", "text": "인터넷에서 서비스 유료화를 통해 접속 방법이나 정보에 대한 접속 수준을 제한하는 레식이 언급한 사이버 공간에서 인간의 행동 제약 방안은?", "options": ["법", "시장", "기술(암호)", "자율(규범)"], "ans": 1, "exp": "레식(Lessig)이 제시한 사이버 공간 행동 제약의 4가지 요소: 법, 시장, 기술(암호), 자율(규범). 서비스 유료화나 접속 제한은 시장 메커니즘을 통한 규제이다."}];

  const count=items.length;
  const div=document.createElement('div');
  div.className='toc-item';
  div.innerHTML=`<span class="toc-num">${String(i+1).padStart(2,'0')}</span><span class="toc-label">${ch.label}</span><span class="toc-meta">${count>0?count+'문항':''}</span>`;
  const btn=document.createElement('button');
  if(count>0){btn.className='toc-btn';btn.textContent='문제풀기 →';btn.addEventListener('click',()=>showQuiz(ch));}
  else{btn.className='toc-btn wip';btn.textContent='준비중';}
  div.appendChild(btn);tocList.appendChild(div);
});
function showToc(){document.getElementById('tocWrap').style.display='block';document.getElementById('quizWrap').style.display='none';window.scrollTo(0,0);}
function showQuiz(ch){document.getElementById('tocWrap').style.display='none';document.getElementById('quizWrap').style.display='block';document.getElementById('quizChTitle').textContent=ch.label;renderQuiz(ch.id);window.scrollTo(0,0);}
function renderQuiz(chId){
  const wrap=document.getElementById('quizContent');
  wrap.innerHTML='';
  const items=quizData.filter(q=>q.ch===chId);
  if(!items.length){wrap.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px 0;font-style:italic;">준비 중입니다.</p>';return;}
  items.forEach((q,qi)=>{
    const card=document.createElement('div');card.className='qcard';
    const num=document.createElement('div');num.className='q-num';num.textContent=`문제 ${qi+1}`;card.appendChild(num);
    const text=document.createElement('div');text.className='q-text';text.textContent=q.text;card.appendChild(text);
    const opts=document.createElement('div');opts.className='options';
    const expBox=document.createElement('div');expBox.className='exp-box';expBox.innerHTML=`<div class="exp-label">해설</div>${q.exp}`;
    const resetBtn=document.createElement('button');resetBtn.className='reset-btn';resetBtn.textContent='↺ 다시 풀기';resetBtn.style.display='none';
    let answered=false;
    q.options.forEach((opt,oi)=>{
      const btn=document.createElement('button');
      btn.className='opt-btn';
      btn.innerHTML=`<span class="opt-mark">${MARKS[oi]}</span><span>${opt}</span>`;
      btn.addEventListener('click',()=>{
        if(answered)return;answered=true;
        opts.querySelectorAll('.opt-btn').forEach((b,bi)=>{
          b.disabled=true;
          if(bi===q.ans){b.classList.add(bi===oi?'correct':'reveal');}
          else if(bi===oi){b.classList.add('wrong');}
        });
        expBox.classList.add('visible');resetBtn.style.display='inline-flex';
      });
      opts.appendChild(btn);
    });
    resetBtn.addEventListener('click',()=>{
      answered=false;
      opts.querySelectorAll('.opt-btn').forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong','reveal');});
      expBox.classList.remove('visible');resetBtn.style.display='none';
    });
    card.appendChild(opts);card.appendChild(expBox);card.appendChild(resetBtn);wrap.appendChild(card);
  });
}</script>
</body>
</html>
