<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>청소년리더십개발</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');

:root {
  --bg: #f7f4ef;
  --paper: #fffefb;
  --ink: #1c1a17;
  --muted: #7a7268;
  --line: #e3ddd4;
  --accent: #1a3258;
  --soft: #eaeff6;
  --radius: 14px;
  --shadow: 0 2px 16px rgba(28,26,23,.07);
  --correct: #2d6a4f;
  --correct-bg: #e8f5ee;
  --correct-line: #95d5b2;
  --wrong: #9b2335;
  --wrong-bg: #fdf0f0;
  --wrong-line: #e8a0a8;
  --exp-bg: #f0f4fa;
  --exp-line: #a8bed8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  min-height: 100vh;
}

header {
  background: var(--ink);
  color: #fff;
  padding: 22px 24px 18px;
  text-align: center;
}
.header-back {
  display: inline-block;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,.4);
  text-decoration: none;
  letter-spacing: .06em;
  transition: color .15s;
}
.header-back:hover { color: rgba(255,255,255,.8); }
header h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(18px, 3.5vw, 26px);
  letter-spacing: -.03em;
}

/* ── 목차 ── */
.toc-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 36px 16px 80px;
}
.toc-section-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--ink);
}
.toc-list { display: flex; flex-direction: column; gap: 8px; }
.toc-item {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow);
}
.toc-num {
  font-size: 13px;
  font-weight: 900;
  color: var(--muted);
  min-width: 24px;
}
.toc-label { flex: 1; font-size: 15px; font-weight: 700; word-break: keep-all; }
.toc-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.toc-btn {
  flex-shrink: 0;
  background: none;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  color: var(--accent);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.toc-btn:hover { background: var(--accent); color: #fff; }
.toc-btn.wip { border-color: var(--line); color: var(--muted); pointer-events: none; }

/* ── 문제 페이지 ── */
.quiz-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 16px 80px;
  display: none;
}
.quiz-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}
.quiz-back {
  background: none;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
}
.quiz-back:hover { border-color: var(--accent); color: var(--accent); }
.quiz-ch-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.03em;
  word-break: keep-all;
}

/* ── 문제 카드 ── */
.qcard {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 20px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.q-num {
  font-size: 11px;
  font-weight: 900;
  color: var(--muted);
  letter-spacing: .08em;
  margin-bottom: 8px;
}
.q-text {
  font-size: 15px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: keep-all;
  margin-bottom: 14px;
}

/* ── 선택지 버튼 ── */
.options { display: flex; flex-direction: column; gap: 7px; }
.opt-btn {
  width: 100%;
  text-align: left;
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  line-height: 1.6;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: border-color .15s, background .15s;
  word-break: keep-all;
}
.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
.opt-btn:disabled { cursor: default; }

.opt-mark {
  font-weight: 900;
  color: var(--muted);
  min-width: 20px;
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* 정답 */
.opt-btn.correct {
  background: var(--correct-bg);
  border-color: var(--correct-line);
  color: var(--correct);
}
.opt-btn.correct .opt-mark { color: var(--correct); }

/* 오답 */
.opt-btn.wrong {
  background: var(--wrong-bg);
  border-color: var(--wrong-line);
  color: var(--wrong);
}
.opt-btn.wrong .opt-mark { color: var(--wrong); }

/* 정답 강조 (선택 안 했을 때) */
.opt-btn.reveal {
  background: var(--correct-bg);
  border-color: var(--correct-line);
  color: var(--correct);
}
.opt-btn.reveal .opt-mark { color: var(--correct); }

/* ── 해설 박스 ── */
.exp-box {
  display: none;
  margin-top: 12px;
  padding: 12px 14px;
  background: var(--exp-bg);
  border-left: 3px solid var(--accent);
  border-radius: 0 10px 10px 0;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--ink);
  word-break: keep-all;
}
.exp-box.visible { display: block; }
.exp-label {
  font-size: 11px;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: .06em;
  margin-bottom: 4px;
}

/* 다시풀기 버튼 */
.reset-btn {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 13px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

footer {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

@media (max-width: 480px) {
  .toc-item { padding: 13px 14px; gap: 10px; }
  .toc-label { font-size: 14px; }
  .opt-btn { font-size: 13px; padding: 9px 12px; }
}
</style>
</head>
<body>

<header>
  <a class="header-back" href="index.html">← Study Hub</a>
  <h1>청소년리더십개발</h1>
</header>

<div class="toc-wrap" id="tocWrap">
  <div class="toc-section-title">목차</div>
  <div class="toc-list" id="tocList"></div>
</div>

<div class="quiz-wrap" id="quizWrap">
  <div class="quiz-header">
    <button class="quiz-back" onclick="showToc()">← 목차로</button>
    <div class="quiz-ch-title" id="quizChTitle"></div>
  </div>
  <div id="quizContent"></div>
</div>

<footer>청소년교육복지상담학과</footer>

<script>
const MARKS = ['①','②','③','④','⑤'];

const chapters = [{"id": "ch1", "label": "제1장 리더십의 의미"}, {"id": "ch2", "label": "제2장 청소년과 리더십"}, {"id": "ch3", "label": "제3장 리더십 특성이론"}, {"id": "ch4", "label": "제4장 리더십 행동이론"}, {"id": "ch5", "label": "제5장 리더십 상황이론"}, {"id": "ch6", "label": "제6장 현대 리더십 이슈"}, {"id": "ch7", "label": "제7장 자기인식"}, {"id": "ch8", "label": "제8장 스트레스 관리와 회복탄력성"}, {"id": "ch9", "label": "제9장 분석적 문제해결"}, {"id": "ch10", "label": "제10장 창의적 문제해결"}, {"id": "ch11", "label": "제11장 커뮤니케이션"}, {"id": "ch12", "label": "제12장 동기유발"}, {"id": "ch13", "label": "제13장 팀 빌딩"}, {"id": "ch14", "label": "제14장 갈등관리"}, {"id": "ch15", "label": "제15장 청소년 리더십 개발전략"}];
const quizData = [{"ch":"ch1","text":"다음 중 리더십에 대한 설명으로 가장 적절하지 않은 것은?","options":["리더십의 어원은 앵글로색슨의 고대어 '레단(ledan)'에서 유래되었다.","리더십은 다른 사람의 사고, 감정, 행동에 의미심장한 영향을 미치는 능력을 말한다.","합법적 권력을 가진 사람만이 리더십을 가질 수 있다.","지구상 가장 많이 관찰되었지만, 가장 덜 밝혀진 현상 중 하나이다."],"ans":2,"exp":"리더십은 합법적 권력 여부와 관계없이 누구나 가질 수 있다. 공식적 지위나 권력과 반드시 연결되지 않는다."},{"ch":"ch1","text":"다음 보기와 관련된 권력의 원천은 무엇인가?\n\n\"A님은 누구보다 알기 쉽게 일을 설명했으며, 유사한 일을 할 때도 적용할 수 있는 원칙들을 알려주셨어.\"","options":["합법적 권력(legitimate power)","보상 권력(reward power)","강제 권력(coercive power)","전문성 권력(expert power)"],"ans":3,"exp":"지식과 기술을 전달하고 원칙을 가르쳐주는 것은 전문적 지식·능력에서 비롯된 전문성 권력(expert power)이다."},{"ch":"ch1","text":"다음 중 리더십의 근원적 상태와 관련 없는 것은?","options":["본능적으로 안전을 지향함","주체적으로 행동할 수 있음","타인에게 관심을 기울임","외부에 개방적인 태도를 가짐"],"ans":0,"exp":"\"본능적으로 안전을 지향함\"은 리더십의 근원적 상태가 아니라 오히려 그것을 방해하는 요소에 해당한다."},{"ch":"ch2","text":"다음 중 청소년기 리더십 개발에 대한 설명으로 적절하지 않은 것은?","options":["리더십 기술은 청소년기에 두드러지게 발달한다.","모든 청소년들이 리더십에 대해 배울 수 있으며, 리더로서의 잠재력을 가지고 있다.","리더로서의 행동뿐만 아니라 리더가 되는 과정과 리더가 되는 것도 개발되어야 한다.","다양한 상황에서도 하나의 리더십 행동만 있으면 된다."],"ans":3,"exp":"효과적인 리더십은 상황에 따라 다양한 행동과 접근이 필요하다. 하나의 리더십 행동만으로는 다양한 상황에 대응할 수 없다."},{"ch":"ch2","text":"리더십 개발에 영향을 미치는 청소년의 발달적 특성 중 '이상주의'에 대한 설명으로 적절한 것은?","options":["적극적인 상상력과 이상을 꿈꾸는 것은 낭비적인 활동이 아니다.","직·간접적인 행동으로 이어지는 것은 아니다.","일반적으로 후기 청소년기까지 지속되다가 점차 강해진다.","부모로부터 분리된 정체성을 찾기 시작하며, 더 넓은 사회적 관점에서 변화를 만들려고 한다."],"ans":0,"exp":"청소년기 이상주의는 낭비가 아니라 리더십 개발의 중요한 토대이다. ②행동으로 이어질 수 있고, ③후기에 점차 약해지며, ④는 독립추구에 대한 설명이다."},{"ch":"ch2","text":"Leis와 Reinecke(2020)가 제시한 리더십 차원이 아닌 것은?","options":["자기 이끌기","다른 사람과 함께 이끌기","세상 변화시키기","스트레스 관리하기"],"ans":3,"exp":"Leis와 Reinecke(2020)의 리더십 차원은 자기 이끌기, 다른 사람과 함께 이끌기, 세상 변화시키기의 3가지이다."},{"ch":"ch3","text":"리더십 특성 이론과 관련된 진술 중 적절하지 않은 것은?","options":["리더는 태어나는 것이지 만들어지는 것이 아니다.","위인 이론(great man theory)과 관련 있다.","리더가 태어나는 것이라는 주장을 정당화할 만한 근거는 많지 않다.","리더십 특성을 분석하면, 리더십 성과를 충분히 예측할 수 있다."],"ans":3,"exp":"특성만으로 리더십 성과를 충분히 예측하기 어렵다는 것이 특성 이론의 주요 한계이다. 상황·맥락·행동 등 다양한 요소가 함께 작용한다."},{"ch":"ch3","text":"시간 강박, 경쟁성, 다면적 행동, 적대성의 특성에 해당하는 리더십 특성은?","options":["통제 위치","타입 A 성격","리더십의 근원적 상태","마키아벨리적 성격"],"ans":1,"exp":"시간 강박, 경쟁성, 다면적 행동(여러 일 동시 처리), 적대성은 타입 A 성격(Type A Personality)의 핵심 특성이다."},{"ch":"ch3","text":"리더십 성격 특성의 활용에 대한 진술로 적절한 것은?","options":["성격적 특성들은 일반적으로 서로 간의 관련성이 크다.","성격적 특성이 극단적으로 치우치면 리더십을 발휘하는데 도움이 된다.","성격적 특성 도구는 자기인식 및 자기개발에 활용될 수 있다.","리더십 성격 특성을 청소년의 진로의사결정에 적극적으로 사용해야 한다."],"ans":2,"exp":"성격 특성 도구(MBTI, Big 5 등)는 자기 자신을 이해하고 자기개발 방향을 설정하는 데 유용하게 활용된다."},{"ch":"ch4","text":"민주형과 권위형으로 분류하고 집단 성과와 만족도를 비교 분석한 초기 리더십 행동 연구는?","options":["오하이오 주립대학 연구","미시간 대학 연구","브레이크와 머튼의 관리격차 이론","레빈(Lewin) 등의 아이오와 대학 연구"],"ans":3,"exp":"레빈(Lewin) 등의 아이오와 대학 연구는 민주형·권위형·방임형으로 분류하여 집단 성과와 만족도를 비교 분석한 초기 연구이다."},{"ch":"ch4","text":"오하이오 주립대학의 리더십 연구에서 제시한 두 가지 핵심 행동 차원은?","options":["구조주도(initiating structure) - 배려(consideration)","생산중심(production-centered) - 종업원중심(employee-centered)","관계지향(relationship-oriented) - 과업지향(task-oriented)","혁신지향(innovation-oriented) - 유지지향(maintenance-oriented)"],"ans":0,"exp":"오하이오 주립대학 연구는 구조주도(과업 구조화)와 배려(구성원 관계)의 두 차원을 제시하였다. ②는 미시간 대학 연구의 차원이다."},{"ch":"ch4","text":"블레이크와 머튼의 관리격차 이론에서 생산과 인간에 대한 관심이 모두 높은 이상적 리더 유형(9,9형)은?","options":["인기형(Country Club Management)","과업형(Authority-Compliance Management)","팀형(Team Management)","타협형(Middle-of-the-Road Management)"],"ans":2,"exp":"9,9형은 팀형(Team Management)이다. 인기형은 인간 중심(1,9), 과업형은 생산 중심(9,1), 타협형은 중간형(5,5)이다."},{"ch":"ch5","text":"피들러(Fiedler)의 상황적합 이론에서 리더의 성향을 측정하는 핵심 도구는?","options":["권력 거리 척도","LPC(Least Preferred Coworker) 척도","구조주도 척도","통제 위치 척도"],"ans":1,"exp":"LPC 척도는 리더가 가장 함께 일하기 싫어하는 동료를 평가하게 함으로써 리더의 과업지향성 또는 관계지향성을 측정한다."},{"ch":"ch5","text":"허시와 블랜차드의 상황적 리더십 이론에서 리더십 유형을 결정하는 가장 중요한 상황 변수는?","options":["구성원의 성숙도(역량과 의지)","직위 권력의 크기","과업 구조의 명확성","조직의 문화와 환경"],"ans":0,"exp":"허시와 블랜차드의 핵심 상황 변수는 구성원의 성숙도로, 역량(능력)과 의지(동기)의 조합에 따라 리더십 유형을 달리해야 한다."},{"ch":"ch5","text":"구성원의 능력은 낮으나 동기가 높은 발달 단계에 가장 적합한 리더십 행동 유형은?","options":["지시형(Directing)","지도형/코칭형(Coaching)","지원형(Supporting)","위임형(Delegating)"],"ans":0,"exp":"능력은 낮지만 의지가 높은 D1 단계에는 구체적인 지시와 방향 제시가 필요한 지시형(Directing)이 가장 적합하다."},{"ch":"ch6","text":"부하직원의 고차원적 욕구를 자극하여 가치관과 태도의 변화를 이끌어내는 리더십은?","options":["거래적 리더십","변혁적 리더십","합법적 리더십","서번트 리더십"],"ans":1,"exp":"변혁적 리더십은 구성원의 고차원 욕구를 자극하고 가치관과 태도 변화를 통해 조직 변혁을 추구한다."},{"ch":"ch6","text":"변혁적 리더십의 4가지 핵심 요인(4Is)에 해당하지 않는 것은?","options":["카리스마/이상적인 영향력(Idealized Influence)","영감적 동기유발(Inspirational Motivation)","지적 자극(Intellectual Stimulation)","예외적 관리(Management by Exception)"],"ans":3,"exp":"변혁적 리더십의 4Is는 이상적 영향력·영감적 동기유발·지적 자극·개별적 배려이다. 예외적 관리는 거래적 리더십의 구성요소이다."},{"ch":"ch6","text":"자신의 가치관·신념·감정을 투명하게 하고 행동과 일치시키며 진실한 관계를 형성하는 리더십은?","options":["카리스마적 리더십","진정성 리더십(Authentic Leadership)","감성 리더십","거래적 리더십"],"ans":1,"exp":"진정성 리더십은 자기인식, 균형 잡힌 정보처리, 내면화된 도덕관, 관계적 투명성의 4가지 핵심 요소로 구성된다."},{"ch":"ch7","text":"자기인식(Self-awareness)에 대한 설명으로 가장 적절하지 않은 것은?","options":["자신의 성격, 가치관, 능력, 감정 등을 명확히 이해하는 과정이다.","내부적·외부적 자기인식을 모두 포함한다.","자기인식이 높은 리더는 자신의 위선이나 한계를 숨기는 데 능숙하다.","리더십 개발의 가장 첫 번째 단계이자 핵심적인 토대이다."],"ans":2,"exp":"자기인식이 높은 리더는 한계와 위선을 숨기는 것이 아니라 오히려 솔직하게 인정하고 투명하게 드러낸다."},{"ch":"ch7","text":"개인이 정보를 처리하고 문제를 해결하는 선호적인 방식을 의미하는 자기인식의 차원은?","options":["개인 가치","인지 스타일(Cognitive style)","감성 지능","변화 지향성"],"ans":1,"exp":"인지 스타일(Cognitive style)은 개인이 정보를 수집하고 처리하며 문제를 해결하는 방식의 선호 패턴이다."},{"ch":"ch7","text":"자기인식 향상 과정에서 심리적 저항을 극복하기 위한 방법으로 적절한 것은?","options":["비판적 피드백 신호를 무시한다.","Comfort zone(안전지대)을 견고하게 유지한다.","신뢰할 수 있는 동료나 지도자로부터 객관적인 피드백을 구하고 성찰한다.","가치관과 행동의 불일치를 합리화한다."],"ans":2,"exp":"신뢰할 수 있는 타인으로부터 솔직한 피드백을 구하고 성찰하는 것이 자기인식 향상의 가장 효과적인 방법이다."},{"ch":"ch8","text":"유해한 스트레스(Distress)와 구별되며, 적당한 긴장감으로 생산성과 동기를 향상시키는 유익한 스트레스는?","options":["만성 스트레스","예상 스트레스","유스트레스(Eustress)","대면 스트레스"],"ans":2,"exp":"유스트레스(Eustress)는 한스 셀리에(Hans Selye)가 제시한 긍정적이고 유익한 스트레스로, 동기와 수행 능력을 향상시킨다."},{"ch":"ch8","text":"회복탄력성의 핵심 구성 영역 중 역경 상황에서 자신의 감정을 조절하고 충동을 통제하는 능력은?","options":["자기조절 능력","대인관계 능력","긍정성","인지적 유연성"],"ans":0,"exp":"자기조절 능력은 회복탄력성의 핵심 요소로, 역경 상황에서 감정 조절과 충동 통제 능력을 포함한다."},{"ch":"ch8","text":"중요도와 시급성을 기준으로 가장 먼저 처리해야 할 과업의 영역은?","options":["중요하지만 시급하지 않은 일","중요하고 시급한 일","중요하지 않으나 시급한 일","중요하지도 시급하지도 않은 일"],"ans":1,"exp":"아이젠하워 매트릭스에서 중요하고 시급한 일은 즉시 처리해야 할 최우선 과업이다."},{"ch":"ch9","text":"분석적 문제해결의 4단계 과정을 순서대로 올바르게 나열한 것은?","options":["대안모색 → 문제정의 → 대안평가 및 선택 → 해결책 실행","문제정의 → 대안모색 → 대안평가 및 선택 → 해결책 실행 및 추후 점검","문제정의 → 대안평가 → 대안선택 → 해결책 실행","대안모색 → 대안평가 → 문제정의 → 해결책 실행"],"ans":1,"exp":"분석적 문제해결의 4단계: 문제정의 → 대안모색 → 대안평가 및 선택 → 해결책 실행 및 추후 점검."},{"ch":"ch9","text":"문제정의 단계에서 눈에 보이는 현상이나 징후만을 문제로 파악하는 오류는?","options":["증상과 원인의 혼동","대안평가의 조급성","정보의 과부하","자발적 실패 거부"],"ans":0,"exp":"증상과 원인의 혼동은 표면에 나타나는 현상(증상)을 문제 자체로 착각하여 진짜 원인을 놓치는 오류이다."},{"ch":"ch9","text":"시제품을 빠르게 만들어 자발적 실패를 통해 학습하는 Rapid prototyping의 장점은?","options":["실패 비용을 극대화한다.","완벽한 대안이 나올 때까지 실행을 미루게 한다.","불확실성을 빠르게 감소시키고 실질적인 해결책으로 수정 보완을 가능하게 한다.","집단적 사고의 오류를 심화시킨다."],"ans":2,"exp":"Rapid prototyping은 불확실성을 빠르게 감소시키고 실질적 수정이 가능하다는 장점이 있다."},{"ch":"ch10","text":"과거의 성공 방식에 지나치게 몰입하여 새로운 대안을 보지 못하는 개념적 장벽은?","options":["일관성(Constancy)","몰입(Commitment)","압축(Compression)","안주(Complacency)"],"ans":1,"exp":"몰입(Commitment)은 과거의 성공 경험이나 특정 프레임에 집착하여 새로운 대안을 차단하는 개념적 장벽이다."},{"ch":"ch10","text":"창의적 사고 4단계(Wallas, 1926) 중 의식적 노력을 멈추고 무의식 속에서 아이디어가 성숙되는 단계는?","options":["준비 단계(Preparation)","배양 단계(Incubation)","조명 단계(Illumination)","검증 단계(Verification)"],"ans":1,"exp":"배양(Incubation) 단계는 의식적 노력을 멈추고 무의식에서 아이디어가 익어가는 단계이다."},{"ch":"ch10","text":"문제 정의를 확장하고 향상시키기 위한 방법으로 적절하지 않은 것은?","options":["문제를 다른 말로 다르게 표현해 본다.","'왜?'라는 질문을 반복하여 근본적인 목적을 찾는다.","처음 생각한 문제 정의를 고수하고 신속하게 결론을 내린다.","복잡한 문제를 더 작고 다루기 쉬운 부분으로 쪼개어 본다."],"ans":2,"exp":"처음 생각한 문제 정의를 고수하고 신속하게 결론 내리는 것은 창의적 문제해결을 방해한다."},{"ch":"ch11","text":"대인관계를 손상시키지 않으면서 부정적인 피드백을 전달하도록 돕는 커뮤니케이션 원칙은?","options":["전략적 커뮤니케이션","지원적 커뮤니케이션(Supportive communication)","설득적 커뮤니케이션","비언어적 커뮤니케이션"],"ans":1,"exp":"지원적 커뮤니케이션은 관계를 손상시키지 않으면서 부정적 피드백을 전달하는 것을 목표로 한다."},{"ch":"ch11","text":"상대방의 인격보다 구체적인 행동이나 사건에 초점을 맞추어 말하는 지원적 커뮤니케이션 원칙은?","options":["일치하는 커뮤니케이션","기술적인(Descriptive) 커뮤니케이션","문제 중심의 커뮤니케이션","개인을 인정하는 커뮤니케이션"],"ans":1,"exp":"기술적인 커뮤니케이션은 \"너는 왜 이렇게 게으르니(평가)\" 대신 \"어제 보고서 제출이 늦었어(행동 기술)\"처럼 구체적 행동에 초점을 맞춘다."},{"ch":"ch11","text":"상대방이 전달한 메시지의 본질과 감정을 거울처럼 다시 비추어 주는 경청 방식은?","options":["반사적 경청(Reflective listening)","자문적 경청","편파적 경청","수동적 경청"],"ans":0,"exp":"반사적 경청(Reflective listening)은 상대방의 말과 감정을 거울처럼 반영해 주는 방식으로, 공감적 이해와 수용을 전달한다."},{"ch":"ch12","text":"매슬로우의 욕구위계론에서 리더십의 근원적 상태와 가장 밀접하게 연결되는 최고차원의 욕구는?","options":["생리적 욕구","존경의 욕구","사회적 욕구","자기실현의 욕구"],"ans":3,"exp":"자기실현의 욕구는 자신의 잠재력을 최대한 발휘하고자 하는 욕구로, 리더십의 근원적 상태와 가장 밀접하게 연결된다."},{"ch":"ch12","text":"브룸(Vroom)의 기대이론에서 동기유발을 결정하는 3가지 핵심 요인은?","options":["기대감(Expectancy) - 수단성(Instrumentality) - 유의성(Valence)","성취구동 - 권력구동 - 친교구동","존재욕구 - 관계욕구 - 성장욕구","위생요인 - 동기요인"],"ans":0,"exp":"브룸의 기대이론: 동기(M) = 기대감(E) × 수단성(I) × 유의성(V). 기대감은 노력→성과, 수단성은 성과→보상, 유의성은 보상의 매력도이다."},{"ch":"ch12","text":"로크(Locke)의 목표설정이론에서 동기를 가장 강하게 유발하는 목표의 특성은?","options":["\"최선을 다하라\"와 같은 모호한 목표","실현 가능성이 전혀 없는 터무니없는 목표","구체적이고 적절한 난이도가 있는 도전적 목표","난이도가 매우 낮아 쉽게 달성할 수 있는 목표"],"ans":2,"exp":"구체적(Specific)이고 적절히 도전적인(Challenging) 목표가 동기를 가장 강하게 유발한다. SMART 목표 설정의 이론적 근거이다."},{"ch":"ch13","text":"터크맨의 팀 발달 단계 중 규칙이나 역할 분담 과정에서 갈등과 대립이 표출되는 단계는?","options":["형성(Forming) 단계","혼란(Storming) 단계","규범(Norming) 단계","수행(Performing) 단계"],"ans":1,"exp":"터크맨의 팀 발달 5단계: 형성→혼란→규범→수행→해체. 혼란(Storming) 단계에서 갈등과 대립이 표출된다."},{"ch":"ch13","text":"팀의 규범(Norming) 단계에서 리더가 집중해야 할 역할로 가장 적절한 것은?","options":["구성원들 간의 갈등을 중재하고 신뢰 문화를 형성한다.","팀의 목적과 방향성을 명확히 제시하고 소개한다.","리더십 권한을 완전히 위임하여 독자적으로 일하게 한다.","팀의 생산성 극대화를 위해 과업 통제만을 강화한다."],"ans":0,"exp":"규범(Norming) 단계에서 리더는 갈등을 중재하고 신뢰 문화를 형성하는 역할에 집중해야 한다."},{"ch":"ch13","text":"개인이 집단에 참여할 때 혼자 일할 때보다 노력을 덜 기울여 성과가 떨어지는 현상은?","options":["집단 사고","사회적 태만(Social loafing)","기러기 효과","시너지 효과"],"ans":1,"exp":"사회적 태만(Social loafing, 링겔만 효과)은 집단에서 개인의 기여가 드러나지 않을 때 노력을 덜 기울이는 현상이다."},{"ch":"ch14","text":"독단성은 낮고 협조성은 높은 갈등 대처 방식은?","options":["회피형(Avoiding)","수용형/양보형(Accommodating)","경쟁형(Competing)","타협형(Compromising)"],"ans":1,"exp":"수용형(Accommodating)은 독단성 낮음 + 협조성 높음의 조합으로, 상대방의 요구를 우선시하고 자신의 이익을 양보한다."},{"ch":"ch14","text":"가용 자원의 한계나 조직 구조적 문제, 역할의 모호성으로 인해 발생하는 갈등 유형은?","options":["가치관 갈등","관계 갈등","구조적 원인에 의한 갈등","성격 갈등"],"ans":2,"exp":"구조적 원인에 의한 갈등은 자원 부족, 조직 구조의 문제, 역할 모호성 등 환경적·구조적 요인에서 비롯된다."},{"ch":"ch14","text":"협력형(Collaborating) 갈등 해결 방식의 궁극적인 목표는?","options":["양측의 이익을 적당히 절반씩 양보하여 봉합한다.","나의 논리로 상대를 설득하여 승리한다.","양측의 근본적인 욕구를 모두 충족시키는 윈-윈(Win-Win) 해결책을 찾는다.","갈등 상황을 회피하여 자연스럽게 소멸되도록 기다린다."],"ans":2,"exp":"협력형(Collaborating)은 독단성 높음 + 협조성 높음의 조합으로, 양측의 근본적 욕구를 모두 충족시키는 Win-Win 해결책을 추구한다."},{"ch":"ch15","text":"실제 상황과 유사한 가상 환경에서 의사결정과 문제해결을 체험하게 하는 프로그램은?","options":["토론 프로그램","시뮬레이션 프로그램","가치 경매 프로그램","라운드 로빈"],"ans":1,"exp":"시뮬레이션 프로그램은 실제와 유사한 가상 환경에서 직접 의사결정과 문제해결을 경험하게 하는 체험 학습의 대표적 형태이다."},{"ch":"ch15","text":"청소년이 스스로 주도성을 갖고 성장할 수 있도록 돕는 지도자 원칙은?","options":["지도자가 모든 것을 결정하고 지시한다.","청소년이 할 수 있는 것은 청소년이 해야 한다.","실패할 가능성이 있는 활동은 원천 차단한다.","완벽한 결과물만을 요구한다."],"ans":1,"exp":"청소년이 스스로 할 수 있는 것은 직접 하게 하는 것이 자기주도성과 역량 개발을 위한 핵심 원칙이다."},{"ch":"ch15","text":"청소년 지도자가 청소년과의 관계에서 건강한 심리적 거리를 유지하기 위해 설정해야 하는 원칙은?","options":["기대치 설정","한계 및 경계 설정","본보기 보이기","무조건적 수용"],"ans":1,"exp":"한계 및 경계 설정(Limit & Boundary setting)은 과도한 친밀감이나 의존을 방지하고 전문적 관계를 유지하기 위한 원칙이다."},{"ch":"ch1","text":"리더십(Leadership)의 어원적 의미에 대한 설명으로 가장 적절하지 않은 것은?","options":["앵글로색슨의 고대어 '레단(ledan)'에서 유래되었다.","'가다(to go)'라는 뜻을 내포하고 있다.","좋은 결과를 얻기 위해 목표를 세워 나아가는 것을 의미한다.","어원적으로 리더는 '권력을 행사하여 통제하는 자'라는 의미가 강하다."],"ans":3,"exp":"리더십의 어원 '레단(ledan)'은 '앞서 가다', '이끌다'의 의미를 가지며, 권력 행사나 통제와는 거리가 멀다."},{"ch":"ch1","text":"하워드 가드너(Gardner, 1995)가 분류한 리더의 유형 중 '창의성'을 발휘하여 많은 사람들의 삶에 심대한 영향을 미치는 리더를 무엇이라 하는가?","options":["직접적인 리더","간접적인 리더","변혁적 리더","서번트 리더"],"ans":1,"exp":"가드너는 리더를 직접적인 리더(직접 사람을 이끄는)와 간접적인 리더(창의적 작업을 통해 영향을 미치는)로 구분하였다. 창의성을 통해 간접적으로 영향을 미치는 것은 간접적인 리더이다."},{"ch":"ch1","text":"프렌치와 라벤(French & Raven)이 제시한 권력의 원천 중 주위로부터 존경이나 감탄, 애정을 받음으로써 타인들에게 영향을 미치는 능력은?","options":["합법적 권력(legitimate power)","보상 권력(reward power)","준거 권력(referent power)","전문성 권력(expert power)"],"ans":2,"exp":"준거 권력(referent power)은 타인이 리더를 동일시하거나 존경·감탄·애정을 느낄 때 발생하는 권력이다."},{"ch":"ch1","text":"퀸(Quinn)이 제시한 리더십 상태 중 '일반적인 상태(normal state)'의 특징으로 옳은 것은?","options":["이타적이며 공동선에 관심을 둔다.","가치와 행동의 일치를 추구한다.","본능적으로 안전지대에 머무르며 변화의 신호를 무시한다.","피드백에 열린 사고로 반응한다."],"ans":2,"exp":"일반적인 상태(normal state)는 자기보호적이고 편안한 현상 유지를 추구하며, 변화의 신호를 무시하는 경향이 있다."},{"ch":"ch1","text":"다음 중 리더십의 '근원적 상태(fundamental state)'로 옮겨가기 위한 행동과 가장 거리가 먼 것은?","options":["전체를 위해 용기 있게 진실을 말할 때","자신의 이익을 위해 관계 속에서 침묵할 때","작은 것이지만 상대를 존중하고 경청할 때","더 큰 목적과 이상을 설정하고 신념을 갖고 몰입할 때"],"ans":1,"exp":"자신의 이익을 위해 침묵하는 것은 근원적 상태가 아닌 일반적 상태에 해당한다. 근원적 상태는 결과 중심, 내면 지향, 타인 중심, 외부 개방이 핵심이다."},{"ch":"ch2","text":"청소년기 리더십 개발에 대한 설명으로 옳지 않은 것은?","options":["효과적인 리더십 발휘를 위한 중요한 기술은 청소년기에 두드러지게 발달한다.","학업 성적이 뛰어난 청소년들만 리더십을 가질 수 있다는 본질주의적 사고는 지양해야 한다.","모든 청소년은 리더십에 대해 배울 수 있으며 리더가 될 잠재력이 있다.","청소년 리더십 성과는 고정되어 있어 초기 청소년기에 완벽히 예측 가능하다."],"ans":3,"exp":"리더십은 경험과 학습을 통해 계속 발달하며, 초기 청소년기에 완벽히 예측할 수 없다. 리더십은 가변적이고 개발 가능한 역량이다."},{"ch":"ch2","text":"청소년 리더십 개발에 영향을 미치는 청소년기의 발달적 특징 중 다음 설명에 해당하는 것은?\n\n추상적 추론을 통해 사회문제에 대한 해결책을 구상하며, 불완전한 현실이나 기존 규범에 반항하기도 하는 특성","options":["독립 추구","정체성 형성","이상주의(Idealism)","근면성 발달"],"ans":2,"exp":"이상주의(Idealism)는 추상적 추론 능력의 발달과 함께 현실의 불완전함에 반응하고 더 나은 세계를 꿈꾸는 청소년기의 발달적 특성이다."},{"ch":"ch2","text":"에릭슨(Erikson)의 사회심리적 발달단계 중 청소년기(12~18세)에 직면하는 중심 위기는 무엇인가?","options":["자율성 대 수치심과 의심","주도성 대 죄의식","근면성 대 열등감","정체성 대 혼돈(identity vs. role confusion)"],"ans":3,"exp":"에릭슨의 5단계, 청소년기(12~18세)의 중심 위기는 정체성 대 역할 혼돈이다. 이 시기에 '나는 누구인가'에 대한 탐색이 핵심이다."},{"ch":"ch2","text":"Leis & Reinecke(2020)가 제시한 사회·정서적 리더십 차원 중 자기인식, 책임감, 회복탄력성, 진실함을 강조하는 차원은?","options":["자기 이끌기(Leading Self)","다른 사람과 함께 이끌기(Leading with Other)","세상 변화시키기(Changing Your World)","스트레스 관리하기"],"ans":0,"exp":"자기 이끌기(Leading Self) 차원은 자기인식, 책임감, 회복탄력성, 진실함 등 내면적 리더십 역량을 강조한다."},{"ch":"ch2","text":"van Linden & Fertman(1998)이 제시한 청소년 리더십 개발 단계 중 다음 대화에 해당하는 단계는?\n\n\"반드시 거대한 일일 필요는 없어. 내가 처한 상황에서 내가 할 수 있는 일부터 한 단계 더 나아갈 거야.\"","options":["1단계: 인식","2단계: 상호작용","3단계: 숙련","4단계: 통합"],"ans":2,"exp":"숙련(3단계)은 자신의 역량과 상황을 인식하고 점진적으로 리더십 행동을 확장해나가는 단계이다."},{"ch":"ch3","text":"전통적 리더십 연구 중 \"리더는 태어나는 것이지 만들어지는 것이 아니다\"라는 전제하에 리더와 구성원을 구분하는 타고난 자질을 확인하는 데 초점을 맞춘 이론은?","options":["상황 이론","행동 이론","특성 이론(위인 이론)","거래적 리더십 이론"],"ans":2,"exp":"특성 이론(위인 이론, Great Man Theory)은 리더는 타고나는 것이라는 전제 아래 리더를 구분하는 천부적 자질을 탐구한다."},{"ch":"ch3","text":"리더십 특성 이론의 연구 결과에 대한 설명으로 가장 적절한 것은?","options":["신체적 특징이나 지적 능력이 뛰어나면 어떤 상황에서나 성공적인 리더가 됨이 완전히 증명되었다.","단순한 특성 분석만으로 리더십 효과를 완벽하게 설명하거나 예측할 수는 없다.","성격은 리더의 행동 범위를 전혀 제한하지 못하므로 고려할 필요가 없다.","최근 견해에 따르면 천부적인 재능만 있으면 경험이나 올바른 선택 없이도 리더십이 꽃을 피운다."],"ans":1,"exp":"특성 이론의 주요 한계는 특성만으로는 리더십 효과를 완전히 예측하기 어렵다는 점이다. 상황, 행동, 관계 등 다양한 요인이 함께 작용한다."},{"ch":"ch3","text":"개인이 환경과 외부 사건에 대해 얼마만큼 통제하고 있다고 느끼는지를 뜻하는 '통제 위치(Locus of Control)' 중 '내적 통제 위치'를 가진 리더의 특징은?","options":["인생에 대한 통제력을 가지고 있지 않다고 인식하며 수동적으로 반응한다.","살아가면서 일어나는 사건들의 원인을 운이나 타인의 영향력으로 간주한다.","리더로서 다른 사람을 대할 때 강압적인 권력을 사용할 가능성이 매우 크다.","자신의 주변에서 일어나는 사건들이 노력과 행동의 결과라고 믿으며 보다 능동적이다."],"ans":3,"exp":"내적 통제 위치(Internal Locus of Control)를 가진 사람은 자신의 노력과 행동이 결과를 만든다고 믿으며, 더 능동적이고 주도적으로 행동한다."},{"ch":"ch3","text":"성격 유형 중 '시간 강박', '경쟁성', '다면적 행동', '적대성'을 핵심 특징으로 하며, 높은 목표를 설정하고 매우 열심히 일하지만 권한 위임을 잘 하지 못하는 유형은?","options":["타입 A 성격","타입 B 성격","마키아벨리적 성격","내재론적 성격"],"ans":0,"exp":"타입 A 성격(Type A Personality)은 시간 강박, 경쟁성, 다면적 행동, 적대성이 특징이며, 성과 지향적이나 위임 능력이 부족하다."},{"ch":"ch3","text":"리더십 성격 특성 도구를 청소년 리더십 개발 현장에서 활용할 때의 올바른 태도로 가장 적절한 것은?","options":["성격적 특성 중 특정 성향이 극단적으로 치우칠수록 리더십 발휘에 유리하다.","성격 측정 도구는 청소년의 진로 의사결정을 최종적으로 제한하는 도구로 적극 사용해야 한다.","성격 특성은 자기인식 및 자신의 강·약점을 이해하는 자기개발의 도구로 활용하는 것이 바람직하다.","성격은 한 개인의 행동을 전적으로 결정하므로 훈련이나 연습으로 극복할 수 없다."],"ans":2,"exp":"성격 특성 도구는 자기인식과 자기개발 도구로 활용하는 것이 바람직하다. 진로를 제한하거나 극단적 성향을 조장하는 용도로 사용해서는 안 된다."},{"ch":"ch4","text":"리더십 행동 이론에 대한 설명으로 가장 적절하지 않은 것은?","options":["리더가 어떤 특성을 '가지고 있는가'보다 어떤 행동을 '하는가'에 초점을 맞춘다.","관찰 가능하고 측정 가능한 리더의 구체적 행위를 연구 대상으로 삼는다.","리더십은 타고나는 것이 아니며 교육과 훈련을 통해 개발될 수 있다는 유용성을 시사한다.","어떤 상황에서나 완벽하게 통하는 단 하나의 절대적인 리더십 행동 유형이 존재함을 증명했다."],"ans":3,"exp":"행동 이론의 한계 중 하나는 '가장 좋은 하나의 리더십 행동'을 발견하지 못했다는 점이다. 상황에 따라 효과적인 행동 유형이 달라진다."},{"ch":"ch4","text":"리더십 행동 유형 중 구성원들을 의사결정 과정에 참여시키고 양방향 의사소통을 중시하며, 구성원의 만족도와 몰입도를 높이는 유형은?","options":["권위형 리더십","민주형 리더십","과업 중심 리더십","독재형 리더십"],"ans":1,"exp":"민주형 리더십은 구성원의 의사결정 참여와 양방향 소통을 강조하며, 구성원 만족도와 내재적 몰입을 높인다."},{"ch":"ch4","text":"리더의 행동을 '인간 중심 행동(고려)'과 '과업 중심 행동(구조주도)'의 두 가지 차원으로 나누어 독립적인 축으로 분석한 대표적인 연구 기관은?","options":["오하이오 주립대학교(Ohio State University)","하버드 대학교(Harvard University)","미시간 대학교(University of Michigan)","스탠퍼드 대학교(Stanford University)"],"ans":0,"exp":"오하이오 주립대학교 연구는 구조주도(initiating structure)와 배려(consideration)를 독립적인 두 축으로 제시하였다."},{"ch":"ch4","text":"과업 중심 및 인간 중심 행동 외에, 급변하는 환경 속에서 비전을 제시하고 혁신을 장려하며 새로운 아이디어를 탐색하는 리더의 행동 유형을 무엇이라 하는가?","options":["전통적 행동","보수적 행동","변화 지향적 행동","관계 유지적 행동"],"ans":2,"exp":"변화 지향적 행동은 환경 변화에 적응하고 비전을 제시하며 혁신을 장려하는 행동으로, 과업·인간 중심 행동을 보완하는 세 번째 차원이다."},{"ch":"ch4","text":"행동 이론을 청소년 리더십 개발에 적용할 때 고려해야 할 사항으로 옳은 것은?","options":["청소년들에게 특정한 하나의 행동 유형만을 강요하는 것이 효율적이다.","청소년들이 상황에 맞춰 과업 중심 행동과 인간 중심 행동을 균형 있게 발휘할 수 있도록 다차원적 행동 레파토리를 기르게 돕는다.","청소년기에는 인지적 지식 습득이 우선이므로 실제 행동 관찰이나 실습은 제외해야 한다.","Google 리더의 '산소 같은 행동'에서 보듯, 리더는 지시와 통제 위주의 행동을 우선시해야 한다."],"ans":1,"exp":"다양한 상황에 맞게 과업 중심과 인간 중심 행동을 유연하게 활용하는 다차원적 역량을 기르는 것이 핵심이다."},{"ch":"ch4","text":"맥그리거(McGregor)의 X·Y 이론 중 'Y이론'적 관점을 가진 청소년 지도자의 행동 특성으로 가장 적절한 것은?","options":["청소년은 본질적으로 일하기를 싫어하므로 강제와 통제를 해야 한다고 믿는다.","청소년에게 책임감을 부여하고 자율성을 주면 스스로 목표를 위해 헌신할 것이라 신뢰한다.","보상과 처벌이라는 외재적 동기만을 통해서 청소년을 움직이려고 한다.","청소년은 변화를 거부하며 지시받기를 선호한다고 가정한다."],"ans":1,"exp":"Y이론은 인간은 자발적으로 일하고 책임을 지려 하며, 자율성이 주어지면 스스로 목표를 달성한다는 긍정적 인간관이다."},{"ch":"ch4","text":"블레이크와 머튼(Blake & Mouton)의 관리격자 이론에서 '생산(과업)에 대한 관심'은 매우 낮으나 '인간에 대한 관심'은 극도로 높아, 구성원 간의 친밀한 관계와 편안한 조직 분위기만을 형성하는 데 치중하는 리더십 유형은?","options":["컨트리클럽형(Country Club, 1,9형)","과업형(Authority-Compliance, 9,1형)","무기력형(Impoverished, 1,1형)","팀형(Team Management, 9,9형)"],"ans":0,"exp":"컨트리클럽형(1,9형)은 인간 관계에만 치중하고 생산성은 낮은 유형이다. 과업형(9,1)은 그 반대이고, 무기력형(1,1)은 둘 다 낮다."},{"ch":"ch4","text":"관리격자 이론에서 가장 이상적인 리더십 유형으로 보며, 과업과 인간 모두에 높은 관심을 쏟아 구성원의 참여와 신뢰를 통해 목표를 달성하는 유형은?","options":["중간형(Middle-of-the-Road, 5,5형)","컨트리클럽형(1,9형)","팀형(Team Management, 9,9형)","과업형(9,1형)"],"ans":2,"exp":"팀형(9,9형)은 생산에 대한 관심과 인간에 대한 관심이 모두 최고 수준으로, 구성원의 참여와 신뢰를 통해 성과를 창출하는 이상적 유형이다."},{"ch":"ch4","text":"강의록에서 소개된 Google의 뛰어난 리더들이 보이는 '산소 같은 행동'의 구체적 지침으로 가장 적절하지 않은 것은?","options":["좋은 코치가 된다.","마이크로매니지먼트(세세한 참견)를 하지 않고 팀원에게 권한을 위임한다.","생산적이고 결과 지향적인 태도를 유지한다.","리더 개인의 경력 관리를 위해 팀원들의 학업이나 소통 지원은 최소화한다."],"ans":3,"exp":"Google의 산소 같은 행동은 코칭, 위임, 팀원 성장 지원, 결과 지향 등을 포함한다. 개인 경력을 위해 팀원 지원을 최소화하는 것은 정반대이다."},{"ch":"ch5","text":"피들러(Fiedler)의 상황적합 이론에서 리더십 스타일을 측정하기 위해 사용한 척도와, 리더십 효과성을 결정하기 위해 제시한 세 가지 상황 호의성 변수는?","options":["LPC(가장 싫어하는 동료) 척도 / 리더-구성원 관계, 과업 구조, 직위 권력","MBTI 척도 / 구성원 성숙도, 기술 수준, 조직 문화","내적 통제 척도 / 시간적 압박, 환경 불확실성, 구성원 태도","자아정체감 척도 / 집단 규모, 의사결정 속도, 리더의 경력"],"ans":0,"exp":"피들러는 LPC 척도로 리더 성향을 측정하고, 상황 호의성은 리더-구성원 관계, 과업 구조, 직위 권력의 세 변수로 결정된다고 보았다."},{"ch":"ch5","text":"브룸과 예튼(Vroom & Yetton)의 의사결정 상황이론(규범적 모형)에 대한 설명으로 옳은 것은?","options":["리더는 상황에 상관없이 무조건 독단적으로 의사결정을 내려야 한다.","의사결정의 질과 구성원의 수용성을 고려하여, 리더가 독단적 결정부터 집단 의사결정까지 적절한 참여 수준을 선택하도록 지침을 제공한다.","구성원의 참여가 많아질수록 의사결정의 질은 무조건 떨어진다고 가정한다.","리더의 성격은 고정되어 있으므로 상황에 맞게 의사결정 방식을 바꿀 수 없다고 본다."],"ans":1,"exp":"브룸-예튼 모형은 상황에 따라 독단적 결정부터 집단 참여 결정까지 최적의 참여 수준을 선택하도록 의사결정 나무를 제공한다."},{"ch":"ch5","text":"허시와 블랜차드(Hersey & Blanchard)의 상황 리더십 이론에서 리더의 행동 유형을 결정하는 가장 핵심적인 상황 변수는?","options":["리더가 가진 합법적 권력의 크기","구성원의 성숙도(능력과 의지/준비성)","조직의 물리적 환경과 자원의 풍부함","경쟁 기관의 역량과 시장의 변화 속도"],"ans":1,"exp":"허시-블랜차드 상황 리더십에서 핵심 변수는 구성원의 성숙도(역량+의지)이며, 이에 따라 지시형·코칭형·지원형·위임형을 선택한다."},{"ch":"ch5","text":"리더-구성원 교환 이론(LMX 이론)에서 리더가 모든 구성원을 차별 없이 대하는 것이 아니라, 수직적 쌍관계(Dyad)를 통해 '내집단(In-group)'과 '외집단(Out-group)'으로 나누어 대한다고 보는 관점의 특징은?","options":["외집단 구성원이 내집단 구성원보다 더 높은 몰입도와 성과를 보인다.","리더와 구성원 간의 관계적 질(Quality)이 리더십의 효과성에 중요한 영향을 미친다.","내집단은 공식적인 계약 관계에만 철저히 의존하는 관계이다.","시간의 흐름에 따라 내집단과 외집단의 구분은 자연스럽게 소멸된다."],"ans":1,"exp":"LMX 이론에서 핵심은 리더와 구성원 간 관계의 질(Quality)이며, 내집단은 높은 신뢰·자율·지원을 받아 더 높은 성과와 몰입을 보인다."},{"ch":"ch5","text":"리더십 상황 이론을 청소년 리더십 개발에 적용할 때의 시사점으로 가장 적절하지 않은 것은?","options":["리더십은 고정된 자질이 아니라 상황과 맥락에 따라 유연한 과정임을 알게 한다.","동아리, 학급, 아르바이트 등 청소년이 처한 다양한 상황적 요구를 진단하는 안목을 길러준다.","또래 구성원의 능력과 동기(성숙도) 수준을 파악하고 이에 맞는 리더십을 발휘하도록 유도한다.","청소년기에는 상황을 통제하기 어려우므로, 상황에 맞추기보다는 리더 고유의 방식을 고집하는 것이 효과적이다."],"ans":3,"exp":"상황 이론의 핵심은 상황에 맞게 리더십을 유연하게 발휘하는 것이다. 자신만의 방식을 고집하는 것은 상황 이론의 취지와 정반대이다."},{"ch":"ch6","text":"막스 베버(Max Weber)가 제시한 3가지 유형의 권위(authority) 중 리더의 신성함, 영웅적 행위, 또는 비범한 자질에 대한 구성원의 신뢰와 헌신에 기반을 두는 권위는?","options":["전통적 권위","합법적·합리적 권위","카리스마적 권위","강제적 권위"],"ans":2,"exp":"베버의 카리스마적 권위는 리더의 비범한 자질, 영웅적 행위, 또는 신성함에 대한 구성원의 신뢰와 헌신에서 발생한다."},{"ch":"ch6","text":"진정성 리더십(Authentic Leadership)에 대한 설명으로 가장 적절하지 않은 것은?","options":["리더가 자신의 가치관, 신념, 강점과 약점을 깊이 자각하는 것을 포함한다.","단순히 외적인 직위나 권력을 획득하는 기술보다 자신의 존재에 대한 자각을 중시한다.","가치와 행동 간의 차이를 메우며 내면의 위선을 지속적으로 점검한다.","구성원을 조종하거나 자신의 이익을 극대화하기 위해 외적 이미지를 정교하게 연출하는 리더십이다."],"ans":3,"exp":"진정성 리더십은 내면의 가치와 행동을 일치시키는 것이 핵심이다. 조종이나 이미지 연출은 진정성과 정반대이다."},{"ch":"ch6","text":"변혁적 리더십(Transformational Leadership)의 핵심 구성요소에 해당하지 않는 것은?","options":["카리스마(이상적인 영향력)","영감적 동기유발","지적 자극 및 개별적 배려","예외에 의한 관리 및 조건적 보상"],"ans":3,"exp":"예외에 의한 관리와 조건적 보상은 거래적 리더십(Transactional Leadership)의 구성요소이다. 변혁적 리더십의 4Is는 이상적 영향력·영감적 동기유발·지적 자극·개별적 배려이다."},{"ch":"ch6","text":"대니얼 골먼(Goleman) 등이 강조한 감성 리더십의 기반이 되는 '감성 지능'의 구성 요소로 가장 적절하지 않은 것은?","options":["자기인식 및 자기관리","사회적 인식(공감) 및 관계관리","이성적·수리적 데이터 분석 능력","타인의 감정을 이해하고 긍정적인 방향으로 유도하는 능력"],"ans":2,"exp":"감성 지능(EQ)은 자기인식·자기관리·사회적 인식·관계관리의 4가지 영역으로 구성된다. 수리적 데이터 분석은 인지적 지능(IQ)에 해당한다."},{"ch":"ch6","text":"현대 리더십 이론을 청소년 리더십 개발에 적용할 때 지도자가 지녀야 할 관점으로 옳은 것은?","options":["청소년들에게 영웅적이고 완벽한 카리스마적 리더십만을 롤모델로 강요한다.","\"리더십은 책임감이다\"라는 전제하에, 청소년 스스로 내면의 진정성을 발견하고 감성적으로 교류할 수 있도록 돕는다.","청소년 리더십은 오직 외적인 조건적 보상(상점, 상품 등)에 의해서만 유발된다고 본다.","감성 지능은 선천적인 것이므로 청소년기 프로그램으로 개발할 수 없다고 가정한다."],"ans":1,"exp":"진정성과 감성 지능을 기반으로 한 리더십 개발이 핵심이며, 감성 지능은 훈련을 통해 개발 가능하다."},{"ch":"ch7","text":"자기인식(Self-awareness)의 개념과 특성에 대한 설명으로 가장 적절하지 않은 것은?","options":["자기인식은 청소년 리더십 개발의 출발점이자 핵심 기초이다.","자기인식은 고정된 상태가 아니며, 주관적 성찰과 타인의 시선을 모두 포함한다.","사람들은 내면의 변화나 약점이 노출되는 불안감을 피하기 위해 자기인식에 저항하기도 한다.","진정한 자기인식은 타인과의 차이를 무시하고 나만의 기준을 타인에게 강요하는 힘을 기르는 것이다."],"ans":3,"exp":"진정한 자기인식은 타인과의 차이를 인정하고 이해하는 것이지, 자신의 기준을 타인에게 강요하는 것이 아니다."},{"ch":"ch7","text":"자기인식의 다차원적 영역 중 개인이 정보를 수집하고 평가하며 문제를 해결하는 고유한 심리적 경향성을 의미하는 차원은?","options":["감성지능(Emotional intelligence)","개인 가치(Personal value)","인지 스타일(Cognitive style)","변화 지향성"],"ans":2,"exp":"인지 스타일(Cognitive style)은 정보를 수집·평가하고 문제를 해결하는 개인 고유의 심리적 경향성 및 선호 방식을 의미한다."},{"ch":"ch7","text":"자기인식의 차원 중 '개인 가치(Personal value)'에 대한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 개인이 올바르다고 믿는 도덕적 표준과 행동의 길잡이가 된다.\nㄴ. 청소년기의 가치관 형성은 자아정체성 확립에 결정적인 역할을 한다.\nㄷ. 가치는 상황에 따라 매 순간 아무런 일관성 없이 쉽게 변하는 표면적 감정이다.","options":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"ans":0,"exp":"개인 가치는 비교적 안정적이고 지속적인 신념 체계이다. ㄷ은 가치를 표면적 감정과 혼동한 것으로 옳지 않다."},{"ch":"ch7","text":"청소년의 자기인식 개발을 저해하는 방해요인을 탐색하고 이를 극복하기 위한 방법으로 가장 적절한 것은?","options":["타인의 피드백을 차단하고 나만의 안전지대에 머무른다.","불경어수이경어인(不鏡於水而鏡於人)의 의미를 살려 동료와 지도자의 정직한 피드백을 수용한다.","위선을 가리기 위한 합리화와 방어기제를 더욱 강화한다.","개별적 차이를 인정하지 않고 무조건 집단의 대세에 순응한다."],"ans":1,"exp":"'물을 거울로 삼지 말고 사람을 거울로 삼으라'는 뜻의 불경어수이경어인처럼, 타인의 솔직한 피드백이 자기인식을 발전시키는 핵심 방법이다."},{"ch":"ch7","text":"청소년 자기인식 향상을 위한 실제 활동 프로그램으로 강의록에서 제안하거나 활용할 수 있는 방안과 거리가 먼 것은?","options":["자기를 인식하는 리더의 모습을 탐색하는 토론 활동","가치관 경매나 강점 서술을 통한 개인 가치 명료화 작업","군자화이부동(君子和而不同)의 가치를 깨닫는 개별 차이 이해 활동","타인의 감정을 무시하고 오직 자신의 주체성만 강조하는 독단적 훈련"],"ans":3,"exp":"타인의 감정을 무시하는 독단적 훈련은 자기인식 향상이 아닌 자기중심성을 강화하는 방향으로, 바람직한 활동과 거리가 멀다."},{"ch":"ch8","text":"스트레스의 개념 및 특징에 대한 설명으로 옳은 것은?","options":["스트레스는 언제나 인체에 해롭고 부정적인 결과만을 초래하는 역기능적 요인이다.","스트레스 유발요인에 직면했을 때 인체는 경고, 저항, 소진 등의 역동적인 반응 단계를 거친다.","스트레스에 대한 대처는 외부 환경을 변화시키는 행동만 존재하며 내면의 심리적 대처는 불가능하다고 본다.","청소년기는 발달 특성상 성인에 비해 스트레스를 전혀 느끼지 않는 안전지대이다."],"ans":1,"exp":"셀리에(Selye)의 일반적응증후군(GAS)에 따르면 스트레스 반응은 경고→저항→소진의 3단계를 거친다."},{"ch":"ch8","text":"마감 시간의 압박, 과도한 업무량이나 학업량 등 불가능해 보이는 시간 내에 목표를 달성하려 할 때 발생하는 스트레스 유발 요인과 이를 제거하기 위한 효과적인 전략은?","options":["대면 스트레스 요인 - 인간관계 단절","시간 스트레스 요인 - 효율적인 시간 관리 및 우선순위 설정","예상 스트레스 요인 - 무조건적인 낙관주의","상황 스트레스 요인 - 환경 변화 무시"],"ans":1,"exp":"시간 스트레스는 마감·과부하에서 비롯되며, 효율적인 시간 관리와 우선순위 설정이 핵심 해결 전략이다."},{"ch":"ch8","text":"대면 스트레스(Interpersonal stressor) 유발 요인을 제거하고 긍정적인 관계를 구축하기 위해 리더가 실천해야 할 방안으로 가장 적절한 것은?","options":["타인과의 소통을 줄이고 독단적으로 과업을 처리한다.","감성 지능을 발휘하여 협력적 관계를 형성하고 지원적 커뮤니케이션을 실천한다.","상대방의 행동을 비판하고 통제 위주의 합법적 권력을 강화한다.","갈등 상황을 무조건 회피하거나 억압한다."],"ans":1,"exp":"대면 스트레스는 대인관계에서 비롯되므로, 감성 지능과 지원적 커뮤니케이션을 통한 협력적 관계 구축이 핵심 대처 방안이다."},{"ch":"ch8","text":"열악한 환경이나 시련, 실패에 직면했을 때 역경을 극복하고 원래의 안정된 상태로 되돌아오거나 오히려 더 크게 성장하는 역동적인 능력을 무엇이라 하는가?","options":["통제 위치(Locus of Control)","개념적 장벽(Conceptual block)","회복탄력성(Resilience)","마키아벨리즘(Machiavellianism)"],"ans":2,"exp":"회복탄력성(Resilience)은 역경, 실패, 시련으로부터 회복하고 적응하며 성장하는 동적인 능력이다."},{"ch":"ch8","text":"청소년의 회복탄력성을 향상하기 위한 활동 및 지도 원칙으로 가장 적절하지 않은 것은?","options":["실패할 기회를 원천 차단하여 청소년이 상처받지 않도록 모든 과정을 대신 해결해 준다.","긍정적인 자아개념을 형성하고 자신의 강점을 발견할 수 있는 기회를 제공한다.","역경을 극복한 리더의 모습을 탐색하고 자발적 시도와 실패의 가치를 배우게 한다.","또래 집단 및 지도자와의 두터운 신뢰 및 사회적 지지망을 확충해 준다."],"ans":0,"exp":"실패 경험을 원천 차단하면 회복탄력성이 오히려 약화된다. 안전한 환경에서 실패를 경험하고 이를 극복하는 과정이 회복탄력성을 기른다."},{"ch":"ch9","text":"분석적 문제해결(Analytical problem solving)의 일반적인 4단계 순서가 올바르게 나열된 것은?","options":["대안모색 ➔ 문제정의 ➔ 대안평가 ➔ 해결책 실행","문제정의 ➔ 대안모색 ➔ 대안평가 ➔ 해결책 실행","문제정의 ➔ 대안평가 ➔ 대안모색 ➔ 해결책 실행","대안평가 ➔ 문제정의 ➔ 대안모색 ➔ 해결책 실행"],"ans":1,"exp":"분석적 문제해결의 4단계: 문제정의 → 대안모색 → 대안평가 → 해결책 실행. 문제를 명확히 정의한 후 대안을 탐색하는 순서가 핵심이다."},{"ch":"ch9","text":"분석적 문제해결의 첫 번째 단계인 '문제정의(Defining the problem)' 시 주의해야 할 사항으로 옳은 것은?","options":["증상(Symptom)과 실제 근본 원인(Cause)을 혼동하지 않고 명확히 구별해야 한다.","정보가 부족하더라도 직관에 의존하여 빠르게 사실을 왜곡 수용한다.","대안을 모색하기도 전에 문제정의 단계에서 해결책부터 미리 판단하고 확정한다.","문제와 관련된 다양한 이해관계자의 이해나 관점은 철저히 배제한다."],"ans":0,"exp":"문제정의 단계에서 가장 중요한 것은 증상(표면 현상)과 근본 원인을 혼동하지 않는 것이다. 증상만 해결하면 문제가 재발한다."},{"ch":"ch9","text":"분석적 문제해결의 '대안 모색 및 평가' 단계에 대한 설명으로 가장 적절하지 않은 것은?","options":["대안을 모색할 때는 가능한 한 다양한 대안들이 조기에 제안되도록 유도한다.","대안을 평가할 때는 조직의 목표 및 실현 가능성을 기준으로 삼아야 한다.","최적의 대안을 선택했다면 예상되는 부작용이나 한계점도 함께 고려해야 한다.","첫 번째로 떠오른 그럴듯한 대안이 있다면 다른 대안을 더 이상 고민할 필요 없이 즉시 평가를 종료한다."],"ans":3,"exp":"첫 번째 대안에 만족하여 탐색을 종료하는 것은 최적 해결책 발견을 방해한다. 다양한 대안을 탐색한 후 비교·평가하는 것이 바람직하다."},{"ch":"ch9","text":"청소년들이 분석적 문제해결 능력을 습득하는 과정에서 겪을 수 있는 장벽을 극복하고 효과적인 학습을 유도하기 위한 방안은?","options":["청소년의 현재 능력 수준을 훨씬 뛰어넘는 거대하고 추상적인 주제만 부여한다.","자발적 실패의 기회를 줄이고 처음부터 완벽한 결과물만 도출하도록 규제한다.","과제 난이도와 청소년의 역량 간의 균형을 고려하여 몰입할 수 있는 환경을 제공한다.","타인과의 협력 없이 오직 개인의 독자적인 분석 능력만 사용하도록 장벽을 세운다."],"ans":2,"exp":"몰입(Flow) 상태를 유발하려면 과제 난이도와 역량 수준이 적절히 균형을 이루어야 한다. 너무 어렵거나 쉬우면 몰입이 깨진다."},{"ch":"ch9","text":"시제품을 빠르게 만들어 보고(Rapid prototyping) 피드백을 통해 문제를 수정해 나가는 과정이 청소년 문제해결력 향상에 주는 시사점은?","options":["완벽한 계획 수립만이 실패를 막는 유일한 길임을 깨닫게 한다.","숙고(熟考)의 과정 없이 무조건 충동적으로 행동하는 습관을 기른다.","시행착오와 자발적 실패를 통해 문제를 다각도로 재정의하고 실질적인 해결책을 정교화할 수 있게 한다.","한 번 결정한 대안은 절대 수정하면 안 된다는 일관성을 강조한다."],"ans":2,"exp":"Rapid prototyping의 핵심은 빠른 시도와 피드백 반영을 통한 반복적 개선이다. 이 과정에서 자발적 실패를 통해 학습하고 해결책을 정교화한다."},{"ch":"ch10","text":"창의적 문제해결(Creative problem solving)과 '붉은 여왕 효과(Red Queen Effect)'의 관계에 대한 설명으로 옳은 것은?","options":["주변 환경이 급변할 때는 과거의 분석적 관행을 그대로 유지하는 것이 최선이다.","제자리에 머물기 위해서도 끊임없이 달려야 하는 역동적 환경 속에서, 리더는 기존 틀을 깨는 창의적 혁신과 접근법을 발휘해야 한다.","창의성은 경쟁이 전혀 없는 안정적인 환경에서만 발휘되는 정적인 능력이다.","분석적 문제해결만 완벽하다면 창의적 문제해결은 미래 사회에 불필요한 영역이다."],"ans":1,"exp":"붉은 여왕 효과는 '제자리를 지키려면 끊임없이 달려야 한다'는 의미로, 창의적 혁신의 지속적 필요성을 상징한다."},{"ch":"ch10","text":"창의적 문제해결을 가로막는 '개념적 장벽(Conceptual blocks)' 중 개인이 사물을 바라보거나 문제를 정의할 때 기존의 일관된 방식이나 하나의 통로에만 지나치게 의존하려는 경향은?","options":["일관성(Constancy)","몰입(Commitment)","압축(Compression)","안주(Complacency)"],"ans":0,"exp":"일관성(Constancy) 장벽은 문제를 하나의 방식이나 시각으로만 정의하려는 경향으로, 수직적 사고에 갇히는 것이다."},{"ch":"ch10","text":"과거의 성공 경험이나 기존의 규칙에 과도하게 몰입하여 새로운 대안이나 변화의 신호를 무시하고 현재 상태에 머무르려 하는 개념적 장벽은?","options":["일관성(Constancy)","몰입(Commitment)","압축(Compression)","안주(Complacency)"],"ans":1,"exp":"몰입(Commitment) 장벽은 과거의 성공 방식에 집착하여 새로운 가능성을 차단하는 것이다. 안주(Complacency)는 문제의식 자체가 없는 것이다."},{"ch":"ch10","text":"창의적 사고를 촉진하기 위해 '문제 정의를 향상시키는 방법'으로 강의록에서 제시하는 창의적 기법이 아닌 것은?","options":["문제를 다각도로 재정의해 보는 '문제의 다각화'","익숙한 것을 낯설게 보고 낯선 것을 익숙하게 바꾸어 보는 '시네틱스(Synectics)' 기법","기존의 고정관념을 정반대로 뒤집어 생각해보는 '역발상(Inversion)' 기법","처음 떠오른 단 하나의 정답만을 정해두고 생각을 즉시 종결하는 기법"],"ans":3,"exp":"하나의 정답만 고집하는 것은 창의적 사고를 방해하는 태도이다. 문제 재정의, 시네틱스, 역발상은 창의적 문제 정의를 돕는 기법이다."},{"ch":"ch10","text":"청소년들의 창의적 문제해결력을 향상하기 위해 '더 많은 대안을 생각하는 방법'으로 활용되는 활동 중, 비판을 전면 금지하고 자유분방한 분위기 속에서 편승과 기발한 아이디어를 도출하는 대표적인 회의 기법은?","options":["브레인스토밍(Brainstorming)","리더-구성원 교환 기법(LMX)","타당성 조사 기법","직무 명세서 분석 기법"],"ans":0,"exp":"브레인스토밍은 오스본(Osborn)이 제안한 기법으로, 비판 금지·자유분방·편승·다양성의 4가지 규칙 아래 최대한 많은 아이디어를 산출한다."},{"ch":"ch10","text":"10장 창의적 문제해결 중 '압축(Compression)' 장벽에 대한 설명으로 옳은 것은?","options":["과거의 성공 방식에 지나치게 집착하여 변화를 거부하는 현상이다.","주어진 문제의 범위를 너무 좁게 설정하여, 경계선을 치고 그 안에서만 대안을 찾으려는 장벽이다.","한 가지 언어나 사고 방식 채널만 고집하고 다각적인 분석을 하지 않는 장벽이다.","문제 해결에 대해 지나치게 안일하게 생각하여 질문을 던지지 않는 태도이다."],"ans":1,"exp":"압축(Compression) 장벽은 문제의 경계를 너무 좁게 그어 그 안에서만 해결책을 찾으려는 경향이다. 문제의 범위를 넓혀 보는 것이 돌파구가 된다."},{"ch":"ch11","text":"대인관계에서 비효과적인 커뮤니케이션이 가져오는 영향으로 가장 적절하지 않은 것은?","options":["구성원 간의 신뢰를 무너뜨리고 갈등을 심화시킨다.","정보를 왜곡되게 전달하여 조직의 생산성을 저하시킨다.","구성원의 방어기제를 자극하여 상호 협력적인 태도를 이끌어낸다.","소통의 부재로 인해 리더의 영향력과 신뢰도가 약화된다."],"ans":2,"exp":"방어기제가 자극되면 협력이 아닌 방어와 회피 태도가 강화된다. 비효과적인 커뮤니케이션은 방어기제를 높여 협력을 방해한다."},{"ch":"ch11","text":"지원적 커뮤니케이션(Supportive communication)의 원칙 중, 상대방의 인격이나 성향을 심판하고 낙인찍지 않으며, 발생한 객관적 사실과 상황을 있는 그대로 서술하는 방식은?","options":["생각과 감정이 일치하는 커뮤니케이션","(평가가 아닌) 기술적인 커뮤니케이션","(사람 중심이 아닌) 문제 중심의 커뮤니케이션","(포괄적이지 않은) 구체적인 커뮤니케이션"],"ans":1,"exp":"기술적인(Descriptive) 커뮤니케이션은 인격 판단 없이 관찰 가능한 행동과 사실을 객관적으로 서술하는 방식이다."},{"ch":"ch11","text":"상대방의 존재와 가치를 존중하고 개인을 인정하는 커뮤니케이션을 실천하기 위한 방법으로 가장 적절한 것은?","options":["상대방의 의견에 동의하지 않더라도 정체성을 부정하지 않고 존중하며 경청한다.","리더의 합법적 지위를 강조하며 일방적으로 메시지를 하달한다.","상대방의 말을 중간에 끊고 리더의 판단이 항상 옳음을 설득한다.","갈등이 발생하면 개인의 자존감을 낮추는 비판적 언어를 사용한다."],"ans":0,"exp":"상대방의 의견에 동의하지 않더라도 그 존재와 정체성을 존중하는 태도가 지원적 커뮤니케이션의 핵심이다."},{"ch":"ch11","text":"지원적 경청(Supportive listening)에 대한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 단순히 소리를 듣는 것을 넘어 상대방의 생각과 감정을 능동적으로 이해하는 과정이다.\nㄴ. 상대방이 말을 끝내기 전에 리더가 판단한 해결책을 즉시 지시하는 것이 핵심이다.\nㄷ. 적절한 언어적·비언어적 피드백을 통해 리더가 경청하고 있음을 전달한다.","options":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"ans":2,"exp":"지원적 경청은 능동적 이해(ㄱ)와 언어·비언어적 피드백(ㄷ)을 포함한다. ㄴ은 적극적 경청을 방해하는 행동이다."},{"ch":"ch11","text":"청소년의 커뮤니케이션 능력 개발을 방해하는 요인을 탐색하고 이를 향상하기 위한 실제 활동으로 가장 적절한 것은?","options":["토론이나 역할극을 통해 비폭력 대화(NVC)와 지원적 경청을 실습해 본다.","소통 능력을 기르기 위해 집단의 다수 의견에 무조건 순응하도록 강요한다.","갈등이 생기면 커뮤니케이션을 전면 중단하고 각자 해결하도록 방치한다.","리더로서 권위형 행동 방식을 일방적으로 연습하게 유도한다."],"ans":0,"exp":"비폭력 대화와 지원적 경청을 토론·역할극을 통해 실습하는 것이 가장 효과적인 커뮤니케이션 능력 개발 방법이다."},{"ch":"ch12","text":"동기유발(Motivation)의 개념과 특징에 대한 설명으로 가장 적절하지 않은 것은?","options":["개인이 특정 목표를 향해 행동을 시작하고, 방향을 잡고, 지속하게 만드는 역동적인 과정이다.","내재적 동기는 외부의 보상이나 처벌에 의해 유발되는 동기를 의미한다.","청소년의 동기유발 요인은 개인의 욕구 수준과 처한 환경에 따라 다양하게 나타난다.","리더는 구성원의 동기 유형을 파악하여 적절한 환경을 조성해 줄 필요가 있다."],"ans":1,"exp":"내재적 동기는 활동 자체에서 느끼는 흥미·즐거움·성장감에서 비롯된다. 외부 보상·처벌에 의한 것은 외재적 동기이다."},{"ch":"ch12","text":"인간의 욕구를 성취욕구, 권력욕구, 친교욕구의 세 가지로 분류하고, 특히 리더에게는 성취욕구와 함께 조직을 이끌기 위한 사회화된 권력욕구가 중요하다고 강조한 동기유발 내용 이론은?","options":["매슬로우(Maslow)의 욕구위계론","알더퍼(Alderfer)의 ERG 이론","맥클리란드(McClelland)의 성취동기이론","브룸(Vroom)의 기대이론"],"ans":2,"exp":"맥클리란드의 성취동기이론은 성취욕구·권력욕구·친교욕구의 3가지를 제시하며, 효과적인 리더에게는 사회화된 권력욕구가 중요하다고 본다."},{"ch":"ch12","text":"동기유발 과정 이론 중, 개인이 투입한 노력과 그에 따라 얻은 보상의 비율을 타인의 비율과 비교하여 불공정성을 느낄 때 이를 해소하는 방향으로 동기가 유발된다고 보는 이론은?","options":["공정성 이론(Equity theory)","목표설정 이론(Goal setting theory)","조절초점 이론(Self-regulatory focus theory)","기대이론(Expectancy theory)"],"ans":0,"exp":"공정성 이론(애덤스)은 자신의 투입/산출 비율을 타인과 비교하여 불공정 지각 시 이를 해소하려는 동기가 발생한다고 설명한다."},{"ch":"ch12","text":"로크(Locke)의 목표설정 이론에서 제시하는 효과적인 목표의 조건으로 가장 적절한 것은?","options":["실현 가능성이 전혀 없을 정도로 막연하고 거대한 목표","\"최선을 다하라\"와 같이 추상적이고 포괄적인 목표","난이도가 적절히 높으면서도 명확하고 구체적인 목표","개인의 가치관이나 조직의 비전과 전혀 연계되지 않은 목표"],"ans":2,"exp":"로크의 목표설정 이론에서 동기를 극대화하는 목표는 명확하고 구체적이며 적절히 도전적인 수준이어야 한다. SMART 목표의 이론적 기반이다."},{"ch":"ch12","text":"청소년들의 동기유발을 유도하기 위해 보상과 규율을 활용하거나 피드백을 제공할 때 지도자가 지녀야 할 올바른 태도는?","options":["결과 중심의 외적 보상만을 일방적으로 제공하여 경쟁을 부추긴다.","목표 달성 과정에 대한 구체적이고 긍정적인 피드백을 통해 내재적 동기를 강화한다.","청소년이 실패했을 때는 강제적 권력을 사용하여 엄격하게 처벌한다.","피드백은 지도자의 주관적인 평가만을 일방적으로 전달하는 방식으로 진행한다."],"ans":1,"exp":"내재적 동기를 강화하려면 결과보다 과정에 대한 구체적이고 긍정적인 피드백이 중요하다."},{"ch":"ch13","text":"팀(Team)의 개념과 팀워크의 특징에 대한 설명으로 옳지 않은 것은?","options":["공동의 목적을 달성하기 위해 상호 보완적인 기술을 가진 사람들이 모인 집단이다.","팀워크는 시너지를 창출하여 개인의 능력을 뛰어넘는 높은 성과를 낼 수 있다.","팀 활동 시 발생하는 '사회적 태만(무임승차)' 현상은 팀워크의 잠재적 단점 중 하나이다.","팀의 성과와 발달은 결성 초기부터 아무런 갈등이나 과정 없이 즉각적으로 완성된다."],"ans":3,"exp":"터크맨의 팀 발달 단계처럼, 팀은 형성→혼란→규범→수행의 과정을 거쳐 발달한다. 즉각적 완성은 불가능하다."},{"ch":"ch13","text":"터크맨(Tuckman)의 팀 발달 단계 중, 구성원 간의 탐색이 이루어지고 규칙과 방향을 설정하며, 리더에게 의존하는 경향이 강한 결성 초기 단계는?","options":["형성(Forming) 단계","혼란(Storming) 단계","규범(Norming) 단계","수행(Performing) 단계"],"ans":0,"exp":"형성(Forming) 단계는 팀 결성 초기로, 구성원들이 서로를 탐색하고 리더에게 의존하며 규칙과 방향을 정하는 단계이다."},{"ch":"ch13","text":"팀 발달 단계 중 구성원 간의 가치관 충돌이나 주도권 다툼으로 인해 갈등과 대립이 표면화되는 '혼란(Storming) 단계'를 리더가 효과적으로 이끌기 위한 방안은?","options":["갈등을 무조건 억압하거나 반대 의견을 내는 구성원을 팀에서 배제한다.","팀이 와해되지 않도록 의사소통 통로를 열어두고 갈등을 건설적으로 조정한다.","리더의 역할을 내려놓고 팀이 스스로 해결할 때까지 전적으로 방치한다.","규칙 설정을 뒤로 미루고 무조건 수행 단계로 건너뛰도록 강요한다."],"ans":1,"exp":"혼란(Storming) 단계에서 리더는 갈등을 억압하거나 방치하지 않고, 소통 통로를 열고 건설적으로 조정하는 역할이 필요하다."},{"ch":"ch13","text":"팀 발달 단계 중 구성원들이 서로를 수용하고, 결속력이 강화되며, 팀 고유의 규칙과 역할 분담이 명확해져서 안정감을 찾는 단계는?","options":["형성(Forming) 단계","혼란(Storming) 단계","규범(Norming) 단계","수행(Performing) 단계"],"ans":2,"exp":"규범(Norming) 단계는 팀원 간 수용과 결속이 강화되고, 규칙·역할 분담이 명확해져 팀이 안정을 찾는 단계이다."},{"ch":"ch13","text":"효과적인 팀 운영을 위해 구성원들이 발휘해야 하는 '이로운 역할(팀 멤버십)'과 거리가 먼 것은?","options":["팀의 비전과 목표 달성을 위해 적극적으로 기여하는 역할","군자화이부동(和而不同)의 자세로 조화를 이루되 독립적인 의견을 제시하는 역할","건설적인 피드백을 제공하고 동료를 격려하는 역할","자신의 이익만을 앞세워 팀원들의 사기를 저하시키고 무임승차하는 역할"],"ans":3,"exp":"무임승차(사회적 태만)는 팀 성과를 저하시키는 해로운 역할이다. 이로운 멤버십은 기여, 조화 속 독립적 의견 표현, 격려 등이다."},{"ch":"ch14","text":"조직 내 갈등에 대한 현대적 관점으로 가장 적절한 것은?","options":["갈등은 무조건 유해하고 파괴적이므로 조직 내에서 반드시 제거해야 한다.","갈등은 조직 발전을 저해하는 요인일 뿐이므로 리더는 갈등을 인지하는 즉시 억압해야 한다.","갈등은 성장의 계기가 될 수 있는 자연스러운 현상이며, 어떻게 관리하느냐에 따라 건설적인 효과를 낼 수 있다.","리더십의 효과성은 조직 내 갈등의 빈도를 제로(0)로 만드는 능력에 의해 결정된다."],"ans":2,"exp":"현대적 갈등 관점(상호작용주의)은 적절한 수준의 갈등은 조직에 긍정적이며, 관리 방식에 따라 성장 기회가 될 수 있다고 본다."},{"ch":"ch14","text":"갈등의 원천 중 가치관의 차이, 성격적 불일치, 대인관계에서의 오해 등 사람 간의 심리적 대립에서 비롯되는 갈등 유형은?","options":["과업 갈등(Task conflict)","관계 갈등(Relationship conflict)","구조적 갈등","자원 갈등"],"ans":1,"exp":"관계 갈등(Relationship conflict)은 가치관 차이, 성격 불일치, 오해 등 대인관계의 심리적 대립에서 발생한다. 과업 갈등은 업무 방식의 차이이다."},{"ch":"ch14","text":"토마스(Thomas)의 갈등 행동 모형 중, 자신의 이익이나 주장은 완전히 양보하고 상대방의 요구와 의사에 무조건 맞추어 갈등을 해결하려는 유형은?","options":["경쟁형(Competing)","회피형(Avoiding)","수용형/수용(Accommodating)","타협형(Compromising)"],"ans":2,"exp":"수용형(Accommodating)은 독단성 낮음 + 협조성 높음으로, 자신의 이익을 포기하고 상대방의 요구를 수용하는 갈등 해결 방식이다."},{"ch":"ch14","text":"토마스의 갈등 행동 모형 중, 자신의 이익과 상대방의 이익을 모두 만족시키기 위해 양측이 윈-윈(Win-Win)할 수 있는 대안을 모색하는 가장 바람직한 접근 방식은?","options":["경쟁형(Competing)","협력형/협력(Collaborating)","회피형(Avoiding)","타협형(Compromising)"],"ans":1,"exp":"협력형(Collaborating)은 독단성 높음 + 협조성 높음의 조합으로, 양측의 근본적 이해관계를 모두 충족하는 Win-Win 해결책을 추구한다."},{"ch":"ch14","text":"협력적 갈등 해결 방안을 구축하기 위해 리더가 실천해야 할 원칙으로 옳지 않은 것은?","options":["사람과 문제를 분리하여 감정적 대립을 최소화한다.","각자의 숨겨진 실질적 이해관계(Interest)에 초점을 맞춘다.","상호 이익이 되는 다양한 대안을 함께 모색한다.","리더의 권력을 이용하여 한쪽의 입장만 일방적으로 수용하도록 강요한다."],"ans":3,"exp":"권력으로 일방 수용을 강요하는 것은 경쟁형 갈등 방식이다. 협력적 해결의 원칙은 사람과 문제 분리, 이해관계 중심, 공동 대안 탐색이다."},{"ch":"ch15","text":"청소년 리더십 개발 프로그램 중, 가상의 상황을 설정하고 청소년들이 각자의 역할을 맡아 직접 연기해 봄으로써 타인의 관점을 이해하고 공감 능력을 기르는 유형은?","options":["토론 프로그램","가치 경매 프로그램","역할극(Role-play) 프로그램","라운드 로빈(Round robin) 프로그램"],"ans":2,"exp":"역할극(Role-play)은 가상 상황에서 역할을 직접 연기함으로써 타인의 관점과 감정을 체험하고 공감 능력을 기르는 프로그램이다."},{"ch":"ch15","text":"청소년 리더십 프로그램 유형 중 다음 설명에 해당하는 토론 기법은?\n\n모든 참가자가 돌아가며 평등하게 발언 기회를 가지고 자신의 의견을 제시함으로써 소외되는 구성원 없이 다각도의 아이디어를 도출하는 방식","options":["시뮬레이션 프로그램","라운드 로빈(Round robin)","야영 및 여행 프로그램","예술과 공예 프로그램"],"ans":1,"exp":"라운드 로빈(Round robin)은 모든 참가자가 순서대로 발언 기회를 갖는 방식으로, 소수의 목소리도 반영되어 다양한 의견을 수집할 수 있다."},{"ch":"ch15","text":"청소년 지도자가 지녀야 할 행동 원칙 중 \"청소년이 할 수 있는 것은 청소년이 해야 한다\"가 시사하는 바는?","options":["지도자의 업무 부담을 줄이기 위해 모든 행정 처리를 청소년에게 전가한다.","청소년에게 주체적인 의사결정과 실행의 기회를 제공하여 리더십 잠재력을 스스로 개발하게 돕는다.","지도자는 아무런 가이드라인도 주지 않고 청소년을 방치한다.","완벽한 결과물을 만들기 위해 지도자가 처음부터 끝까지 대신 해결해 준다."],"ans":1,"exp":"이 원칙은 자기주도성과 역량 개발을 위한 것으로, 지도자가 아닌 청소년이 직접 경험하고 성장할 기회를 보장하기 위함이다."},{"ch":"ch15","text":"청소년 지도자의 행동 원칙 중 \"실패하도록 놔둔다\"의 진정한 교육적 의미로 가장 적절한 것은?","options":["청소년이 낙오자가 되도록 방치하고 관심을 끊는다.","실패는 부끄러운 것이므로 실패한 청소년을 엄격하게 문책한다.","안전한 환경 안에서 자발적 시도와 실패를 경험하게 함으로써 회복탄력성과 문제해결력을 기르게 한다.","처음부터 실패할 가능성이 높은 위험한 과제만 골라서 부여한다."],"ans":2,"exp":"안전한 환경 내에서의 자발적 실패는 회복탄력성, 문제해결력, 자기주도성을 기르는 핵심 교육 방법이다."},{"ch":"ch15","text":"청소년 지도자가 청소년과의 관계에서 신뢰를 쌓고 존경을 얻기 위해 실천해야 할 행동 원칙으로 옳지 않은 것은?","options":["청소년에게 거짓말하지 않고 정직하게 대한다.","말과 행동이 일치하도록 스스로 본보기가 된다.","자신이 모든 것을 가장 잘 안다고 가정하지 않고 청소년의 의견을 경청한다.","지도자는 완벽한 존재이므로 자신의 실수나 한계를 절대 인정해서는 안 된다."],"ans":3,"exp":"진정한 신뢰는 완벽함이 아니라 정직함·일관성·겸손함에서 온다. 실수와 한계를 인정하는 것이 오히려 신뢰를 강화한다."}];

// ── 목차 렌더링 ──
const tocList = document.getElementById('tocList');
chapters.forEach((ch, i) => {
  const items = quizData.filter(q => q.ch === ch.id);
  const count = items.length;
  const div = document.createElement('div');
  div.className = 'toc-item';
  div.innerHTML = `
    <span class="toc-num">${String(i+1).padStart(2,'0')}</span>
    <span class="toc-label">${ch.label}</span>
    <span class="toc-meta">${count > 0 ? count+'문항' : ''}</span>
  `;
  const btn = document.createElement('button');
  if (count > 0) {
    btn.className = 'toc-btn';
    btn.textContent = '문제풀기 →';
    btn.addEventListener('click', () => showQuiz(ch));
  } else {
    btn.className = 'toc-btn wip';
    btn.textContent = '준비중';
  }
  div.appendChild(btn);
  tocList.appendChild(div);
});

function showToc() {
  document.getElementById('tocWrap').style.display = 'block';
  document.getElementById('quizWrap').style.display = 'none';
  window.scrollTo(0, 0);
}

function showQuiz(ch) {
  document.getElementById('tocWrap').style.display = 'none';
  document.getElementById('quizWrap').style.display = 'block';
  document.getElementById('quizChTitle').textContent = ch.label;
  renderQuiz(ch.id);
  window.scrollTo(0, 0);
}

function renderQuiz(chId) {
  const wrap = document.getElementById('quizContent');
  wrap.innerHTML = '';
  const items = quizData.filter(q => q.ch === chId);
  if (!items.length) {
    wrap.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px 0;font-style:italic;">준비 중입니다.</p>';
    return;
  }
  items.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'qcard';

    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = `문제 ${qi + 1}`;
    card.appendChild(num);

    const text = document.createElement('div');
    text.className = 'q-text';
    text.textContent = q.text;
    card.appendChild(text);

    const opts = document.createElement('div');
    opts.className = 'options';

    const expBox = document.createElement('div');
    expBox.className = 'exp-box';
    expBox.innerHTML = `<div class="exp-label">해설</div>${q.exp}`;

    const resetBtn = document.createElement('button');
    resetBtn.className = 'reset-btn';
    resetBtn.textContent = '↺ 다시 풀기';
    resetBtn.style.display = 'none';

    let answered = false;

    q.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-mark">${MARKS[oi]}</span><span>${opt}</span>`;

      btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;

        // 모든 버튼 비활성화
        opts.querySelectorAll('.opt-btn').forEach((b, bi) => {
          b.disabled = true;
          if (bi === q.ans) {
            // 정답 표시
            if (bi === oi) {
              b.classList.add('correct'); // 내가 고른 정답
            } else {
              b.classList.add('reveal'); // 내가 안 고른 정답
            }
          } else if (bi === oi) {
            b.classList.add('wrong'); // 내가 고른 오답
          }
        });

        expBox.classList.add('visible');
        resetBtn.style.display = 'inline-flex';
      });

      opts.appendChild(btn);
    });

    resetBtn.addEventListener('click', () => {
      answered = false;
      opts.querySelectorAll('.opt-btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('correct','wrong','reveal');
      });
      expBox.classList.remove('visible');
      resetBtn.style.display = 'none';
    });

    card.appendChild(opts);
    card.appendChild(expBox);
    card.appendChild(resetBtn);
    wrap.appendChild(card);
  });
}
</script>
</body>
</html>
